<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>432UP Partner | Minhas Propostas</title>
  
  <!-- CSS Global do Site -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --cyan-b2b: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.25);
    }

    /* FUNDO VIDRO B2B CIANO PADRÃO ORIGINAL */
    .glass-b2b {
      background: linear-gradient(135deg, rgba(10, 18, 28, 0.75) 0%, rgba(14, 22, 35, 0.5) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--cyan-glow);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #formAlert { display: none; }
    #formAlert.show { display: block; }
    .btn-loading { opacity: .6; pointer-events: none; }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.8);
    }
  </style>
</head>
<body class="h-full text-slate-200 font-sans antialiased bg-[#06080c] overflow-x-hidden">

  <!-- Fundo Espacial Integrado ao CSS do Projeto -->
  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <!-- HEADER E MENU MOBILE INJETADOS VIA PARTNER-HEADER.JS -->
  <header id="calc-header"></header>
  <div id="mobile-menu"></div>

  <!-- CONTAINER DE CONTEÚDO EM FLUXO VERTICAL -->
  <div class="flex flex-col min-h-screen relative z-10 pb-16">

    <main class="flex-1 p-4 lg:p-8 space-y-6 pt-20 lg:pt-24 w-full max-w-7xl mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Minhas Propostas</h1>
          <p class="text-sm text-slate-400 mt-1">Histórico completo, gestão de orçamentos e acompanhamento comercial.</p>
        </div>
        <a href="nova-proposta.html" class="inline-flex items-center justify-center space-x-2 px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition shadow-[0_0_20px_rgba(245,158,11,0.3)] shrink-0">
          <span>⚡</span><span>Nova Proposta</span>
        </a>
      </div>

      <div id="formAlert" class="p-3 rounded-xl text-xs font-semibold"></div>

      <!-- BARRA DE FILTROS E PESQUISA GLOBAL -->
      <div class="glass-b2b rounded-2xl p-4 border border-cyan-500/20 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          
          <!-- Busca Textual -->
          <div>
            <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Buscar Cliente / Proposta</label>
            <input type="text" id="filterBusca" placeholder="Ex: #1043, Roberto ou Pacote Ouro" oninput="aplicarFiltros()" class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-cyan-400 focus:outline-none transition">
          </div>

          <!-- Filtro por Status -->
          <div>
            <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Status da Proposta</label>
            <select id="filterStatus" onchange="aplicarFiltros()" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-cyan-400 focus:outline-none transition cursor-pointer">
              <option value="">Todos os Status</option>
              <option value="rascunho">📝 Rascunho</option>
              <option value="hold">⏳ Hold 48h</option>
              <option value="enviada">🚀 Enviada</option>
              <option value="aprovada">🟢 Aprovada</option>
              <option value="cancelada">🔴 Cancelada</option>
            </select>
          </div>

          <!-- Filtro por Data do Evento -->
          <div>
            <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Data do Evento</label>
            <input type="date" id="filterDataEvento" onchange="aplicarFiltros()" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-cyan-400 focus:outline-none transition [color-scheme:dark]">
          </div>

        </div>

        <!-- RESUMO DINÂMICO FOCADO 100% NA COMISSÃO -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pt-2 border-t border-white/5 text-xs text-slate-400">
          <div id="boxResumoFiltro">
            Exibindo <strong id="txtQtdPropostas" class="text-white">0</strong> propostas • Sua Comissão Estimada: <strong id="txtComissaoFiltro" class="text-amber-400 font-bold text-sm">R$ 0,00</strong>
          </div>
          <button type="button" onclick="limparFiltros()" class="text-[11px] text-slate-400 hover:text-cyan-400 transition cursor-pointer flex items-center gap-1">
            🔄 Resetar Filtros
          </button>
        </div>
      </div>

      <!-- TABELA DE PROPOSTAS -->
      <div class="glass-b2b rounded-2xl overflow-hidden border border-cyan-500/20">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm min-w-[950px]">
            <thead class="bg-white/5 border-b border-white/10 text-xs font-semibold uppercase text-slate-400">
              <tr>
                <th class="p-4">Identificador / Cliente</th>
                <th class="p-4">Data do Evento</th>
                <th class="p-4">Valor Comercial</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-right">Ações Disponíveis</th>
              </tr>
            </thead>
            <tbody id="tabelaPropostas" class="divide-y divide-white/5">
              <tr>
                <td colspan="5" class="p-6 text-xs text-slate-500 text-center">Carregando histórico de propostas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="partner-config.js"></script>
  <script src="../script/script.js" defer></script>
  <script src="partner-header.js"></script>

  <script>
    (function () {
      'use strict';

      var parceiroAtual = null;
      var timerInterval = null;
      var listaPropostas = [];
      var listaFiltrada = [];

      var STATUS_LABEL = {
        hold: { text: 'Hold 48h', cls: 'bg-amber-500/20 text-amber-300 border border-amber-500/40' },
        enviada: { text: 'Enviada', cls: 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' },
        aprovada: { text: 'Aprovada', cls: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' },
        cancelada: { text: 'Cancelada', cls: 'bg-red-500/20 text-red-300 border border-red-500/40' },
        adiada: { text: 'Adiada', cls: 'bg-slate-600/20 text-slate-400 border border-slate-600/40' },
        rascunho: { text: 'Rascunho', cls: 'bg-slate-500/20 text-slate-300 border border-slate-500/40' }
      };

      function fmtMoeda(n) { return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }
      function fmtData(d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : '—'; }
      
      function esc(s) { 
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;'); 
      }

      function formatarTempoRestante(dataExpira) {
        if (!dataExpira) return '48H 00M';
        var difMs = new Date(dataExpira) - new Date();
        if (difMs <= 0) return 'EXPIRADO';

        var horas = Math.floor(difMs / (1000 * 60 * 60));
        var minutos = Math.floor((difMs % (1000 * 60 * 60)) / (1000 * 60));

        return (horas < 10 ? '0' : '') + horas + 'H ' + (minutos < 10 ? '0' : '') + minutos + 'M';
      }

      function iniciarTimersHold() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function () {
          var badgesHold = document.querySelectorAll('[data-hold-expira]');
          badgesHold.forEach(function (el) {
            var expira = el.getAttribute('data-hold-expira');
            if (expira) {
              el.textContent = '⏳ ' + formatarTempoRestante(expira);
            }
          });
        }, 10000);
      }

      function showAlert(msg, type) {
        var el = document.getElementById('formAlert');
        if (!el) return;
        el.textContent = msg;
        el.className = 'p-3 rounded-xl text-xs font-semibold show ' +
          (type === 'success' ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-red-500/15 text-red-300 border border-red-500/30');
      }

      async function avisarTelegramProposta(dados) {
        try {
          const resposta = await fetch('https://www.432up.com/avisos-telegram', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(dados)
          });
          const texto = await resposta.text();
          console.log('[432UP Proposta → Telegram]', resposta.status, texto);
          return resposta.ok;
        } catch (erro) {
          console.error('[432UP Proposta → Telegram] Falha:', erro);
          return false;
        }
      }

      partnerRequireAuth().then(function (parceiro) {
        parceiroAtual = parceiro;
        partnerFillSidebar(parceiro);

        var roleNorm = String(parceiro.role || parceiro.nivel || '').toLowerCase().trim();
        var isAdmin = (roleNorm === 'admin' || roleNorm === 'master');
        if (typeof window.updateAdminState === 'function') {
          window.updateAdminState(isAdmin);
        }

        carregarPropostas(parceiro.id);
      }).catch(function(err) {
        console.error('Erro na autenticação:', err);
      });

      function carregarPropostas(parceiroId) {
        sbPartner.from('propostas')
          .select('*')
          .eq('parceiro_id', parceiroId)
          .order('criado_em', { ascending: false })
          .then(function (res) {
            var tbody = document.getElementById('tabelaPropostas');
            if (!tbody) return;

            if (res.error) {
              tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-xs text-red-400 text-center">Erro ao carregar propostas: ' + esc(res.error.message) + '</td></tr>';
              return;
            }

            listaPropostas = res.data || [];
            aplicarFiltros();
          });
      }

      /* LÓGICA DE FILTRAGEM E RESUMO DINÂMICO */
      window.aplicarFiltros = function () {
        var busca = (document.getElementById('filterBusca').value || '').toLowerCase().trim();
        var statusFiltro = (document.getElementById('filterStatus').value || '').toLowerCase().trim();
        var dataEventoFiltro = document.getElementById('filterDataEvento').value;

        listaFiltrada = listaPropostas.filter(function (p) {
          var numStr = String(p.numero || p.id || '').toLowerCase();
          var cliStr = String(p.cliente_nome || '').toLowerCase();
          
          var servicosStr = '';
          if (Array.isArray(p.itens)) {
            servicosStr = p.itens.map(function (i) { return i.nome; }).join(' ').toLowerCase();
          }

          var matchBusca = !busca || numStr.includes(busca) || cliStr.includes(busca) || servicosStr.includes(busca);

          var stKey = String(p.status || 'rascunho').toLowerCase().trim();
          var matchStatus = !statusFiltro || (stKey === statusFiltro);

          var matchData = !dataEventoFiltro || (p.data_evento === dataEventoFiltro);

          return matchBusca && matchStatus && matchData;
        });

        atualizarResumoFiltro(listaFiltrada);
        renderTabela(listaFiltrada);
      };

      window.limparFiltros = function () {
        document.getElementById('filterBusca').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDataEvento').value = '';
        aplicarFiltros();
      };

      function atualizarResumoFiltro(lista) {
        var totalQtd = lista.length;
        var pctComissao = (parceiroAtual && parceiroAtual.comissao_padrao_pct) ? Number(parceiroAtual.comissao_padrao_pct) : 10;
        
        var totalComissao = lista.reduce(function (acc, item) {
          var pct = item.comissao_pct_efetiva ? Number(item.comissao_pct_efetiva) : pctComissao;
          return acc + (Number(item.valor_total || 0) * (pct / 100));
        }, 0);

        document.getElementById('txtQtdPropostas').textContent = totalQtd;
        document.getElementById('txtComissaoFiltro').textContent = fmtMoeda(totalComissao);
      }

      function renderTabela(lista) {
        var tbody = document.getElementById('tabelaPropostas');
        if (!tbody) return;

        if (!lista || !lista.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-xs text-slate-500 text-center">Nenhuma proposta encontrada com os filtros selecionados.</td></tr>';
          return;
        }

        tbody.innerHTML = lista.map(function (p) {
          var stKey = String(p.status || 'rascunho').toLowerCase().trim();
          
          var isAprovada = (stKey === 'aprovada' || stKey === 'aprovado');
          var isCancelada = (stKey === 'cancelada' || stKey === 'cancelado');
          var isHold = (stKey === 'hold');
          var isRascunho = (stKey === 'rascunho');
          var isBloqueada = (isAprovada || isCancelada);

          var st = STATUS_LABEL[stKey] || (isAprovada ? STATUS_LABEL.aprovada : STATUS_LABEL.enviada);

          var servicosNomes = '—';
          if (Array.isArray(p.itens) && p.itens.length) {
            servicosNomes = p.itens.map(function (i) { return i.nome; }).join(' + ');
          }

          var numEsc = esc(p.numero || p.id);
          var cliEsc = esc(p.cliente_nome);

          var badgeStatusHtml = isHold 
            ? '<span data-hold-expira="' + (p.hold_expira_em || '') + '" class="px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap inline-flex items-center gap-1 ' + st.cls + '">⏳ ' + formatarTempoRestante(p.hold_expira_em) + '</span>'
            : '<span class="px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap inline-flex items-center gap-1 ' + st.cls + '">' + st.text + '</span>';

          var btnEnviarHtml = isRascunho 
            ? '<button data-enviar="' + p.id + '" class="action-btn bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 cursor-pointer" title="Promover para Enviada">🚀 Enviar</button>' 
            : '';

          // Se bloqueada (Aprovada/Cancelada), exibe Visualizar em Modo Leitura. Caso contrário, Editar.
          var btnEditarOuVisualizarHtml = isBloqueada
            ? '<a href="nova-proposta.html?id=' + p.id + '&mode=view" class="action-btn bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10" title="Visualizar Proposta (Modo Leitura)">👁️ Visualizar</a>'
            : '<a href="nova-proposta.html?id=' + p.id + '" class="action-btn bg-white/5 hover:bg-white/10 text-slate-200 border border-white/10">✏️ Editar</a>';

          var btnExcluirHtml = !isBloqueada
            ? '<button data-excluir="' + p.id + '" data-status="' + stKey + '" data-numero="' + numEsc + '" data-cliente="' + cliEsc + '" class="action-btn bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 cursor-pointer">🗑️</button>'
            : '';

          return '<tr class="hover:bg-white/[0.02] transition">' +
            '<td class="p-4">' +
              '<div class="font-bold text-white text-sm">#' + numEsc + ' — ' + cliEsc + '</div>' +
              '<span class="text-xs text-slate-400 truncate block max-w-xs">' + esc(servicosNomes) + '</span>' +
            '</td>' +
            '<td class="p-4 text-slate-300 text-xs font-medium whitespace-nowrap">' + fmtData(p.data_evento) + '</td>' +
            '<td class="p-4 font-bold text-white text-sm whitespace-nowrap">' + fmtMoeda(p.valor_total) + '</td>' +
            '<td class="p-4 whitespace-nowrap">' + badgeStatusHtml + '</td>' +
            '<td class="p-4 text-right">' +
              '<div class="inline-flex items-center justify-end gap-1.5 flex-nowrap">' +
                btnEnviarHtml +
                '<button onclick="enviarWhatsApp(\'' + p.id + '\')" class="action-btn bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 cursor-pointer" title="Enviar no WhatsApp">💬</button>' +
                '<button onclick="copiarLink(\'' + p.id + '\', this)" class="action-btn bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10 cursor-pointer" title="Copiar Link da Proposta">🔗</button>' +
                '<a href="nova-proposta.html?id=' + p.id + '" target="_blank" class="action-btn bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/30">📄 Ver</a>' +
                btnEditarOuVisualizarHtml +
                '<button data-duplicar="' + p.id + '" class="action-btn bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 cursor-pointer" title="Duplicar Proposta">📋</button>' +
                btnExcluirHtml +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('');

        iniciarTimersHold();

        tbody.querySelectorAll('[data-enviar]').forEach(function (btn) {
          btn.addEventListener('click', function () { 
            alterarStatusProposta(btn.dataset.enviar, 'enviada', btn); 
          });
        });

        tbody.querySelectorAll('[data-duplicar]').forEach(function (btn) {
          btn.addEventListener('click', function () { duplicarProposta(btn.dataset.duplicar, btn); });
        });

        tbody.querySelectorAll('[data-excluir]').forEach(function (btn) {
          btn.addEventListener('click', function () { 
            excluirProposta(btn.dataset.excluir, btn.dataset.status, btn.dataset.numero, btn.dataset.cliente, btn); 
          });
        });
      }

      /* DISPARO DIRETO DE WHATSAPP COM SUPORTE A IPAD / MOBILE */
      window.enviarWhatsApp = function (propostaId) {
        var p = listaPropostas.find(function (item) { return String(item.id) === String(propostaId); });
        if (!p) return;

        var fone = String(p.cliente_whatsapp || p.cliente_telefone || p.whatsapp || '').replace(/\D/g, '');
        var linkPublico = window.location.origin + '/partner/nova-proposta.html?id=' + p.id;
        
        var msg = 'Olá, ' + (p.cliente_nome || 'Cliente') + '! 👋\n\n' +
          'Segue a proposta comercial para o evento em ' + fmtData(p.data_evento) + ':\n' +
          '👉 ' + linkPublico + '\n\n' +
          'Fico à disposição para esclarecer qualquer dúvida!';

        var url = 'https://api.whatsapp.com/send?' + (fone ? 'phone=55' + fone + '&' : '') + 'text=' + encodeURIComponent(msg);
        
        var win = window.open(url, '_blank');
        if (!win || win.closed || typeof win.closed === 'undefined') {
          window.location.href = url;
        }
      };

      /* COPIAR LINK DA PROPOSTA PARA A ÁREA DE TRANSFERÊNCIA */
      window.copiarLink = function (propostaId, btn) {
        var p = listaPropostas.find(function (item) { return String(item.id) === String(propostaId); });
        if (!p) return;

        var linkPublico = window.location.origin + '/partner/nova-proposta.html?id=' + p.id;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(linkPublico).then(function () {
            var txtOrig = btn.innerHTML;
            btn.innerHTML = '✅';
            setTimeout(function () { btn.innerHTML = txtOrig; }, 2000);
          }).catch(function () {
            prompt('Copie o link da proposta:', linkPublico);
          });
        } else {
          prompt('Copie o link da proposta:', linkPublico);
        }
      };

      function alterarStatusProposta(propostaId, novoStatus, btn) {
        btn.classList.add('btn-loading');
        var payload = { 
          status: novoStatus,
          enviada_em: new Date().toISOString()
        };

        var p = listaPropostas.find(function (item) { return String(item.id) === String(propostaId); });

        sbPartner.from('propostas').update(payload).eq('id', propostaId).then(async function (res) {
          btn.classList.remove('btn-loading');
          if (res.error) {
            showAlert('Erro ao atualizar status: ' + res.error.message, 'error');
          } else {
            if (p && novoStatus === 'enviada') {
              var pct = p.comissao_pct_efetiva ? Number(p.comissao_pct_efetiva) : (parceiroAtual ? Number(parceiroAtual.comissao_padrao_pct) : 10);
              var comissaoValor = (Number(p.valor_total || 0) * pct) / 100;
              await avisarTelegramProposta({
                event: 'proposta_enviada',
                proposta_id: p.numero || p.id,
                parceiro_nome: parceiroAtual ? (parceiroAtual.nome || parceiroAtual.empresa) : 'Parceiro',
                cliente_nome: p.cliente_nome,
                tipo_evento: p.tipo_evento,
                data_evento: p.data_evento,
                local_evento: p.local_evento,
                valor_total: p.valor_total,
                comissao_valor: comissaoValor
              });
            }
            showAlert('Proposta enviada para o pipeline com sucesso!', 'success');
            carregarPropostas(parceiroAtual.id);
          }
        });
      }

      function duplicarProposta(propostaId, btn) {
        btn.classList.add('btn-loading');
        sbPartner.from('propostas').select('*').eq('id', propostaId).single().then(function (res) {
          if (res.error || !res.data) {
            showAlert('Erro ao buscar dados da proposta para duplicar.', 'error');
            btn.classList.remove('btn-loading');
            return;
          }

          var orig = res.data;
          var copiaPayload = {
            parceiro_id: parceiroAtual.id,
            cliente_nome: orig.cliente_nome + ' (Duplicata)',
            tipo_evento: orig.tipo_evento,
            data_evento: orig.data_evento,
            convidados_estimados: orig.convidados_estimados,
            duracao_horas: orig.duracao_horas,
            local_evento: orig.local_evento,
            observacoes: orig.observacoes,
            itens: orig.itens,
            valor_total: orig.valor_total,
            comissao_pct_efetiva: orig.comissao_pct_efetiva,
            status: 'rascunho',
            hold_expira_em: null
          };

          return sbPartner.from('propostas').insert(copiaPayload).then(function (insRes) {
            btn.classList.remove('btn-loading');
            if (insRes.error) {
              showAlert('Erro ao duplicar proposta: ' + insRes.error.message, 'error');
            } else {
              showAlert('Proposta duplicada com sucesso como Rascunho!', 'success');
              carregarPropostas(parceiroAtual.id);
            }
          });
        });
      }

      function excluirProposta(propostaId, status, numero, cliente, btn) {
        var stNorm = String(status || '').toLowerCase().trim();
        if (stNorm === 'aprovada' || stNorm === 'aprovado' || stNorm === 'cancelada' || stNorm === 'cancelado') {
          showAlert('Ação não permitida: Propostas aprovadas ou canceladas não podem ser excluídas.', 'error');
          return;
        }

        if (!confirm('Tem certeza que deseja excluir a proposta #' + numero + ' (' + cliente + ')?')) return;
        btn.classList.add('btn-loading');

        sbPartner.from('propostas').delete().eq('id', propostaId).then(function (res) {
          btn.classList.remove('btn-loading');
          if (res.error) {
            showAlert('Erro ao excluir proposta: ' + res.error.message, 'error');
          } else {
            showAlert('Proposta #' + numero + ' excluída com sucesso.', 'success');
            carregarPropostas(parceiroAtual.id);
          }
        });
      }
    })();
  </script>

</body>
</html>
