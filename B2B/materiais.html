<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>432UP Partner | Materiais de Venda</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-b2b {
      background: linear-gradient(135deg, rgba(10, 18, 28, 0.75) 0%, rgba(14, 22, 35, 0.5) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .material-card {
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .material-card:hover {
      border-color: rgba(0, 240, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
    }
    #formAlert { display: none; }
    #formAlert.show { display: block; }
    .btn-loading { opacity: .6; pointer-events: none; }
  </style>
</head>
<body class="h-full text-slate-200 font-sans antialiased bg-[#06080c] overflow-x-hidden">

  <!-- Fundo Espacial Integrado ao CSS do Projeto -->
  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <div class="flex flex-col md:flex-row min-h-screen relative z-10">
    
    <!-- HEADER MOBILE (GAVETA RESPONSIVA) -->
    <header class="md:hidden flex items-center justify-between p-4 glass-b2b border-b border-cyan-500/20 shrink-0 z-30">
      <a href="index.html" class="inline-block">
        <img src="../imagens/logo.png" alt="432UP! Produções" class="h-8 w-auto object-contain">
      </a>
      <button id="btnToggleMobileMenu" class="p-2 rounded-lg bg-white/10 text-cyan-400 font-bold text-lg focus:outline-none">
        ☰
      </button>
    </header>

    <!-- SIDEBAR B2B -->
    <aside id="sidebarMenu" class="hidden md:flex w-full md:w-64 glass-b2b flex-col justify-between p-5 shrink-0 z-20 transition-all duration-300">
      <div>
        <div class="hidden md:flex items-center space-x-3 mb-8">
          <a href="index.html" class="inline-block">
            <img src="../imagens/logo.png" alt="432UP! Produções" class="h-9 w-auto object-contain">
          </a>
          <span class="text-xs font-bold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">PARTNER</span>
        </div>

        <nav class="space-y-1.5">
          <a href="index.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition">
            <span>❖</span><span>Meu Painel</span>
          </a>
          <a href="nova-proposta.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-amber-400 font-semibold hover:bg-white/5 transition">
            <span>⚡</span><span>Nova Proposta</span>
          </a>
          <a href="propostas.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition">
            <span>▤</span><span>Minhas Propostas</span>
          </a>
          <a href="comissoes.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition">
            <span>$</span><span>Comissões</span>
          </a>
          <a href="materiais.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-cyan-500/10 text-cyan-300 font-bold border border-cyan-500/30">
            <span>📁</span><span>Materiais</span>
          </a>
          <a href="perfil.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition">
            <span>👤</span><span>Meu Perfil</span>
          </a>
        </nav>
      </div>

      <div class="pt-4 border-t border-white/10 mt-6 md:mt-0">
        <div class="flex items-center gap-2.5 mb-3">
          <div data-partner-avatar class="w-8 h-8 rounded-full bg-white/10 bg-cover bg-center shrink-0"></div>
          <span data-partner-nome class="text-xs font-semibold text-white truncate">—</span>
        </div>
        <button id="btnLogout" class="w-full text-left text-xs text-slate-500 hover:text-red-400 transition">Sair da conta</button>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
      <div>
        <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Recursos Comerciais</span>
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight mt-1">Materiais de Venda</h1>
        <p class="text-sm text-slate-400 mt-1">Riders, apresentações de alta definição e fotos para enviar ao seu cliente final.</p>
      </div>

      <div id="formAlert" class="p-3 rounded-xl text-xs font-semibold"></div>

      <div id="gridMateriais" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <p class="text-xs text-slate-500 py-8 col-span-full text-center">Carregando acervo de materiais...</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="partner-config.js"></script>
  <script src="../script/script.js" defer></script>
  <script>
    (function () {
      'use strict';

      var CATEGORIA_LABEL = {
        apresentacao_institucional: { text: 'Apresentação Geral', cls: 'text-cyan-400', icon: '📄' },
        ficha_tecnica: { text: 'Especificações Técnicas', cls: 'text-amber-400', icon: '🎛️' },
        imagens: { text: 'Imagens Cênicas', cls: 'text-emerald-400', icon: '🖼️' },
        video: { text: 'Vídeo Institucional', cls: 'text-purple-400', icon: '🎬' },
        outro: { text: 'Recurso Comercial', cls: 'text-slate-400', icon: '📁' }
      };

      function esc(s) { return String(s == null ? '' : s).replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      function showAlert(msg, type) {
        var el = document.getElementById('formAlert');
        el.textContent = msg;
        el.className = 'p-3 rounded-xl text-xs font-semibold show ' +
          (type === 'success' ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-red-500/15 text-red-300 border border-red-500/30');
      }

      partnerRequireAuth().then(function (parceiro) {
        partnerFillSidebar(parceiro);
        carregarMateriais();
        bindEvents();
      });

      function bindEvents() {
        document.getElementById('btnLogout').addEventListener('click', partnerLogout);

        var btnToggle = document.getElementById('btnToggleMobileMenu');
        var sidebar = document.getElementById('sidebarMenu');
        if (btnToggle && sidebar) {
          btnToggle.addEventListener('click', function () {
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('flex');
          });
        }
      }

      function carregarMateriais() {
        sbPartner.from('materiais')
          .select('*')
          .eq('ativo', true)
          .order('ordem', { ascending: true })
          .then(function (res) {
            var grid = document.getElementById('gridMateriais');
            if (res.error) {
              grid.innerHTML = '<p class="text-xs text-red-400 py-6 col-span-full text-center">Erro ao carregar materiais.</p>';
              return;
            }
            if (!res.data.length) {
              grid.innerHTML = '<p class="text-xs text-slate-500 py-8 col-span-full text-center">Nenhum material disponível no momento.</p>';
              return;
            }

            grid.innerHTML = res.data.map(function (m) {
              var cat = CATEGORIA_LABEL[m.categoria] || CATEGORIA_LABEL.outro;
              var tamStr = m.tamanho_bytes ? ' (' + (m.tamanho_bytes / (1024 * 1024)).toFixed(1) + 'MB)' : '';

              return '<div class="glass-b2b material-card p-6 rounded-2xl flex flex-col justify-between space-y-4 border border-cyan-500/20">' +
                '<div class="space-y-3">' +
                  '<div class="flex items-center justify-between">' +
                    '<span class="text-[10px] uppercase font-bold ' + cat.cls + ' tracking-wider">' + cat.text + '</span>' +
                    '<span class="text-xl">' + cat.icon + '</span>' +
                  '</div>' +
                  '<h3 class="text-base font-bold text-white tracking-tight">' + esc(m.titulo) + '</h3>' +
                  '<p class="text-xs text-slate-400 leading-relaxed">' + esc(m.descricao || 'Recurso oficial para download.') + '</p>' +
                '</div>' +
                '<button data-download="' + m.id + '" data-path="' + esc(m.storage_path) + '" data-bucket="' + esc(m.storage_bucket) + '" class="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-bold text-cyan-300 border border-cyan-500/30 transition shadow-[0_0_15px_rgba(0,240,255,0.05)]">' +
                  'Baixar Material' + tamStr +
                '</button>' +
              '</div>';
            }).join('');

            grid.querySelectorAll('[data-download]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                baixarArquivo(btn, btn.dataset.bucket, btn.dataset.path);
              });
            });
          });
      }

      function baixarArquivo(btn, bucket, path) {
        btn.classList.add('btn-loading');
        btn.textContent = 'Gerando link...';

        sbPartner.storage.from(bucket).createSignedUrl(path, 60).then(function (res) {
          btn.classList.remove('btn-loading');
          btn.textContent = 'Baixar Material';

          if (res.error || !res.data.signedUrl) {
            showAlert('Erro ao obter permissão de download.', 'error');
            return;
          }

          var a = document.createElement('a');
          a.href = res.data.signedUrl;
          a.target = '_blank';
          a.download = path.split('_').slice(1).join('_') || 'material';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        });
      }
    })();
  </script>
</body>
</html>
