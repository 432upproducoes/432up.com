<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Espelho do cliente · 432UP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    :root {
      --bg: #08080A;
      --text: #FFFFFF;
      --body: #E7E7EC;
      --mut: #9A97B0;
      --action: #00FF66;
      --purple: #A855F7;
      --pink: #FF007F;
      --tech: #06B6D4;
      --gold: #D4AF37;
      --alert: #FF4D4D;
      --line: rgba(255, 255, 255, 0.1);
    }
    body { background: var(--bg) !important; color: var(--text) !important; font-family: 'Inter', system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    .area {
      width: 100%; max-width: 760px; margin: 0 auto; position: relative; z-index: 2;
      padding-top: calc(var(--hdr-h, 112px) + 32px);
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
      padding-bottom: calc(120px + env(safe-area-inset-bottom));
    }
    html, body { height: auto !important; min-height: 100%; }
    body { overflow-y: visible !important; }
    .eyebrow { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; opacity: .72; color: var(--gold); }
    .titulo { font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.15; letter-spacing: -.03em; margin: 8px 0 6px; font-weight: 800; }
    .mut { color: var(--mut); }
    .box-full {
      border-radius: 24px; padding: 22px; position: relative; overflow: visible; margin-bottom: 16px;
      background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .box-full h2 {
      font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 12px; font-weight: 800;
    }
    .item {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .item:last-child { border-bottom: 0; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 800; padding: 4px 9px;
      border-radius: 999px; text-transform: uppercase; letter-spacing: .04em;
    }
    .t-ok { background: rgba(0, 255, 102, .14); color: var(--action); }
    .t-pend { background: rgba(212, 175, 55, .16); color: var(--gold); }
    .t-rec { background: rgba(255, 77, 77, .15); color: var(--alert); }
    .vivo { font-size: 12px; font-weight: 700; color: var(--action); }
    .vivo.off { color: var(--mut); }
    .vazio { color: var(--mut); font-size: 13px; padding: 6px 0; }
    a.link-back {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
      color: var(--tech); text-decoration: none; font-size: 14px; font-weight: 600;
    }
    a.link-back:hover { text-decoration: underline; }
  </style>
</head>
<body class="h-full antialiased overflow-x-hidden">

  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <header id="calc-header"></header>
  <div id="mobile-menu"></div>

  <div class="flex flex-col min-h-screen relative z-10">
    <main class="area">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
        <div>
          <span class="eyebrow">Admin · Espelho</span>
          <h1 class="titulo" id="titulo">Espelho do cliente</h1>
        </div>
        <span class="vivo" id="vivo">● ao vivo</span>
      </div>

      <div class="box-full"><div id="resumo" class="mut">Carregando…</div></div>
      <div class="box-full"><h2>Etapas</h2><div id="etapas"></div></div>
      <div class="box-full"><h2>Comprovantes</h2><div id="comps"></div></div>
      <div class="box-full"><h2>Instruções do cliente</h2><div id="obs"></div></div>
      <p><a class="link-back" href="projeto.html" id="voltar">← Voltar aos projetos</a></p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../partner-config.js"></script>
  <script src="../../script/script.js" defer></script>
  <script src="../partner-header.js"></script>
  <script>
(function () {
  'use strict';
  var CFG = window.PARTNER_CFG;
  var SB = window.sbPartner || window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  window.sbPartner = SB;

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var BRL = function (n) { try { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); } catch (e) { return ''; } };
  var ID = new URLSearchParams(location.search).get('id');
  var CANAL = null;

  var ST = { pendente: 'Em conferência', aprovado: 'Aprovado', recusado: 'Recusado', pago: 'Pago' };
  var STC = { pendente: 't-pend', aprovado: 't-ok', recusado: 't-rec', pago: 't-ok' };

  async function carregarTudo() {
    var p = await SB.from('propostas').select('numero, cliente_nome, tipo_evento, data_evento, status, assinado_em, cancelada_em').eq('id', ID).maybeSingle();
    if (p.data) {
      $('titulo').textContent = 'Espelho · #' + p.data.numero + ' · ' + (p.data.cliente_nome || '');
      $('resumo').innerHTML = E(p.data.tipo_evento || '') + ' · ' + E(p.data.data_evento || 'sem data') +
        ' · contrato ' + (p.data.assinado_em ? 'assinado' : 'não assinado') +
        (p.data.cancelada_em ? ' · <span class="tag t-rec">cancelado</span>' : '');
    }
    var et = await SB.from('evento_etapas').select('id, nome, hora, situacao, concluida_por, concluida_em, ordem').eq('proposta_id', ID).order('ordem');
    $('etapas').innerHTML = (et.data || []).length ? et.data.map(function (e) {
      var feita = e.situacao === 'concluida';
      return '<div class="item"><span>' + E(e.nome) + ' <span class="mut">' + E(e.hora || '') + '</span></span>' +
        '<span>' + (feita ? '<span class="tag t-ok">feita</span> <span class="mut">' + E(e.concluida_por || '') + '</span>' : '<span class="tag t-pend">pendente</span>') + '</span></div>';
    }).join('') : '<div class="vazio">Sem etapas.</div>';

    var cp = await SB.from('contrato_comprovantes').select('id, tipo, valor, data_pagamento, status, confirmado, motivo_recusa, enviado_em, enviado_por').eq('proposta_id', ID).order('enviado_em');
    $('comps').innerHTML = (cp.data || []).length ? cp.data.map(function (c) {
      var s = c.status || 'pendente';
      return '<div class="item"><span>' + E(c.tipo) + ' · ' + BRL(c.valor) + ' · ' + E(c.data_pagamento || '') + '</span>' +
        '<span><span class="tag ' + (STC[s] || 't-pend') + '">' + E(ST[s] || s) + '</span>' +
        (c.motivo_recusa ? ' <span class="mut">' + E(c.motivo_recusa) + '</span>' : '') + '</span></div>';
    }).join('') : '<div class="vazio">Nenhum comprovante.</div>';

    var ob = await SB.from('evento_observacoes').select('id, texto, criado_por, criado_em').eq('proposta_id', ID).is('removido_em', null).order('criado_em');
    $('obs').innerHTML = (ob.data || []).length ? ob.data.map(function (o) {
      return '<div class="item"><span>' + E(o.texto) + '</span><span class="mut">' + (o.criado_por === 'cliente' ? 'cliente' : 'equipe') + '</span></div>';
    }).join('') : '<div class="vazio">Nenhuma instrução.</div>';
  }

  function ligarTempoReal() {
    CANAL = SB.channel('espelho-' + ID)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'evento_etapas', filter: 'proposta_id=eq.' + ID }, carregarTudo)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'evento_observacoes', filter: 'proposta_id=eq.' + ID }, carregarTudo)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'contrato_comprovantes', filter: 'proposta_id=eq.' + ID }, carregarTudo)
      .subscribe(function (status) {
        var el = $('vivo');
        if (status === 'SUBSCRIBED') {
          el.textContent = '● ao vivo';
          el.classList.remove('off');
        } else {
          el.textContent = '○ sem conexão ao vivo';
          el.classList.add('off');
        }
      });
  }

  (async function init() {
    var s = await SB.auth.getSession();
    if (!(s.data && s.data.session)) { location.href = '../login.html'; return; }

    var r = await SB.from('parceiros').select('role, nivel').eq('user_id', s.data.session.user.id).maybeSingle();
    var papel = String((r.data && (r.data.role || r.data.nivel)) || '').toLowerCase().trim();
    var ehAdmin = /^(admin|master)$/i.test(papel);

    if (!ehAdmin) {
      document.querySelector('main').innerHTML = '<div class="box-full"><div class="vazio">Acesso restrito ao administrador.<br><br><span class="mut">Papel detectado: ' +
        (papel || 'nenhum') + '. Faça login com uma conta admin/master.</span></div></div>';
      return;
    }

    if (!ID) {
      document.querySelector('main').innerHTML = '<div class="box-full"><div class="vazio">' +
        '<strong>Falta o ID do projeto na URL.</strong><br><br>' +
        'Abra pelo painel de projetos (link “Espelho do cliente”) ou use:<br>' +
        '<code style="color:var(--tech)">/B2B/admin/espelho.html?id=UUID_DA_PROPOSTA</code><br><br>' +
        '<a class="link-back" href="projeto.html">← Ir para Projetos</a></div></div>';
      return;
    }

    $('voltar').href = 'projeto.html?id=' + encodeURIComponent(ID);
    await carregarTudo();
    ligarTempoReal();
  })();
})();
  </script>
</body>
</html>
