  <style>
    :root {
      --bg: #08080A;
      --bg-card: rgba(14,14,22,0.92);
      --bg-elevated: rgba(18,18,28,0.98);
      --border: rgba(0,255,102,0.18);
      --border-strong: rgba(0,255,102,0.35);
      --accent: #00FF66;
      --accent-dim: rgba(0,255,102,0.12);
      --text: #fff;
      --text-muted: rgba(255,255,255,0.55);
      --text-dim: rgba(255,255,255,0.35);
      --danger: #FF4D4D;
      --radius: 16px;
      --radius-sm: 10px;
      --cat-corporativo: #06B6D4;
      --cat-casamentos: #D4AF37;
      --cat-shows: #A855F7;
      --cat-festas: #FF8A4C;
      --secondary-lilac: #A855F7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    #painel-conteudo-admin { display: none; position: relative; min-height: 100vh; z-index: 2; }

    .scroll-stretcher-pixel { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    #orbit-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    #plasmaLayer { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    .admin-status-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.72rem; color: var(--text-muted);
      max-width: 1280px; margin: 0 auto; padding: 8px 28px 0;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .admin-busy-spin {
      width: 12px; height: 12px;
      border: 2px solid rgba(0,255,102,0.22);
      border-top-color: #00FF66;
      border-radius: 50%;
      animation: adminSpin 0.7s linear infinite;
      flex-shrink: 0;
    }
    .admin-busy-spin[hidden] { display: none !important; }
    @keyframes adminSpin { to { transform: rotate(360deg); } }

    /* Bloqueio visual/interativo do drag quando Modo Drag está OFF (simulador + galeria) */
    .sim-dnd-locked #dynamic-addons-list,
    .sim-dnd-locked .pkg-specs-list,
    .sim-dnd-locked #selected-bronze,
    .sim-dnd-locked #selected-prata,
    .sim-dnd-locked #selected-ouro {
      touch-action: pan-y;
    }
    .sim-dnd-locked #dynamic-addons-list li,
    .sim-dnd-locked #dynamic-addons-list .extra-item,
    .sim-dnd-locked .pkg-specs-list li,
    .sim-dnd-locked #selected-bronze > *,
    .sim-dnd-locked #selected-prata > *,
    .sim-dnd-locked #selected-ouro > * {
      cursor: default !important;
      user-select: text;
    }
    .sim-dnd-locked .sortable-ghost,
    .sim-dnd-locked .item-arrastando {
      opacity: 1 !important;
    }
    /* Galeria drag visuals (mesmo reforço pontilhado/ghost do simulador) */
    #galeria-grid .sortable-ghost,
    #galeria-grid .item-arrastando {
      opacity: 0.35 !important;
      outline: 2px dashed rgba(0,255,102,0.55) !important;
      outline-offset: 2px;
      background: rgba(0,255,102,0.06) !important;
    }
    #galeria-grid.gal-dnd-on .adm-card { cursor: grab; }
    #galeria-grid.gal-dnd-on .adm-card:active { cursor: grabbing; }
    .gal-dnd-locked #galeria-grid .adm-card { cursor: default !important; }

    /* ========== CONTENT AREA ========== */
    .admin-content-area {
      position: relative; z-index: 2;
      padding: 20px 28px 80px;
      max-width: 1280px; margin: 0 auto;
    }
    .module-page { display: none; }
    .module-page.active { display: block; }
    .module-page:not(#module-simulador) > .admin-content-area {
      padding-top: 112px;
    }
    .module-page:not(#module-simulador) .mod-header {
      margin-top: 0;
      margin-bottom: 28px;
    }
    .module-page:not(#module-simulador) .mod-header h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    #module-simulador .mod-header {
      margin: 0;
      padding: 112px 28px 16px;
    }
    #module-simulador .mod-header h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .mod-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .mod-header h2 { font-size: 1.4rem; font-weight: 800; }
    .mod-header p { font-size: 0.84rem; color: var(--text-muted); margin-top: 6px; }
    .mod-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 12px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s;
      background: rgba(255,255,255,0.06); color: var(--text);
      font-family: inherit;
    }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn-primary {
      background: var(--accent-dim); border-color: var(--border-strong); color: var(--accent);
    }
    .btn-primary:hover {
      background: var(--accent); color: #000;
      box-shadow: 0 0 20px rgba(0,255,102,0.35);
    }
    .btn-danger {
      background: rgba(255,77,77,0.1); border-color: rgba(255,77,77,0.3); color: var(--danger);
    }
    .btn-danger:hover { background: rgba(255,77,77,0.2); }
    .btn-sm { padding: 5px 10px; font-size: 0.75rem; border-radius: 8px; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .adm-input-admin {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,102,0.25);
      padding: 12px 14px; border-radius: 12px; color: #fff; font-size: 0.88rem;
      outline: none; box-sizing: border-box;
    }
    .adm-input-admin:focus { border-color: #00FF66; box-shadow: 0 0 12px rgba(0,255,102,0.3); }

    /* Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .item-card {
      background: linear-gradient(160deg, rgba(20,22,32,0.72), rgba(12,14,22,0.55));
      border: 1px solid rgba(0,255,102,0.16);
      border-radius: var(--radius);
      padding: 18px;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    }
    .item-card:hover {
      border-color: rgba(0,255,102,0.4);
      box-shadow: 0 14px 40px rgba(0,0,0,0.4), 0 0 24px rgba(0,255,102,0.1);
      transform: translateY(-3px);
    }
    .item-card.inactive { opacity: 0.55; }
    .item-card-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .item-card-title {
      font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      min-width: 0; max-width: 100%;
    }
    .item-card-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .item-card-actions {
      display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap;
      margin-left: auto;
    }
    .item-card-body { font-size: 0.84rem; color: var(--text-muted); }
    .price-tag {
      display: inline-block; background: var(--accent-dim); color: var(--accent);
      font-weight: 700; font-size: 0.9rem; padding: 4px 10px; border-radius: 8px; margin-top: 8px;
    }
    .badge {
      display: inline-block; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 2px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.08); color: var(--text-muted);
      white-space: nowrap;
    }
    .badge-on { background: var(--accent-dim); color: var(--accent); }
    .badge-star {
      background: rgba(255,200,0,0.18); color: #ffc800;
      font-size: 0.65rem; padding: 2px 6px;
    }

    /* Switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: rgba(255,255,255,0.12); border-radius: 22px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Forms / Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100050;
      background: rgba(8, 6, 14, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none; align-items: center; justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-overlay.open { display: flex !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; }
    .modal-box {
      width: 100%; max-width: 560px; max-height: 92vh;
      overflow-x: hidden !important; overflow-y: auto;
      background: linear-gradient(135deg, rgba(14, 14, 22, 0.98), rgba(28, 20, 48, 0.92));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(168, 85, 247, 0.30);
      border-radius: 24px; padding: 28px 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 40px rgba(168,85,247,0.18);
      position: relative; z-index: 100051;
      box-sizing: border-box;
    }
    .modal-box.wide { max-width: 720px; }
    .modal-box.xl { max-width: min(920px, 96vw); }
    .modal-box .form-row { max-width: 100%; }
    .modal-box .form-group input,
    .modal-box .form-group textarea,
    .modal-box .form-group select {
      max-width: 100%;
      min-width: 0;
    }
    .modal-box .specs-edit-list input {
      max-width: calc(100% - 48px);
      min-width: 0;
      box-sizing: border-box;
    }
    @media (max-width: 640px) {
      .modal-overlay { padding: 8px; align-items: flex-start; }
      .modal-box, .modal-box.wide, .modal-box.xl {
        max-width: 100% !important; width: 100%;
        border-radius: 18px; padding: 20px 16px;
        max-height: none; margin: 8px 0 24px;
      }
      .modal-box .form-row { flex-direction: column !important; }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;
    }
    .modal-header h3 { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .modal-close:hover { color: #00FF66; border-color: #00FF66; background: rgba(0,255,102,0.1); }

    .form-group { margin-bottom: 14px; min-width: 0; }
    .form-group label {
      display: block; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: #A855F7; margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(168, 85, 247, 0.28);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-group input::placeholder, .form-group textarea::placeholder {
      color: rgba(255,255,255,0.35);
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: #A855F7;
      background: rgba(168, 85, 247, 0.08);
      box-shadow: 0 0 12px rgba(168,85,247,0.25);
    }
    .form-row {
      display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
    }
    .form-row .form-group { flex: 1 1 120px; min-width: 100px; }
    .form-toggles {
      display: flex; flex-direction: column; gap: 10px;
      padding-top: 22px; flex: 0 0 auto;
    }
    .form-toggles .toggle-line {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.82rem; color: rgba(255,255,255,0.7);
      white-space: nowrap;
    }
    .form-section {
      border-top: 1px dashed var(--border); margin-top: 18px; padding-top: 16px;
    }
    .form-section-title {
      font-size: 0.72rem; font-weight: 700; color: #A855F7;
      margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
    }
    .advanced-toggle {
      font-size: 0.78rem; color: var(--accent); cursor: pointer;
      margin-top: 12px; display: inline-flex; align-items: center; gap: 4px; font-weight: 600;
    }
    .advanced-block { display: none; margin-top: 12px; }
    .advanced-block.open { display: block; }

    #modal-servico.modal-overlay {
      background: rgba(8, 6, 14, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    #modal-servico .modal-box.wide {
      max-width: min(900px, 96vw);
      width: 100%;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      padding: 0;
      background: linear-gradient(135deg, rgba(14,14,22,0.62), rgba(28,20,48,0.48));
      border: 1px solid rgba(168,85,247,0.3);
      box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 0 40px rgba(168,85,247,0.14);
    }
    #modal-servico .modal-header {
      margin: 0;
      padding: 22px 28px 10px;
      flex-shrink: 0;
    }
    #modal-servico .srv-modal-body {
      padding: 6px 28px 18px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1 1 auto;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    #modal-servico .srv-modal-foot {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 14px 28px 20px;
      border-top: 1px solid rgba(168,85,247,0.18);
      background: transparent;
    }
    #modal-servico .form-section {
      margin-top: 20px;
      padding-top: 16px;
    }
    #modal-servico .form-group { margin-bottom: 14px; }
    #modal-servico .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
      align-items: end;
    }
    #modal-servico .form-row .form-group {
      flex: none;
      min-width: 0;
      width: 100%;
      margin-bottom: 0;
    }
    #modal-servico .form-row.srv-row-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }
    #modal-servico .form-row.srv-row-id {
      grid-template-columns: 88px 1fr;
    }
    #modal-servico .form-toggles {
      padding-top: 0;
    }
    @media (max-width: 720px) {
      #modal-servico .form-row,
      #modal-servico .form-row.srv-row-3,
      #modal-servico .form-row.srv-row-id {
        grid-template-columns: 1fr;
      }
    }
    .unit-metro-picks {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .unit-metro-btn {
      min-width: 72px;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,255,102,0.25);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.7);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .unit-metro-btn.active {
      background: rgba(0,255,102,0.16);
      border-color: #00FF66;
      color: #00FF66;
    }

    .faixa-row {
      display: flex; gap: 6px; align-items: center; margin-bottom: 6px;
    }
    .faixa-row input {
      flex: 1; min-width: 0; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 8px; color: var(--text); font-size: 0.82rem;
    }
    .faixa-row label { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; }

    .srv-pick-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-top: 8px;
    }
    .srv-pick {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; font-size: 0.82rem; transition: border-color 0.15s;
    }
    .srv-pick:hover { border-color: var(--border-strong); }
    .srv-pick.checked { border-color: var(--accent); background: var(--accent-dim); }
    .srv-pick input { width: 16px; accent-color: var(--accent); }

    .transporte-card {
      max-width: 520px;
      background: linear-gradient(160deg, rgba(20,22,32,0.72), rgba(12,14,22,0.55));
      border: 1px solid rgba(0,255,102,0.18);
      border-radius: var(--radius); padding: 22px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* Leads */
    .leads-filters {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .leads-filters .field { min-width: 150px; flex: 1; }
    .leads-filters label {
      display: block; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--text-dim); margin-bottom: 4px;
    }
    .leads-filters input, .leads-filters select {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; color: var(--text); font-size: 0.84rem; outline: none;
    }
    .leads-stats { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 12px; }
    .lead-card {

  <script>

  function qs(s) { return document.querySelector(s); }
  function qsa(s) { return document.querySelectorAll(s); }
  function $(s) { return document.querySelector(s); }
  function $$(s) { return document.querySelectorAll(s); }
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 3800);

  function sbH(m) {
    var h = { 'apikey': SK, 'Authorization': 'Bearer ' + SK, 'Content-Type': 'application/json' };
    if (m === 'PATCH' || m === 'POST') h['Prefer'] = 'return=representation';
    return h;
  }
  async function sbGet(table, qs) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?' + qs, { headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
      if (!r.ok) throw r;
      return await r.json();
    } catch (e) { console.error('sbGet', table, e); return null; }
  }
  async function sbPatch(table, id, body) {

      var r = await fetch(SB + '/rest/v1/' + table + '?id=eq.' + id, { method: 'PATCH', headers: sbH('PATCH'), body: JSON.stringify(body) });

  // LEADS
  function getFilteredLeads() {
    var search = ($('#leadSearch').value || '').toLowerCase();
    var status = $('#leadStatusFilter').value;
    var origem = $('#leadOrigemFilter').value;
    return DATA.leads.filter(function (l) {
      if (search) {
        var nm = (l.nome || '').toLowerCase(), wa = (l.whatsapp || '').toLowerCase(), te = (l.tipo_evento || '').toLowerCase();
        if (nm.indexOf(search) < 0 && wa.indexOf(search) < 0 && te.indexOf(search) < 0) return false;
      }
      if (status && (l.status || 'novo') !== status) return false;
      if (origem && (l.origem || '') !== origem) return false;
      return true;
    });
  }
  function renderLeads() {
    var c = $('#leadsContainer'); if (!c) return;
    var leads = getFilteredLeads();
    $('#leadsTotal').textContent = DATA.leads.length;
    if (!leads.length) { c.innerHTML = '<div class="empty-state"><div class="icon">📊</div>Nenhum lead.</div>'; return; }
    var h = '';
    leads.forEach(function (l) {
      var status = l.status || 'novo';
      var waLink = l.whatsapp ? 'https://wa.me/' + l.whatsapp.replace(/\D/g, '') : '';
      h += '<div class="lead-card"><div class="lead-top"><div><input type="checkbox" ' + (selectedLeads[l.id] ? 'checked' : '') + ' onchange="toggleLeadSelect(\'' + l.id + '\',this.checked)" style="width:auto;margin-right:8px;accent-color:var(--accent)"><span class="lead-name">' + esc(l.nome || 'Sem nome') + '</span></div><span class="lead-date">' + (l.criado_em ? new Date(l.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—') + '</span></div><div class="lead-tags">';
      if (l.whatsapp) h += '<span class="lead-tag clickable" onclick="window.open(\'' + waLink + '\',\'_blank\')">📱 ' + esc(l.whatsapp) + '</span>';
      if (l.email) h += '<span class="lead-tag">✉ ' + esc(l.email) + '</span>';
      if (l.tipo_evento) h += '<span class="lead-tag">' + esc(l.tipo_evento) + '</span>';
      if (l.total) h += '<span class="lead-tag">💰 ' + esc(l.total) + '</span>';
      if (l.origem) h += '<span class="lead-tag">📍 ' + esc(l.origem) + '</span>';
      h += '</div><div style="margin:8px 0"><select class="lead-status-select" onchange="updateLeadField(\'' + l.id + '\',\'status\',this.value)"><option value="novo"' + (status === 'novo' ? ' selected' : '') + '>🟡 Novo</option><option value="em_contato"' + (status === 'em_contato' ? ' selected' : '') + '>🔵 Em contato</option><option value="fechado"' + (status === 'fechado' ? ' selected' : '') + '>🟢 Fechado</option><option value="perdido"' + (status === 'perdido' ? ' selected' : '') + '>🔴 Perdido</option></select></div>';
      if (l.mensagem) h += '<div class="lead-msg">' + esc(l.mensagem).substring(0, 300) + '</div>';
      h += '<div class="form-group" style="margin:0"><label style="font-size:0.65rem">Notas</label><textarea onchange="updateLeadField(\'' + l.id + '\',\'observacoes\',this.value)" rows="2" placeholder="Anotações..." style="font-size:0.82rem">' + (l.observacoes || '') + '</textarea></div></div>';
    });
    c.innerHTML = h;
  }
  function filterLeads() { renderLeads(); updateLeadSelectUI(); }
  function toggleLeadSelect(id, checked) { if (checked) selectedLeads[id] = true; else delete selectedLeads[id]; updateLeadSelectUI(); }
  function toggleSelectAll() {
    var leads = getFilteredLeads();
    var all = leads.every(function (l) { return selectedLeads[l.id]; });
    if (all) leads.forEach(function (l) { delete selectedLeads[l.id]; });
    else leads.forEach(function (l) { selectedLeads[l.id] = true; });
    renderLeads(); updateLeadSelectUI();
  }
  function updateLeadSelectUI() {
    var count = Object.keys(selectedLeads).length;
    $('#btnDeleteLeads').style.display = count > 0 ? '' : 'none';
    $('#leadsSelectedCount').style.display = count > 0 ? '' : 'none';
    $('#leadsSelCount').textContent = count;
  }
  async function updateLeadField(id, field, value) {
    var body = {}; body[field] = value;
    if (await sbPatch('co_leads', id, body)) {
      DATA.leads.forEach(function (l) { if (String(l.id) === String(id)) l[field] = value; });
      toast('Lead atualizado', 'ok');
    } else toast('Erro', 'err');
  }
  function deleteSelectedLeads() {
    var ids = Object.keys(selectedLeads);
    if (!ids.length) return;
    confirmShow('Excluir ' + ids.length + ' lead(s)?', async function (yes) {
      if (!yes) return;
      for (var i = 0; i < ids.length; i++) await sbDel('co_leads', ids[i]);
      selectedLeads = {};
      toast(ids.length + ' excluído(s)', 'ok');
      await loadPageData();
    });
  }
  function exportCSV() {
    var leads = getFilteredLeads();
    if (!leads.length) { toast('Nenhum lead', 'err'); return; }
    var headers = ['Nome','WhatsApp','Email','Tipo Evento','Data Evento','Local','Convidados','Horas','Total','Pacote','Origem','Status','Notas','Data Criação','Mensagem'];
    var rows = [headers.join(';')];
    leads.forEach(function (l) {
      rows.push([l.nome||'',l.whatsapp||'',l.email||'',l.tipo_evento||'',l.data_evento||'',l.local||'',l.convidados||'',l.horas||'',l.total||'',l.pacote||'',l.origem||'',l.status||'novo',l.observacoes||'',l.criado_em||'', '"'+(l.mensagem||'').replace(/"/g,'""').substring(0,200)+'"'].join(';'));
    });
    var blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = '432up_leads_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    toast('CSV exportado', 'ok');
  }

  // ============================================================

  async function loadPageData() {
    var data = await sbGet('co_leads', 'select=*&order=criado_em.desc&limit=200');
    var ok = data !== null;
    setDbStatus(ok);
    DATA.leads = data || [];
    renderLeads();
    if (ok) toast('Leads carregados', 'ok');
    else toast('Erro ao carregar', 'err');
  }
  window.__adminPageInit = function () { loadPageData(); };
  window.filterLeads = filterLeads;
  window.toggleLeadSelect = toggleLeadSelect;
  window.toggleSelectAll = toggleSelectAll;
  window.deleteSelectedLeads = deleteSelectedLeads;
  window.exportCSV = exportCSV;
  window.updateLeadField = updateLeadField;
  window.loadCalc1Data = loadPageData;
  window.confirmClose = confirmClose;


    partnerRequireAuth().then(function (parceiro) {
      partnerFillSidebar(parceiro);
      
      // Atualiza a flag de admin e valida o cache sem piscar o menu
      var roleNorm = String(parceiro.role || parceiro.nivel || '').toLowerCase().trim();
      var isAdmin = roleNorm === 'admin' || roleNorm === 'master';
      window.updateAdminState(isAdmin);

      if (typeof window.__adminPageInit === 'function') {
        window.__adminPageInit(parceiro, isAdmin);
      }
    }).catch(function (err) {
      console.error('Erro na autenticação:', err);
    });
  </script>
</body>
