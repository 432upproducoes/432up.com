<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Projetos · 432UP Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../partner-config.js"></script>
<style>
:root{
  --aurora-primary:#00FF66; --aurora-accent:#FF007F; --gold:#D4AF37; --purple:#A855F7;
  --tech:#06B6D4; --red:#FF4D4D; --text-body:#E7E7EC;
  --acc:#00FF66; --ouro:#D4AF37; --ciano:#06B6D4; --txt:#FFFFFF;
  --mut:rgba(231,231,236,.62); --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.045);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#08080A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#orbit-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.plasma-top-layer{position:fixed;inset:0;z-index:1;pointer-events:none}
body>*:not(canvas):not(#plasmaLayer){position:relative;z-index:2}
a{color:var(--ciano);text-decoration:none}

/* Cabeçalho da página */
header{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:118px 0 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border:0;background:none}
.hd-title{display:flex;flex-direction:column}
.kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--aurora-primary);opacity:.8;margin-bottom:10px}
h1{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.045em;line-height:1;margin:0;font-weight:800}
h2{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.vivo{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--aurora-primary);font-weight:700}
.link{font-size:13px;margin-left:4px}

/* Botões e campos — glass, ação em verde-limão só para ação */
button,select,input,textarea{font:inherit;color:#fff;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:999px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.3s ease;min-height:40px}
button{cursor:pointer}
button:hover{border-color:rgba(255,255,255,.38);background:rgba(255,255,255,.1);transform:translateY(-1px)}
button.primary{background:var(--aurora-primary);color:#08080A;border-color:var(--aurora-primary);font-weight:700;box-shadow:0 0 28px rgba(0,255,102,.18)}
button.danger{color:#FF9AB8;border-color:rgba(255,0,127,.35)}
button:disabled{opacity:.5;cursor:default;transform:none}
input,select,textarea{border-radius:14px;padding:10px 14px;background:rgba(0,0,0,.28)}
input[type=checkbox]{accent-color:var(--aurora-primary);width:15px;height:15px;min-height:0;padding:0;border-radius:4px;background:none;border:0;backdrop-filter:none}
select option{background:#0c0c10;color:#fff}

/* Caixas — glass cheia para blocos; vazia para leitura */
.card,.painel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:clamp(20px,3vw,30px);margin-bottom:14px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 0 50px rgba(168,85,247,.055)}
.painel{align-self:start}
.mut{color:var(--mut);font-size:12px}
.vazio{color:var(--mut);font-size:13px;padding:6px 0}
.msg{font-size:12px;min-height:16px;color:#FF9AB8;margin-top:8px}
.msg.ok{color:var(--aurora-primary)}

/* Tags semânticas */
.tag{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(255,255,255,.72)}
.t-ok,.tag.ok{color:var(--aurora-primary);border-color:rgba(0,255,102,.35);background:rgba(0,255,102,.08)}
.t-pend,.t-hold,.tag.pend{color:var(--gold);border-color:rgba(212,175,55,.35);background:rgba(212,175,55,.08)}
.t-rec,.t-x{color:var(--aurora-accent);border-color:rgba(255,0,127,.35);background:rgba(255,0,127,.07)}

/* Linhas de lista */
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row label,.grid2 label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:6px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== Projeto ===== */
.pg-projeto main{width:min(1180px,calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:0 0 60px}
.proj{padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:16px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.03);transition:.3s ease}
.proj:hover{border-color:rgba(255,255,255,.3)}
.proj.on{border-color:var(--aurora-primary);background:rgba(0,255,102,.06)}
.proj small{color:var(--mut);font-size:12px}
.pg-projeto input#busca{width:100%;margin-bottom:12px}

/* ===== Agenda ===== */
.pg-agenda header{padding-bottom:14px}
.filtros{width:min(1180px,calc(100% - 32px));margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(10,8,20,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:12px}
.filtros .lbl{color:var(--mut);margin-right:4px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.6rem}
.tog{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:5px 10px;border-radius:999px;border:1px solid transparent;color:var(--text-body)}
.tog:hover{border-color:rgba(255,255,255,.2)}
.tog.off{opacity:.4}
.tog .dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.legenda{width:min(1180px,calc(100% - 32px));margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);padding:0 6px}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pg-agenda main{width:min(1180px,calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 0 60px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dow{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);text-align:center;padding:6px 0;font-weight:700}
.dia{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:16px;min-height:96px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:.3s ease}
.dia:hover{border-color:rgba(0,255,102,.45)}
.dia.outro{opacity:.3}
.dia.hoje{outline:1px solid var(--aurora-primary);outline-offset:-1px}
.dia.sel{border-color:var(--aurora-primary);background:rgba(0,255,102,.06)}
.num{font-size:12px;font-weight:700;color:var(--mut)}
.ev{font-size:11px;line-height:1.25;padding:3px 6px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mais{font-size:10px;color:var(--mut);padding-left:2px}
.e-evento{background:rgba(0,240,255,.16);color:#7FF6FF}
.e-hold{background:rgba(249,115,22,.18);color:#FDBA74}
.e-contrato{background:rgba(37,99,235,.22);color:#93C5FD}
.e-aprovado{background:rgba(34,197,94,.18);color:#86EFAC}
.e-comissao{background:rgba(21,128,61,.25);color:#BBF7D0}
.e-recebimento{background:rgba(134,239,172,.13);color:#DCFCE7}
.e-lead{background:rgba(250,204,21,.16);color:#FDE68A}
.e-bloqueio{background:rgba(100,116,139,.25);color:#CBD5E1}
.pg-agenda .item{display:block;border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.035);cursor:pointer;transition:.3s ease}
.pg-agenda .item:hover{background:rgba(255,255,255,.07)}
.pg-agenda .item strong{display:block;margin-bottom:2px}
.pg-agenda .item small{color:var(--mut);display:block;margin-top:2px;font-size:12px}
.pg-agenda .item .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pg-agenda .item .tag{font-size:.55rem;padding:3px 8px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acoes a,.acoes button{font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.055);color:#fff;min-height:0}
.acoes a.pri{background:var(--aurora-primary);color:#08080A;border-color:var(--aurora-primary);font-weight:700}

/* ===== Espelho ===== */
.pg-espelho main{width:min(760px,calc(100% - 32px));margin:0 auto;padding:0 0 60px}
.pg-espelho .card .item:last-child{border-bottom:0}

/* Rodapé */
.site-foot{width:min(1180px,calc(100% - 32px));margin:24px auto 0;padding:18px 0 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);font-size:.72rem;opacity:.7}
.site-foot span:last-child{color:var(--aurora-primary);opacity:.8}

@media(max-width:900px){
  .pg-agenda main,.pg-projeto main{grid-template-columns:1fr}
}
@media(max-width:620px){
  header{padding-top:110px}
  .grid2{grid-template-columns:1fr}
  .dia{min-height:72px;padding:6px}
  .ev{font-size:10px}
  .grid,.dow{gap:4px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
#calc-header{padding:0;margin:0;width:100%;background:none;border:0;display:block}
#mobile-menu{position:relative}

</style>
<script src="https://www.432up.com/script/script.js" defer></script>
</head>
<body class="pg-projeto">
<canvas id="orbit-canvas"></canvas>
<div id="plasmaLayer" class="plasma-top-layer"></div>
<header id="calc-header"></header>
<div id="mobile-menu"></div>
<header>
  <div class="hd-title"><span class="kicker">432UP! Produções · Admin</span><h1>Projetos · administração</h1></div>
  <div class="row" style="margin:0">
    <a href="agenda.html" style="color:var(--ciano);text-decoration:none">Agenda →</a>
  </div>
</header>
<main>
  <aside>
    <div class="card">
      <h2>Projetos</h2>
      <input id="busca" placeholder="Buscar nº ou cliente" style="width:100%;margin-bottom:10px">
      <div id="listaProj"><div class="vazio">Carregando…</div></div>
    </div>
  </aside>

  <section id="detalhe">
    <div class="card" id="semSel"><div class="vazio">Escolha um projeto na lista.</div></div>
    <div id="conteudo" style="display:none">

      <div class="card">
        <h2 id="tituloProj">Projeto</h2>
        <div class="grid2">
          <div><label>Data do evento</label><input type="date" id="fData"></div>
          <div><label>Status</label>
            <select id="fStatus">
              <option value="rascunho">Rascunho</option>
              <option value="hold">Hold 48h</option>
              <option value="enviada">Enviada</option>
              <option value="aprovada">Aprovada</option>
              <option value="adiada">Adiada</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
          <div><label>Início</label><input type="time" id="fIni"></div>
          <div><label>Fim</label><input type="time" id="fFim"></div>
          <div style="grid-column:1/-1"><label>Local</label><input id="fLocal" style="width:100%"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="btnSalvar">Salvar alterações</button>
          <span class="mut" id="holdInfo"></span>
        </div>
        <div class="msg" id="msgDados"></div>
      </div>

      <div class="card">
        <h2>Dados do pedido</h2>
        <div id="dadosPedido" class="mut"></div>
      </div>

      <div class="card">
        <h2>Colaboradores do projeto</h2>
        <div class="row">
          <select id="addParceiro" style="min-width:200px"></select>
          <select id="addNivel">
            <option value="agenda">Só agenda</option>
            <option value="dados_sensiveis">Agenda + dados sensíveis</option>
          </select>
          <button class="primary" id="btnAddCol">Adicionar</button>
        </div>
        <div class="msg" id="msgCol"></div>
        <div id="listaCol"></div>
        <p class="mut" style="margin-top:10px"><a id="linkEspelho" href="#" style="color:var(--ciano)">Abrir espelho do cliente →</a></p>
      </div>

      <div class="card">
        <h2>Checklist</h2>
        <div id="listaEtapas"></div>
      </div>

      <div class="card">
        <h2>Instruções</h2>
        <div id="listaObs"></div>
      </div>

    </div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var CFG = window.PARTNER_CFG;
  var SB = window.sbPartner || window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  window.sbPartner = SB;

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var BRL = function (n) { try { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); } catch (e) { return ''; } };
  var ME = null, PROPS = [], ATUAL = null, PARCEIROS = [];

  function tempo(iso) {
    if (!iso) return '48H 00M';
    var d = new Date(iso) - new Date();
    if (d <= 0) return 'EXPIRADO';
    var h = Math.floor(d / 3600000), m = Math.floor((d % 3600000) / 60000);
    return (h < 10 ? '0' : '') + h + 'H ' + (m < 10 ? '0' : '') + m + 'M';
  }

  async function init() {
    var s = await SB.auth.getSession();
    if (!(s.data && s.data.session)) { location.href = '../login.html'; return; }
    var r = await SB.from('parceiros').select('id, nome_completo, role, status').eq('user_id', s.data.session.user.id).maybeSingle();
    ME = r.data;
    if (!ME || !/^(admin|master)$/i.test(String(ME.role || '').trim())) {
      document.querySelector('main').innerHTML = '<div class="card"><div class="vazio">Acesso restrito ao administrador.</div></div>';
      return;
    }
    var p = await SB.from('parceiros').select('id, nome_completo, email').eq('status', 'aprovado').order('nome_completo');
    PARCEIROS = p.data || [];
    $('addParceiro').innerHTML = PARCEIROS.map(function (v) { return '<option value="' + v.id + '">' + E(v.nome_completo || v.email) + '</option>'; }).join('');
    await carregarLista();
    var q = new URLSearchParams(location.search).get('id');
    if (q) selecionar(q);
  }

  async function carregarLista() {
    var r = await SB.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, status, hold_expira_em, cancelada_em')
      .order('data_evento', { ascending: true }).limit(500);
    PROPS = r.data || [];
    desenharLista();
  }

  function desenharLista() {
    var t = ($('busca').value || '').toLowerCase().trim();
    var lista = PROPS.filter(function (p) {
      return !t || String(p.numero).indexOf(t) >= 0 || String(p.cliente_nome || '').toLowerCase().indexOf(t) >= 0;
    });
    $('listaProj').innerHTML = lista.length ? lista.map(function (p) {
      return '<div class="proj ' + (ATUAL && ATUAL.id === p.id ? 'on' : '') + '" data-id="' + E(p.id) + '">' +
        '<strong>#' + E(p.numero) + '</strong> · ' + E(p.cliente_nome || '') + '<br>' +
        '<small>' + E(p.tipo_evento || '') + ' · ' + E(p.data_evento || 'sem data') + ' · ' + E(p.status || '') + '</small></div>';
    }).join('') : '<div class="vazio">Nenhum projeto.</div>';
    document.querySelectorAll('#listaProj [data-id]').forEach(function (el) {
      el.addEventListener('click', function () { selecionar(el.getAttribute('data-id')); });
    });
  }
  $('busca').addEventListener('input', desenharLista);

  async function selecionar(id) {
    ATUAL = PROPS.find(function (p) { return p.id === id; }) || null;
    if (!ATUAL) return;
    history.replaceState(null, '', '?id=' + encodeURIComponent(id));
    desenharLista();
    $('semSel').style.display = 'none';
    $('conteudo').style.display = 'block';
    $('tituloProj').textContent = 'Projeto #' + ATUAL.numero + ' · ' + (ATUAL.cliente_nome || '');
    $('fData').value = ATUAL.data_evento || '';
    $('fStatus').value = String(ATUAL.status || 'rascunho').toLowerCase();
    $('msgDados').textContent = '';
    var full = await SB.from('propostas').select('horario_inicio, horario_final, local_evento, valor_total, tipo_evento, cliente_nome, comissao_valor, assinado_em').eq('id', id).maybeSingle();
    var d = full.data || {};
    $('fIni').value = (d.horario_inicio || '').slice(0, 5);
    $('fFim').value = (d.horario_final || '').slice(0, 5);
    $('fLocal').value = d.local_evento || '';
    $('dadosPedido').innerHTML = 'Tipo: ' + E(d.tipo_evento || '') + ' · Valor: ' + BRL(d.valor_total) +
      ' · Comissão: ' + BRL(d.comissao_valor) + ' · Contrato: ' + (d.assinado_em ? 'assinado' : 'não assinado');
    $('holdInfo').textContent = ATUAL.status === 'hold' ? 'Hold · ' + tempo(ATUAL.hold_expira_em) : '';
    var le = document.getElementById("linkEspelho");
    if (le) le.href = "espelho.html?id=" + encodeURIComponent(ATUAL.id);
    await Promise.all([carregarColaboradores(), carregarEtapas(), carregarObs()]);
  }

  $('btnSalvar').addEventListener('click', async function () {
    if (!ATUAL) return;
    var st = $('fStatus').value;
    var patch = {
      data_evento: $('fData').value || null,
      status: st,
      horario_inicio: $('fIni').value || null,
      horario_final: $('fFim').value || null,
      local_evento: $('fLocal').value || null
    };
    if (st === 'hold' && ATUAL.status !== 'hold') {
      var h = new Date(); h.setHours(h.getHours() + 48); patch.hold_expira_em = h.toISOString();
    }
    if (st !== 'hold') patch.hold_expira_em = null;
    var r = await SB.from('propostas').update(patch).eq('id', ATUAL.id);
    if (r.error) { $('msgDados').className = 'msg'; $('msgDados').textContent = 'Não foi possível salvar.'; return; }
    $('msgDados').className = 'msg ok'; $('msgDados').textContent = 'Salvo.';
    await carregarLista();
    selecionar(ATUAL.id);
  });

  function nomeParceiroPorId(pid) {
    var p = (PARCEIROS || []).find(function (x) { return x.id === pid; });
    return p ? (p.nome_completo || p.email || pid) : (pid || '—');
  }

  async function carregarColaboradores() {
    if (!ATUAL) return;
    var box = $('listaCol');
    box.innerHTML = '<div class="vazio">Carregando colaboradores…</div>';

    // Sem embed (evita falha de FK no PostgREST); nomes vêm da lista PARCEIROS
    var r = await SB.from('projeto_colaboradores')
      .select('id, nivel, parceiro_id, criado_em')
      .eq('proposta_id', ATUAL.id)
      .order('criado_em', { ascending: true });

    if (r.error) {
      box.innerHTML = '<div class="vazio" style="color:#fca5a5">Erro ao listar: ' + E(r.error.message) + '</div>';
      console.error('projeto_colaboradores', r.error);
      return;
    }

    var l = r.data || [];
    if (!l.length) {
      box.innerHTML = '<div class="vazio">Nenhum colaborador ainda. Use o seletor acima e clique em Adicionar.</div>';
      return;
    }

    box.innerHTML = l.map(function (c) {
      var nome = nomeParceiroPorId(c.parceiro_id);
      return '<div class="item">' +
        '<span><strong>' + E(nome) + '</strong><br><span class="mut">' +
        (c.nivel === 'dados_sensiveis' ? 'agenda + dados sensíveis' : 'só agenda') +
        '</span></span>' +
        '<button type="button" class="danger" data-rem="' + E(c.id) + '">Remover</button></div>';
    }).join('');

    box.querySelectorAll('[data-rem]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('Remover este colaborador do projeto?')) return;
        var del = await SB.from('projeto_colaboradores').delete().eq('id', b.getAttribute('data-rem'));
        if (del.error) {
          alert('Não foi possível remover: ' + del.error.message);
          return;
        }
        carregarColaboradores();
      });
    });
  }

  $('btnAddCol').addEventListener('click', async function () {
    if (!ATUAL) {
      $('msgCol').className = 'msg';
      $('msgCol').textContent = 'Selecione um projeto à esquerda primeiro.';
      return;
    }
    var pid = $('addParceiro').value;
    if (!pid) {
      $('msgCol').className = 'msg';
      $('msgCol').textContent = 'Escolha um parceiro.';
      return;
    }
    var r = await SB.from('projeto_colaboradores').insert({
      proposta_id: ATUAL.id,
      parceiro_id: pid,
      nivel: $('addNivel').value,
      criado_por: ME.id
    }).select('id, parceiro_id, nivel');

    if (r.error) {
      $('msgCol').className = 'msg';
      $('msgCol').textContent = 'Não foi possível adicionar: ' + (r.error.message || 'já está no projeto?');
      console.error(r.error);
      return;
    }
    $('msgCol').className = 'msg ok';
    $('msgCol').textContent = 'Adicionado.';
    await carregarColaboradores();
  });

  async function carregarEtapas() {
    var r = await SB.from('evento_etapas').select('id, nome, hora, situacao, concluida_por, concluida_em, ordem').eq('proposta_id', ATUAL.id).order('ordem');
    var l = r.data || [];
    $('listaEtapas').innerHTML = l.length ? l.map(function (e) {
      var feita = e.situacao === 'concluida';
      return '<div class="item"><span>' + E(e.nome) + ' <span class="mut">' + E(e.hora || '') + '</span>' +
        (feita ? ' <span class="tag t-ok">feita</span>' : ' <span class="tag t-hold">pendente</span>') + '</span>' +
        '<span>' + (feita
          ? '<button data-desfazer="' + E(e.id) + '">Desfazer</button>'
          : '<button class="primary" data-feita="' + E(e.id) + '">Marcar feita</button>') + '</span></div>';
    }).join('') : '<div class="vazio">Sem etapas.</div>';
    document.querySelectorAll('[data-feita]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await SB.from('evento_etapas').update({ situacao: 'concluida', concluida_por: ME.nome_completo, concluida_em: new Date().toISOString() }).eq('id', b.getAttribute('data-feita'));
        carregarEtapas();
      });
    });
    document.querySelectorAll('[data-desfazer]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await SB.from('evento_etapas').update({ situacao: 'pendente', concluida_por: null, concluida_em: null }).eq('id', b.getAttribute('data-desfazer'));
        carregarEtapas();
      });
    });
  }

  async function carregarObs() {
    var r = await SB.from('evento_observacoes').select('id, texto, criado_por').eq('proposta_id', ATUAL.id).is('removido_em', null).order('criado_em');
    var l = r.data || [];
    $('listaObs').innerHTML = l.length ? l.map(function (o) {
      return '<div class="item"><span>' + E(o.texto) + ' <span class="mut">(' + E(o.criado_por) + ')</span></span>' +
        '<button class="danger" data-obs="' + E(o.id) + '">Remover</button></div>';
    }).join('') : '<div class="vazio">Nenhuma instrução.</div>';
    document.querySelectorAll('[data-obs]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await SB.from('evento_observacoes').update({ removido_em: new Date().toISOString() }).eq('id', b.getAttribute('data-obs'));
        carregarObs();
      });
    });
  }

  init();
})();
</script>
