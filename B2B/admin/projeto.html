<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Projetos · 432UP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    :root {
      --bg: #08080A; --text: #FFFFFF; --body: #E7E7EC; --mut: #9A97B0;
      --action: #00FF66; --purple: #A855F7; --pink: #FF007F; --tech: #06B6D4;
      --gold: #D4AF37; --alert: #FF4D4D; --line: rgba(255,255,255,.1);
    }
    body { background: var(--bg) !important; color: var(--text) !important; font-family: 'Inter', system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    .area {
      width: 100%; max-width: 1120px; margin: 0 auto; position: relative; z-index: 2;
      padding-top: calc(var(--hdr-h, 112px) + 28px);
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
      padding-bottom: calc(120px + env(safe-area-inset-bottom));
    }
    html, body { height: auto !important; min-height: 100%; }
    body { overflow-y: visible !important; }
    .eyebrow { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; opacity: .72; color: var(--gold); }
    .titulo { font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.15; letter-spacing: -.03em; margin: 8px 0 14px; font-weight: 800; }
    .mut { color: var(--mut); }
    .box-full {
      border-radius: 24px; padding: 20px; margin-bottom: 14px;
      background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .box-full h2 {
      font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 12px; font-weight: 800;
    }
    .layout { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .proj {
      padding: 12px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
      cursor: pointer; transition: border-color .2s, background .2s; background: rgba(255,255,255,.03);
    }
    .proj:hover { border-color: rgba(168,85,247,.4); }
    .proj.on { border-color: rgba(0,255,102,.45); background: rgba(0,255,102,.06); }
    .proj small { color: var(--mut); font-size: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    label.cap {
      font-size: 10px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em;
      display: block; margin-bottom: 4px;
    }
    .item {
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .item:last-child { border-bottom: 0; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 8px;
      border-radius: 999px; text-transform: uppercase; letter-spacing: .04em;
    }
    .t-hold { background: rgba(212,175,55,.16); color: var(--gold); }
    .t-ok { background: rgba(0,255,102,.14); color: var(--action); }
    .msg { font-size: 12px; min-height: 16px; color: #fca5a5; margin-top: 6px; }
    .msg.ok { color: var(--action); }
    .vazio { color: var(--mut); font-size: 13px; padding: 6px 0; }
    .admin-only { }
    body.modo-parceiro .admin-only { display: none !important; }
    body.modo-parceiro input:not([type="checkbox"]):not([type="radio"]),
    body.modo-parceiro select,
    body.modo-parceiro textarea { pointer-events: none; opacity: .85; }
    body.modo-parceiro #fData,
    body.modo-parceiro #fStatus,
    body.modo-parceiro #fIni,
    body.modo-parceiro #fFim,
    body.modo-parceiro #fLocal { background: rgba(255,255,255,.03); }
    .campo-ro {
      padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255,255,255,.03); font-size: 14px; min-height: 42px;
      display: flex; align-items: center;
    }
    #boxPagamentoParceiro { display: none; }
    body.modo-parceiro #boxPagamentoParceiro { display: block; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
    input, select, button {
      font: inherit; color: var(--text);
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px; padding: 10px 12px;
    }
    input, select { width: 100%; }
    button { cursor: pointer; transition: border-color .2s, background .2s; width: auto; }
    button:hover { border-color: rgba(0,255,102,.5); }
    button.primary { background: var(--action); color: #04120a; border-color: var(--action); font-weight: 800; }
    button.danger { color: #fca5a5; border-color: rgba(255,77,77,.4); background: rgba(255,77,77,.08); }
    button:disabled { opacity: .5; cursor: default; }
    a.tech { color: var(--tech); text-decoration: none; font-weight: 600; }
    a.tech:hover { text-decoration: underline; }

    /* Equipe técnica — idêntico à área do cliente */
    .eq-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .eq-item:last-child { border-bottom: 0; }
    .eq-foto {
      width: 46px; height: 46px; border-radius: 50%; flex: none;
      background: rgba(168,85,247,.18) center/cover no-repeat;
      border: 2px solid rgba(192,132,252,.45);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #e9d5ff; font-size: 15px;
    }
    .eq-item strong { display: block; font-size: 15px; line-height: 1.25; }
    .eq-item small { display: block; margin-top: 2px; font-size: 12px; color: var(--mut); letter-spacing: .02em; }
    .eq-item .eq-acoes { margin-left: auto; flex-shrink: 0; }
  </style>
</head>
<body class="h-full antialiased overflow-x-hidden">

  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <header id="calc-header"></header>
  <div id="mobile-menu"></div>

  <div class="flex flex-col min-h-screen relative z-10">
    <main class="area">
      <div style="margin-bottom:6px">
        <span class="eyebrow">Admin</span>
        <h1 class="titulo">Projetos</h1>
      </div>

      <div class="layout">
        <aside>
          <div class="box-full">
            <h2>Projetos</h2>
            <input id="busca" placeholder="Buscar nº ou cliente" style="margin-bottom:10px">
            <div id="listaProj"><div class="vazio">Carregando…</div></div>
          </div>
        </aside>

        <section id="detalhe">
          <div class="box-full" id="semSel"><div class="vazio">Escolha um projeto na lista.</div></div>
          <div id="conteudo" style="display:none">

            <div class="box-full">
              <h2 id="tituloProj">Projeto</h2>
              <div class="grid2">
                <div><label class="cap">Data do evento</label><input type="date" id="fData"></div>
                <div><label class="cap">Status</label>
                  <select id="fStatus">
                    <option value="rascunho">Rascunho</option>
                    <option value="hold">Hold 48h</option>
                    <option value="enviada">Enviada</option>
                    <option value="aprovada">Aprovada</option>
                    <option value="adiada">Adiada</option>
                    <option value="cancelada">Cancelada</option>
                  </select>
                </div>
                <div><label class="cap">Início</label><input type="time" id="fIni"></div>
                <div><label class="cap">Fim</label><input type="time" id="fFim"></div>
                <div style="grid-column:1/-1"><label class="cap">Local</label><input id="fLocal"></div>
              </div>
              <div class="row admin-only" style="margin-top:12px">
                <button class="primary" id="btnSalvar" type="button">Salvar alterações</button>
                <span class="mut" id="holdInfo"></span>
              </div>
              <div class="msg" id="msgDados"></div>
            </div>

            <div class="box-full admin-only" id="boxDadosPedido">
              <h2>Dados do pedido</h2>
              <div id="dadosPedido" class="mut"></div>
            </div>

            <div class="box-full" id="boxPagamentoParceiro">
              <h2>Seu pagamento</h2>
              <div id="pagamentoParceiro" class="mut">Os valores do seu cachê/comissão neste evento aparecerão aqui quando forem definidos.</div>
            </div>

            <div class="box-full">
              <h2>Equipe técnica</h2>
              <div class="row admin-only">
                <select id="addParceiro" style="min-width:200px;flex:1"></select>
                <select id="addNivel" style="width:auto">
                  <option value="agenda">Só agenda</option>
                  <option value="dados_sensiveis">Agenda + dados sensíveis</option>
                </select>
                <button class="primary" id="btnAddCol" type="button">Adicionar</button>
              </div>
              <div class="msg admin-only" id="msgCol"></div>
              <div id="listaCol"></div>
              <p class="mut admin-only" style="margin-top:14px"><a class="tech" id="linkEspelho" href="#">Abrir espelho do cliente →</a></p>
            </div>

            <div class="box-full">
              <h2>Checklist</h2>
              <div class="row admin-only" style="align-items:flex-end;margin-bottom:12px">
                <div style="flex:1;min-width:140px">
                  <label class="cap">Nova etapa</label>
                  <input id="novaEtapaNome" placeholder="Ex.: Montagem" maxlength="120">
                </div>
                <div style="width:110px">
                  <label class="cap">Hora</label>
                  <input id="novaEtapaHora" type="time">
                </div>
                <button class="primary" id="btnAddEtapa" type="button">Adicionar</button>
              </div>
              <div class="msg admin-only" id="msgEtapa"></div>
              <div id="listaEtapas"></div>
            </div>

            <div class="box-full">
              <h2>Instruções</h2>
              <div id="listaObs"></div>
            </div>

          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../partner-config.js"></script>
  <script src="../../script/script.js" defer></script>
  <script src="../partner-header.js"></script>
  <script>
(function () {
  'use strict';
  var CFG = window.PARTNER_CFG;
  var SB = window.sbPartner || window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  window.sbPartner = SB;

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  var BRL = function (n) {
    try { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    catch (e) { return ''; }
  };

  var ME = null, PROPS = [], ATUAL = null, PARCEIROS = [];
  var IS_ADMIN = false;
  var ME_PROP_IDS = null; // Set|null — null = admin vê tudo
  var ME_NIVEL_NO_PROJ = 'agenda'; // nivel do ME neste projeto

  function tempo(iso) {
    if (!iso) return '48H 00M';
    var d = new Date(iso) - new Date();
    if (d <= 0) return 'EXPIRADO';
    var h = Math.floor(d / 3600000), m = Math.floor((d % 3600000) / 60000);
    return (h < 10 ? '0' : '') + h + 'H ' + (m < 10 ? '0' : '') + m + 'M';
  }

  function labelNivel(nivel) {
    return nivel === 'dados_sensiveis' ? 'Agenda + dados sensíveis' : 'Só agenda';
  }

  function parceiroPorId(pid) {
    if (!pid) return null;
    var lista = PARCEIROS || [];
    var s = String(pid);
    return lista.find(function (x) { return String(x.id) === s || String(x.user_id) === s; }) || null;
  }

  function nomeParceiro(p) {
    if (!p) return '';
    return (p.nome_artistico || p.nome_completo || p.email || '').trim();
  }

  function fotoParceiro(p) {
    if (!p) return '';
    return p.avatar_url || p.foto_url || p.foto || '';
  }

  function funcaoParceiro(p, nivel) {
    if (p) {
      var f = (p.funcao || p.papel || p.especialidade || p.categoria || p.role || '').trim();
      if (f) return f;
    }
    return labelNivel(nivel);
  }

  /* Carrega a lista do select — mesmo filtro do HTML original que já funcionava */
  async function carregarParceirosBase() {
    var r = await SB.from('parceiros')
      .select('id, nome_completo, email, status')
      .eq('status', 'aprovado')
      .order('nome_completo');

    if (r.error || !(r.data && r.data.length)) {
      /* fallback sem filtro de status */
      r = await SB.from('parceiros')
        .select('id, nome_completo, email, status')
        .order('nome_completo');
    }

    PARCEIROS = r.data || [];

    /* tenta enriquecer com avatar / nome artístico (ignora se coluna não existir) */
    try {
      var ids = PARCEIROS.map(function (p) { return p.id; }).filter(Boolean);
      if (ids.length) {
        var extra = await SB.from('parceiros')
          .select('id, nome_artistico, avatar_url, foto_url, funcao, papel, user_id')
          .in('id', ids);
        if (!extra.error && extra.data) {
          var map = {};
          extra.data.forEach(function (e) { map[e.id] = e; });
          PARCEIROS = PARCEIROS.map(function (p) {
            var e = map[p.id];
            if (!e) return p;
            return Object.assign({}, p, e);
          });
        }
      }
    } catch (e) { /* ok */ }

    $('addParceiro').innerHTML = PARCEIROS.length
      ? PARCEIROS.map(function (p) {
          var nome = nomeParceiro(p) || p.id;
          return '<option value="' + E(p.id) + '">' + E(nome) + '</option>';
        }).join('')
      : '<option value="">Nenhum parceiro aprovado</option>';
  }

  /* Resolve um parceiro que não está na lista (ex.: id gravado mas status mudou) */
  async function buscarParceiroDireto(pid) {
    if (!pid) return null;
    var r = await SB.from('parceiros')
      .select('id, user_id, nome_completo, nome_artistico, email, avatar_url, foto_url, funcao, papel, status')
      .eq('id', pid)
      .maybeSingle();
    if (r.error || !r.data) {
      r = await SB.from('parceiros')
        .select('id, user_id, nome_completo, email, status')
        .eq('id', pid)
        .maybeSingle();
    }
    if ((r.error || !r.data)) {
      r = await SB.from('parceiros')
        .select('id, user_id, nome_completo, email, status')
        .eq('user_id', pid)
        .maybeSingle();
    }
    if (r.data) {
      PARCEIROS.push(r.data);
      return r.data;
    }
    return null;
  }

  async function carregarEscopoParceiro() {
    ME_PROP_IDS = null;
    if (IS_ADMIN) return;
    if (!ME || !ME.id) { ME_PROP_IDS = new Set(); return; }
    var ids = new Set();
    var cols = await SB.from('projeto_colaboradores').select('proposta_id, nivel').eq('parceiro_id', ME.id);
    (cols.data || []).forEach(function (c) { if (c.proposta_id) ids.add(c.proposta_id); });
    var minhas = await SB.from('propostas').select('id').eq('parceiro_id', ME.id).is('cancelada_em', null);
    (minhas.data || []).forEach(function (p) { if (p.id) ids.add(p.id); });
    ME_PROP_IDS = ids;
  }

  async function init() {
    var s = await SB.auth.getSession();
    if (!(s.data && s.data.session)) { location.href = '../login.html'; return; }

    var r = await SB.from('parceiros')
      .select('id, nome_completo, role, status, nivel')
      .eq('user_id', s.data.session.user.id)
      .maybeSingle();
    ME = r.data;
    if (!ME) { location.href = '../login.html'; return; }

    var papel = String(ME.role || ME.nivel || '').toLowerCase().trim();
    IS_ADMIN = /^(admin|master)$/i.test(papel);

    if (IS_ADMIN) {
      document.body.classList.remove('modo-parceiro');
      var eye = document.querySelector('.eyebrow');
      if (eye) eye.textContent = 'Admin';
    } else {
      document.body.classList.add('modo-parceiro');
      var eye2 = document.querySelector('.eyebrow');
      if (eye2) eye2.textContent = 'Parceiro';
      document.title = 'Dados do evento · 432UP';
    }

    await carregarEscopoParceiro();
    if (IS_ADMIN) await carregarParceirosBase();
    await carregarLista();
    var qid = new URLSearchParams(location.search).get('id');
    if (qid) selecionar(qid);
  }

  async function carregarLista() {
    var r = await SB.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, status, hold_expira_em, cancelada_em')
      .order('data_evento', { ascending: true })
      .limit(500);
    PROPS = r.data || [];
    if (ME_PROP_IDS) {
      PROPS = PROPS.filter(function (p) { return ME_PROP_IDS.has(p.id); });
    }
    desenharLista();
  }

  function desenharLista() {
    var t = ($('busca').value || '').toLowerCase().trim();
    var lista = PROPS.filter(function (p) {
      return !t || String(p.numero).indexOf(t) >= 0 || String(p.cliente_nome || '').toLowerCase().indexOf(t) >= 0;
    });
    $('listaProj').innerHTML = lista.length ? lista.map(function (p) {
      return '<div class="proj ' + (ATUAL && ATUAL.id === p.id ? 'on' : '') + '" data-id="' + E(p.id) + '">' +
        '<strong>#' + E(p.numero) + '</strong> · ' + E(p.cliente_nome || '') + '<br>' +
        '<small>' + E(p.tipo_evento || '') + ' · ' + E(p.data_evento || 'sem data') + ' · ' + E(p.status || '') + '</small></div>';
    }).join('') : '<div class="vazio">Nenhum projeto.</div>';

    document.querySelectorAll('#listaProj [data-id]').forEach(function (el) {
      el.addEventListener('click', function () { selecionar(el.getAttribute('data-id')); });
    });
  }
  $('busca').addEventListener('input', desenharLista);

  async function selecionar(id) {
    ATUAL = PROPS.find(function (p) { return p.id === id; }) || null;
    if (!ATUAL) return;
    history.replaceState(null, '', '?id=' + encodeURIComponent(id));
    desenharLista();
    $('semSel').style.display = 'none';
    $('conteudo').style.display = 'block';
    $('tituloProj').textContent = 'Projeto #' + ATUAL.numero + ' · ' + (ATUAL.cliente_nome || '');
    $('fData').value = ATUAL.data_evento || '';
    $('fStatus').value = String(ATUAL.status || 'rascunho').toLowerCase();
    $('msgDados').textContent = '';

    var full = await SB.from('propostas')
      .select('horario_inicio, horario_final, local_evento, valor_total, tipo_evento, cliente_nome, comissao_valor, assinado_em')
      .eq('id', id)
      .maybeSingle();
    var d = full.data || {};
    $('fIni').value = (d.horario_inicio || '').slice(0, 5);
    $('fFim').value = (d.horario_final || '').slice(0, 5);
    $('fLocal').value = d.local_evento || '';

    if (IS_ADMIN) {
      $('dadosPedido').innerHTML =
        'Tipo: ' + E(d.tipo_evento || '') +
        ' · Valor: ' + BRL(d.valor_total) +
        ' · Comissão: ' + BRL(d.comissao_valor) +
        ' · Contrato: ' + (d.assinado_em ? 'assinado' : 'não assinado');
      var hi = $('holdInfo');
      if (hi) hi.textContent = ATUAL.status === 'hold' ? 'Hold · ' + tempo(ATUAL.hold_expira_em) : '';
      var le = document.getElementById('linkEspelho');
      if (le) le.href = 'espelho.html?id=' + encodeURIComponent(ATUAL.id);
    } else {
      /* Parceiro: só operacional — sem valor total / comissão da casa */
      ME_NIVEL_NO_PROJ = 'agenda';
      try {
        var nv = await SB.from('projeto_colaboradores')
          .select('nivel')
          .eq('proposta_id', id)
          .eq('parceiro_id', ME.id)
          .maybeSingle();
        if (nv.data && nv.data.nivel) ME_NIVEL_NO_PROJ = nv.data.nivel;
      } catch (e) {}

      var pp = $('pagamentoParceiro');
      if (pp) {
        pp.innerHTML =
          '<div style="margin-bottom:8px">Tipo: <strong style="color:var(--text)">' + E(d.tipo_evento || '—') + '</strong></div>' +
          '<div style="margin-bottom:8px">Cliente: <strong style="color:var(--text)">' + E(d.cliente_nome || ATUAL.cliente_nome || '—') + '</strong></div>' +
          '<div style="margin-bottom:8px">Local: <strong style="color:var(--text)">' + E(d.local_evento || '—') + '</strong></div>' +
          '<div class="mut" style="margin-top:10px;font-size:12px">Seu cachê/comissão neste evento será exibido aqui quando a produção definir o valor.</div>';
      }
    }

    await Promise.all([carregarColaboradores(), carregarEtapas(), carregarObs()]);
  }

  $('btnSalvar').addEventListener('click', async function () {
    if (!IS_ADMIN || !ATUAL) return;
    var st = $('fStatus').value;
    var patch = {
      data_evento: $('fData').value || null,
      status: st,
      horario_inicio: $('fIni').value || null,
      horario_final: $('fFim').value || null,
      local_evento: $('fLocal').value || null
    };
    if (st === 'hold' && ATUAL.status !== 'hold') {
      var h = new Date();
      h.setHours(h.getHours() + 48);
      patch.hold_expira_em = h.toISOString();
    }
    if (st !== 'hold') patch.hold_expira_em = null;

    var r = await SB.from('propostas').update(patch).eq('id', ATUAL.id);
    if (r.error) {
      $('msgDados').className = 'msg';
      $('msgDados').textContent = 'Não foi possível salvar.';
      return;
    }
    $('msgDados').className = 'msg ok';
    $('msgDados').textContent = 'Salvo.';
    await carregarLista();
    selecionar(ATUAL.id);
  });

  async function carregarColaboradores() {
    if (!ATUAL) return;
    var box = $('listaCol');
    box.innerHTML = '<div class="vazio">Carregando equipe…</div>';

    var r = await SB.from('projeto_colaboradores')
      .select('id, nivel, parceiro_id, criado_em')
      .eq('proposta_id', ATUAL.id)
      .order('criado_em', { ascending: true });

    if (r.error) {
      box.innerHTML = '<div class="vazio" style="color:#fca5a5">Erro ao listar: ' + E(r.error.message) + '</div>';
      console.error('projeto_colaboradores', r.error);
      return;
    }

    var l = r.data || [];
    if (!l.length) {
      box.innerHTML = '<div class="vazio">Nenhum colaborador ainda. Use o seletor acima e clique em Adicionar.</div>';
      return;
    }

    /* resolve cada parceiro que ainda não está no cache */
    for (var i = 0; i < l.length; i++) {
      if (!parceiroPorId(l[i].parceiro_id)) {
        await buscarParceiroDireto(l[i].parceiro_id);
      }
    }

    box.innerHTML = l.map(function (c) {
      var p = parceiroPorId(c.parceiro_id);
      var nome = nomeParceiro(p);
      var foto = fotoParceiro(p);
      var funcao = funcaoParceiro(p, c.nivel);
      var inicial = (nome || '?').charAt(0).toUpperCase();

      /* se ainda sem nome, mostra trecho do id só para diagnóstico */
      if (!nome) nome = 'ID ' + String(c.parceiro_id || '').slice(0, 8);

      return '<div class="eq-item">' +
        '<div class="eq-foto"' + (foto ? ' style="background-image:url(\'' + E(foto) + '\')"' : '') + '>' +
          (foto ? '' : E(inicial)) +
        '</div>' +
        '<div style="min-width:0">' +
          '<strong>' + E(nome) + '</strong>' +
          '<small>' + E(funcao) + '</small>' +
        '</div>' +
        (IS_ADMIN
          ? '<div class="eq-acoes"><button class="danger" data-rm-col="' + E(c.id) + '" type="button">Remover</button></div>'
          : '') +
      '</div>';
    }).join('');

    document.querySelectorAll('[data-rm-col]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('Remover este colaborador do projeto?')) return;
        await SB.from('projeto_colaboradores').delete().eq('id', b.getAttribute('data-rm-col'));
        carregarColaboradores();
      });
    });
  }

  $('btnAddCol').addEventListener('click', async function () {
    if (!IS_ADMIN || !ATUAL) {
      $('msgCol').className = 'msg';
      $('msgCol').textContent = 'Selecione um projeto à esquerda primeiro.';
      return;
    }
    var pid = $('addParceiro').value;
    if (!pid) {
      $('msgCol').className = 'msg';
      $('msgCol').textContent = 'Escolha um parceiro.';
      return;
    }
    var r = await SB.from('projeto_colaboradores').insert({
      proposta_id: ATUAL.id,
      parceiro_id: pid,
      nivel: $('addNivel').value,
      criado_por: ME.id
    }).select('id, parceiro_id, nivel');

    if (r.error) {
      $('msgCol').className = 'msg';
      $('msgCol').textContent = 'Não foi possível adicionar: ' + (r.error.message || 'já está no projeto?');
      console.error(r.error);
      return;
    }
    $('msgCol').className = 'msg ok';
    $('msgCol').textContent = 'Adicionado.';
    await carregarColaboradores();
  });

  async function carregarEtapas() {
    if (!ATUAL) return;
    var r = await SB.from('evento_etapas')
      .select('id, nome, hora, situacao, concluida_por, concluida_em, ordem')
      .eq('proposta_id', ATUAL.id)
      .order('ordem');
    var l = r.data || [];

    if (!l.length) {
      $('listaEtapas').innerHTML = '<div class="vazio">Sem etapas no checklist.</div>';
    } else {
      $('listaEtapas').innerHTML = l.map(function (e) {
        var feita = e.situacao === 'concluida';
        var acoes = '';
        if (IS_ADMIN) {
          acoes = '<span style="display:flex;gap:6px;flex-wrap:wrap">' +
            (feita
              ? '<button data-desfazer="' + E(e.id) + '" type="button">Desfazer</button>'
              : '<button class="primary" data-feita="' + E(e.id) + '" type="button">Marcar feita</button>') +
            '<button class="danger" data-rm-etapa="' + E(e.id) + '" type="button">Remover</button>' +
          '</span>';
        }
        return '<div class="item">' +
          '<span>' + E(e.nome) + ' <span class="mut">' + E(e.hora || '') + '</span>' +
            (feita ? ' <span class="tag t-ok">feita</span>' : ' <span class="tag t-hold">pendente</span>') +
          '</span>' + acoes +
        '</div>';
      }).join('');
    }

    document.querySelectorAll('[data-feita]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await SB.from('evento_etapas').update({
          situacao: 'concluida',
          concluida_por: ME.nome_completo,
          concluida_em: new Date().toISOString()
        }).eq('id', b.getAttribute('data-feita'));
        carregarEtapas();
      });
    });
    document.querySelectorAll('[data-desfazer]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await SB.from('evento_etapas').update({
          situacao: 'pendente',
          concluida_por: null,
          concluida_em: null
        }).eq('id', b.getAttribute('data-desfazer'));
        carregarEtapas();
      });
    });
    document.querySelectorAll('[data-rm-etapa]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('Remover esta etapa do checklist?')) return;
        await SB.from('evento_etapas').delete().eq('id', b.getAttribute('data-rm-etapa'));
        carregarEtapas();
      });
    });
  }

  $('btnAddEtapa').addEventListener('click', async function () {
    if (!IS_ADMIN || !ATUAL) return;
    var nome = ($('novaEtapaNome').value || '').trim();
    var hora = ($('novaEtapaHora').value || '').trim() || null;
    var msg = $('msgEtapa');
    if (!nome) {
      msg.className = 'msg';
      msg.textContent = 'Informe o nome da etapa.';
      return;
    }
    $('btnAddEtapa').disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Salvando…';
    try {
      var ord = await SB.from('evento_etapas')
        .select('ordem')
        .eq('proposta_id', ATUAL.id)
        .order('ordem', { ascending: false })
        .limit(1);
      var prox = 1;
      if (ord.data && ord.data[0] && ord.data[0].ordem != null) {
        prox = Number(ord.data[0].ordem) + 1;
      }
      var r = await SB.from('evento_etapas').insert({
        proposta_id: ATUAL.id,
        nome: nome,
        hora: hora,
        situacao: 'pendente',
        ordem: prox
      });
      if (r.error) throw new Error(r.error.message || 'Falha ao adicionar');
      $('novaEtapaNome').value = '';
      $('novaEtapaHora').value = '';
      msg.className = 'msg ok';
      msg.textContent = 'Etapa adicionada.';
      await carregarEtapas();
    } catch (err) {
      msg.className = 'msg';
      msg.textContent = err.message || 'Erro ao adicionar etapa.';
    } finally {
      $('btnAddEtapa').disabled = false;
    }
  });

  async function carregarObs() {
    if (!ATUAL) return;
    var r = await SB.from('evento_observacoes')
      .select('id, texto, criado_por')
      .eq('proposta_id', ATUAL.id)
      .is('removido_em', null)
      .order('criado_em');
    var l = r.data || [];
    $('listaObs').innerHTML = l.length ? l.map(function (o) {
      return '<div class="item">' +
        '<span>' + E(o.texto) + ' <span class="mut">(' + E(o.criado_por) + ')</span></span>' +
        (IS_ADMIN ? '<button class="danger" data-obs="' + E(o.id) + '" type="button">Remover</button>' : '') +
      '</div>';
    }).join('') : '<div class="vazio">Nenhuma instrução.</div>';

    document.querySelectorAll('[data-obs]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await SB.from('evento_observacoes')
          .update({ removido_em: new Date().toISOString() })
          .eq('id', b.getAttribute('data-obs'));
        carregarObs();
      });
    });
  }

  init();
})();
  </script>
</body>
</html>
