<body class="h-full text-slate-200 font-sans antialiased bg-[#06080c] overflow-x-hidden">

  <div id="mobile-menu"></div>

  <!-- CONTEÚDO DA PÁGINA -->
  <div class="flex flex-col min-h-screen relative z-10 pb-16">
    <main class="flex-1 p-4 lg:p-8 space-y-6 pt-20 lg:pt-24 w-full max-w-7xl mx-auto">

      <span class="admin-busy-spin" id="admin-busy" hidden></span>
      <span id="db-dot" hidden></span>
      <span id="db-status-text" hidden></span>
      <span id="last-save-text" hidden></span>
    <div class="module-page active" id="module-calc1-transporte">
      <div class="admin-content-area">
        <div class="mod-header">
          <div>
            <h2>Transporte</h2>
            <p>Tarifa global por KM e ponto de origem de referência.</p>
          </div>
        </div>
        <div class="transporte-card">
          <div class="form-group">
            <label>Valor por KM (R$)</label>
            <input type="number" step="0.01" id="cfgTransporteValorKm" value="0">
          </div>
          <div class="form-group">
            <label>CEP de origem</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input id="cfgTransporteCep" placeholder="00000-000" maxlength="9" style="flex:1;" onblur="buscarCepOrigem()">
              <button type="button" class="btn btn-sm" onclick="buscarCepOrigem()">Buscar CEP</button>
            </div>
            <p id="cfgTransporteCepStatus" style="font-size:0.75rem;color:var(--text-muted);margin-top:6px;"></p>
          </div>
          <div class="form-group">
            <label>Origem (preenchida pelo CEP)</label>
            <input id="cfgTransporteOrigemLabel" value="Centro de São Paulo" readonly style="opacity:0.9;">
          </div>
          <div class="form-section">
            <div class="form-section-title">Avançado (coordenadas — auto)</div>
            <div class="form-row">
              <div class="form-group">
                <label>Latitude</label>
                <input type="number" step="0.000001" id="cfgTransporteOrigemLat" value="-23.5505">
              </div>
              <div class="form-group">
                <label>Longitude</label>
                <input type="number" step="0.000001" id="cfgTransporteOrigemLng" value="-46.6333">
              </div>
            </div>
          </div>
          <div style="margin-top:20px; display:flex; justify-content:flex-end;">
            <button class="btn btn-primary" id="btn-save-transporte" onclick="saveConfigTransporte()">💾 Salvar tarifa</button>
          </div>
        </div>
      </div>
    </div>


    </main>
  </div>


  <div id="toastBox"></div>
  <div class="confirm-overlay" id="confirmDlg">
    <div class="confirm-box">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="btn btn-danger" onclick="confirmClose(true)">Sim, excluir</button>
        <button class="btn" onclick="confirmClose(false)">Cancelar</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.432up.com/B2B/partner-config.js"></script>
  <script src="https://www.432up.com/script/script.js" defer></script>
  <script src="https://www.432up.com/script/tracker.js" defer></script>
  <script src="https://www.432up.com/B2B/partner-header.js"></script>


  <script>

  const SUPABASE_URL_ADM = 'https://paetkspbfejtjjkngqej.supabase.co';
  const SUPABASE_KEY_ADM = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXRrc3BiZmVqdGpqa25ncWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MDU2OTgsImV4cCI6MjA4NjQ4MTY5OH0.IiYweZ2g3bP7b0o7VvBW5LLb6d1oHtSNFUZlVkIsdsA';
  const _supabaseAdmin = supabase.createClient(SUPABASE_URL_ADM, SUPABASE_KEY_ADM);
  const _supabase = _supabaseAdmin;
  window._supabase = _supabaseAdmin;
  const SB = SUPABASE_URL_ADM;
  const SK = SUPABASE_KEY_ADM;

  var DATA = { servicos: [], pacotes: [], leads: [], configTransporte: null };
  var selectedLeads = {};
  var _confirmCb = null;
  function qs(s) { return document.querySelector(s); }
  function qsa(s) { return document.querySelectorAll(s); }
  function $(s) { return document.querySelector(s); }
  function $$(s) { return document.querySelectorAll(s); }
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function el(id) { return document.getElementById(id); }

  function clearToasts() {
    var c = document.getElementById('toastBox');
    if (c) c.innerHTML = '';
  }
  function toast(msg, type) {
    var c = document.getElementById('toastBox');
    if (!c) return;
    clearToasts();
    var t = document.createElement('div');
    t.className = 'toast ' + (type === 'err' || type === 'error' ? 'err' : 'ok');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 3800);
  }
  window.showToast = toast;
  function setAdminBusy(on) {
    var sp = document.getElementById('admin-busy');
    if (sp) {
      if (on) sp.removeAttribute('hidden');
      else sp.setAttribute('hidden', '');
    }
  }

  function markSaved() {
    var el = $('#last-save-text');
    if (el) el.textContent = 'Salvo ' + new Date().toLocaleTimeString('pt-BR');
  }
  function setDbStatus(ok) {
    var dot = $('#db-dot');
    var txt = $('#db-status-text');
    if (dot) dot.classList.toggle('err', !ok);
    if (txt) if (txt) txt.textContent = '';
  }
  function confirmShow(msg, cb) {
    $('#confirmMsg').textContent = msg;
    _confirmCb = cb;
    $('#confirmDlg').classList.add('open');
  }
  function confirmClose(yes) {
    $('#confirmDlg').classList.remove('open');
    if (_confirmCb) _confirmCb(yes);
    _confirmCb = null;
  }

  function sbH(m) {
    var h = { 'apikey': SK, 'Authorization': 'Bearer ' + SK, 'Content-Type': 'application/json' };
    if (m === 'PATCH' || m === 'POST') h['Prefer'] = 'return=representation';
    return h;
  }
  async function sbGet(table, qs) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?' + qs, { headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
      if (!r.ok) throw r;
      return await r.json();
    } catch (e) { console.error('sbGet', table, e); return null; }
  }
  async function sbPatch(table, id, body) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?id=eq.' + id, { method: 'PATCH', headers: sbH('PATCH'), body: JSON.stringify(body) });
      if (!r.ok) { console.error('sbPatch', await r.text()); return false; }
      return true;
    } catch (e) { return false; }
  }
  async function sbPost(table, body) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table, { method: 'POST', headers: sbH('POST'), body: JSON.stringify(body) });
      if (!r.ok) { console.error('sbPost', await r.text()); return null; }
      return await r.json();
    } catch (e) { return null; }
  }
  async function sbDel(table, id) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?id=eq.' + id, { method: 'DELETE', headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
      return r.ok;
    } catch (e) { return false; }
  }

  // ============================================================
  // CALC1 DATA  (Serviços / Pacotes / Leads / Transporte — mantidos)
  // ============================================================

  // TRANSPORTE
  function renderConfigTransporte() {
    var cfg = DATA.configTransporte; if (!cfg) return;
    var km = el('cfgTransporteValorKm');
    var lab = el('cfgTransporteOrigemLabel');
    var lat = el('cfgTransporteOrigemLat');
    var lng = el('cfgTransporteOrigemLng');
    var cep = el('cfgTransporteCep');
    if (km) km.value = cfg.valor_por_km != null ? cfg.valor_por_km : 0;
    if (lab) lab.value = cfg.origem_label || 'Centro de São Paulo';
    if (lat) lat.value = cfg.origem_lat != null ? cfg.origem_lat : -23.5505;
    if (lng) lng.value = cfg.origem_lng != null ? cfg.origem_lng : -46.6333;
    if (cep && cfg.origem_cep) cep.value = cfg.origem_cep;
  }

  async function buscarCepOrigem() {
    var cepEl = el('cfgTransporteCep');
    var status = el('cfgTransporteCepStatus');
    if (!cepEl) return;
    var cep = (cepEl.value || '').replace(/\D/g, '');
    if (cep.length !== 8) {
      if (status) status.textContent = 'CEP inválido (use 8 dígitos).';
      return;
    }
    if (status) status.textContent = 'Consultando CEP...';
    try {
      var res = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
      var data = await res.json();
      if (data.erro) {
        if (status) status.textContent = 'CEP não encontrado.';
        return;
      }
      var label = [data.logradouro, data.bairro, data.localidade, data.uf].filter(Boolean).join(', ');
      var lab = el('cfgTransporteOrigemLabel');
      if (lab) lab.value = label || (data.localidade + ' - ' + data.uf);
      if (status) status.textContent = 'CEP ok — buscando coordenadas...';

      var q = encodeURIComponent((data.logradouro || '') + ', ' + (data.localidade || '') + ', ' + (data.uf || '') + ', Brasil');
      var geo = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + q, {
        headers: { 'Accept-Language': 'pt-BR' }
      });
      var geoData = await geo.json();
      if (geoData && geoData[0]) {
        var latEl = el('cfgTransporteOrigemLat');
        var lngEl = el('cfgTransporteOrigemLng');
        if (latEl) latEl.value = parseFloat(geoData[0].lat).toFixed(6);
        if (lngEl) lngEl.value = parseFloat(geoData[0].lon).toFixed(6);
        if (status) status.textContent = 'Origem definida: ' + (lab ? lab.value : label);
      } else {
        if (status) status.textContent = 'Endereço preenchido. Coordenadas não encontradas — ajuste manualmente se precisar.';
      }
    } catch (err) {
      console.error(err);
      if (status) status.textContent = 'Erro ao consultar CEP. Tente de novo.';
    }
  }

  async function saveConfigTransporte() {
    var btn = el('btn-save-transporte');
    if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
    var payload = {
      valor_por_km: parseFloat(el('cfgTransporteValorKm').value) || 0,
      origem_label: el('cfgTransporteOrigemLabel').value || 'Centro de São Paulo',
      origem_lat: parseFloat(el('cfgTransporteOrigemLat').value) || -23.5505,
      origem_lng: parseFloat(el('cfgTransporteOrigemLng').value) || -46.6333,
      origem_cep: (el('cfgTransporteCep') && el('cfgTransporteCep').value) || null,
      atualizado_em: new Date().toISOString()
    };
    var id = DATA.configTransporte && DATA.configTransporte.id;
    var ok = id ? await sbPatch('co_config_transporte', id, payload) : !!(await sbPost('co_config_transporte', Object.assign({ ativo: true }, payload)));
    if (btn) { btn.disabled = false; btn.textContent = '💾 Salvar tarifa'; }
    if (ok) { toast('Transporte salvo', 'ok'); markSaved(); await loadCalc1Data(); }
    else toast('Erro ao salvar transporte', 'err');
  }

  // ============================================================

  async function loadPageData() {
    var data = await sbGet('co_config_transporte', 'select=*&ativo=eq.true&limit=1');
    var ok = data !== null;
    setDbStatus(ok);
    DATA.configTransporte = (data && data[0]) ? data[0] : null;
    renderConfigTransporte();
    if (ok) toast('Transporte carregado', 'ok');
    else toast('Erro ao carregar', 'err');
  }
  window.__adminPageInit = function () { loadPageData(); };
  window.saveConfigTransporte = saveConfigTransporte;
  window.buscarCepOrigem = buscarCepOrigem;
  window.loadCalc1Data = loadPageData;
  window.confirmClose = confirmClose;

      // Atualiza a flag de admin e valida o cache sem piscar o menu
      var roleNorm = String(parceiro.role || parceiro.nivel || '').toLowerCase().trim();
      var isAdmin = roleNorm === 'admin' || roleNorm === 'master';
      window.updateAdminState(isAdmin);

      if (typeof window.__adminPageInit === 'function') {
        window.__adminPageInit(parceiro, isAdmin);
      }
    }).catch(function (err) {
      console.error('Erro na autenticação:', err);
    });
  </script>
