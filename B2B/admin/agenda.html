<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda · 432UP Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../partner-config.js"></script>
<style>
:root{
  --aurora-primary:#00FF66; --aurora-accent:#FF007F; --gold:#D4AF37; --purple:#A855F7;
  --tech:#06B6D4; --red:#FF4D4D; --text-body:#E7E7EC;
  --acc:#00FF66; --ouro:#D4AF37; --ciano:#06B6D4; --txt:#FFFFFF;
  --mut:rgba(231,231,236,.62); --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.045);
  --lilas:#C084FC;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#08080A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#orbit-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.plasma-top-layer{position:fixed;inset:0;z-index:1;pointer-events:none}

/* Tudo da página fica dentro de .pg — o menu global (injetado) não é tocado */
.pg{position:relative;z-index:2}
.pg a{color:var(--ciano);text-decoration:none}
.pg header{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:118px 0 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border:0;background:none}
.pg .hd-title{display:flex;flex-direction:column}
.pg .hd-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pg .kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--aurora-primary);opacity:.8;margin-bottom:10px}
.pg h1{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.045em;line-height:1;margin:0;font-weight:800}
.pg h1#tituloMes{text-transform:capitalize}
.pg h2{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.pg .vivo{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--aurora-primary);font-weight:700}
.pg .link{font-size:13px;margin-left:4px}

.pg button,.pg select,.pg input,.pg textarea{font:inherit;color:#fff;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:999px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.3s ease;min-height:40px}
.pg button{cursor:pointer}
.pg button:hover{border-color:rgba(255,255,255,.38);background:rgba(255,255,255,.1)}
.pg button.primary{background:var(--aurora-primary);color:#08080A;border-color:var(--aurora-primary);font-weight:700;box-shadow:0 0 28px rgba(0,255,102,.18)}
.pg button.danger{color:#FF9AB8;border-color:rgba(255,0,127,.35)}
.pg button:disabled{opacity:.5;cursor:default}
.pg input,.pg select,.pg textarea{border-radius:14px;padding:10px 14px;background:rgba(0,0,0,.28)}
.pg input[type=checkbox]{accent-color:var(--aurora-primary);width:15px;height:15px;min-height:0;padding:0;border-radius:4px;background:none;border:0;backdrop-filter:none}
.pg select option{background:#0c0c10;color:#fff}

.pg .card,.pg .painel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:clamp(20px,3vw,30px);margin-bottom:14px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 0 50px rgba(168,85,247,.055)}
.pg .painel{align-self:start}
.pg .mut{color:var(--mut);font-size:12px}
.pg .vazio{color:var(--mut);font-size:13px;padding:6px 0}
.pg .msg{font-size:12px;min-height:16px;color:#FF9AB8;margin-top:8px}
.pg .msg.ok{color:var(--aurora-primary)}

.pg .tag{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(255,255,255,.72)}
.pg .t-ok,.pg .tag.ok{color:var(--aurora-primary);border-color:rgba(0,255,102,.35);background:rgba(0,255,102,.08)}
.pg .t-pend,.pg .t-hold,.pg .tag.pend{color:var(--gold);border-color:rgba(212,175,55,.35);background:rgba(212,175,55,.08)}
.pg .t-rec,.pg .t-x{color:var(--aurora-accent);border-color:rgba(255,0,127,.35);background:rgba(255,0,127,.07)}

.pg .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;flex-wrap:wrap}
.pg .item:last-child{border-bottom:0}
.pg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pg .row label,.pg .grid2 label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:6px;font-weight:700}
.pg .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== Projeto ===== */
body.pg-projeto .pg main{width:min(1180px,calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:0 0 60px}
.pg .proj{padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:16px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.03);transition:.3s ease}
.pg .proj:hover{border-color:rgba(255,255,255,.3)}
.pg .proj.on{border-color:var(--aurora-primary);background:rgba(0,255,102,.06)}
.pg .proj small{color:var(--mut);font-size:12px}
.pg input#busca{width:100%;margin-bottom:12px}

/* ===== Agenda ===== */
.pg .filtros{width:min(1180px,calc(100% - 32px));margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(10,8,20,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:12px}
.pg .filtros .lbl{color:var(--mut);margin-right:4px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.6rem}
.pg .tog{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:5px 10px;border-radius:999px;border:1px solid transparent;color:var(--text-body)}
.pg .tog:hover{border-color:rgba(255,255,255,.2)}
.pg .tog.off{opacity:.4}
.pg .tog .dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.pg .legenda{width:min(1180px,calc(100% - 32px));margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);padding:0 6px}
.pg .legenda span{display:inline-flex;align-items:center;gap:5px}
.pg .legenda i{width:9px;height:9px;border-radius:3px;display:inline-block}
body.pg-agenda .pg main{width:min(1180px,calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 0 60px}
.pg .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.pg .dow{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);text-align:center;padding:6px 0;font-weight:700}
.pg .dia{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:16px;min-height:96px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:.3s ease}
.pg .dia:hover{border-color:rgba(192,132,252,.55)}
.pg .dia.outro{opacity:.3}
.pg .dia.hoje{outline:1px solid var(--lilas);outline-offset:-1px}
.pg .dia.sel{border-color:var(--lilas);background:rgba(168,85,247,.09)}
.pg .num{font-size:12px;font-weight:700;color:var(--mut)}
.pg .ev{font-size:11px;line-height:1.25;padding:3px 6px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pg .mais{font-size:10px;color:var(--mut);padding-left:2px}
/* Cores da agenda do portal — evento em lilás */
.pg .e-evento{background:rgba(192,132,252,.2);color:#E9D5FF}
.pg .e-hold{background:rgba(249,115,22,.18);color:#FDBA74}
.pg .e-contrato{background:rgba(37,99,235,.22);color:#93C5FD}
.pg .e-aprovado{background:rgba(34,197,94,.18);color:#86EFAC}
.pg .e-comissao{background:rgba(21,128,61,.25);color:#BBF7D0}
.pg .e-recebimento{background:rgba(134,239,172,.13);color:#DCFCE7}
.pg .e-lead{background:rgba(250,204,21,.16);color:#FDE68A}
.pg .e-bloqueio{background:rgba(100,116,139,.25);color:#CBD5E1}
body.pg-agenda .pg .item{display:block;border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.035);cursor:pointer;transition:.3s ease}
body.pg-agenda .pg .item:hover{background:rgba(255,255,255,.07)}
body.pg-agenda .pg .item strong{display:block;margin-bottom:2px}
body.pg-agenda .pg .item small{color:var(--mut);display:block;margin-top:2px;font-size:12px}
body.pg-agenda .pg .item .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
body.pg-agenda .pg .item .tag{font-size:.55rem;padding:3px 8px}
.pg .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pg .acoes a,.pg .acoes button{font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.055);color:#fff;min-height:0}
.pg .acoes a.pri{background:var(--aurora-primary);color:#08080A;border-color:var(--aurora-primary);font-weight:700}

/* ===== Espelho (mesma ideia da tela do cliente) ===== */
body.pg-espelho .pg main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:0 0 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pg .col{display:flex;flex-direction:column;min-width:0}
.pg .rs-linha{padding:7px 0}
.pg .rs-rot{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.pg .rs-val{display:block;font-size:15px;font-weight:600}
.pg .eq-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.pg .eq-row:last-child{border-bottom:0}
.pg .eq-av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:1px solid rgba(192,132,252,.5);background:rgba(168,85,247,.14);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
.pg .eq-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pg .eq-name{font-size:15px;font-weight:700;color:#fff}
.pg .eq-role{font-size:12px;color:var(--mut);display:block;margin-top:2px}

/* Rodapé */
.pg .site-foot{width:min(1180px,calc(100% - 32px));margin:24px auto 0;padding:18px 0 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);font-size:.72rem;opacity:.7}
.pg .site-foot span:last-child{color:var(--aurora-primary);opacity:.8}

@media(max-width:900px){
  body.pg-agenda .pg main,body.pg-projeto .pg main{grid-template-columns:1fr}
  body.pg-espelho .pg main{display:flex;flex-direction:column;gap:0}
  body.pg-espelho .pg .col{display:contents}
  .o-resumo{order:1}.o-equipe{order:2}.o-etapas{order:3}.o-obs{order:4}.o-comps{order:5}
}
@media(max-width:620px){
  .pg header{padding-top:110px}
  .pg .grid2{grid-template-columns:1fr}
  .pg .dia{min-height:72px;padding:6px}
  .pg .ev{font-size:10px}
  .pg .grid,.pg .dow{gap:4px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.001ms!important;animation-duration:.001ms!important}}

</style>

<body class="pg-agenda">
<canvas id="orbit-canvas"></canvas>
<div id="plasmaLayer" class="plasma-top-layer"></div>
<header id="calc-header"></header>
<div id="mobile-menu"></div>
<div class="pg"><header>
  <div class="hd-title"><span class="kicker">432UP! Produções · Admin</span><h1 id="tituloMes">Agenda</h1></div>
  <div class="hd-nav">
    <button type="button" id="btnPrev" aria-label="Mês anterior">‹</button>
    <button type="button" id="btnHoje">Hoje</button>
    <button type="button" id="btnNext" aria-label="Próximo mês">›</button>
    <a class="link" href="projeto.html">Projetos →</a>
    <a class="link" href="../checklist.html">Checklist →</a>
  </div>
</header>

<div class="filtros" id="filtros">
  <span class="lbl">Mostrar:</span>
</div>

<div class="legenda" id="legenda"></div>

<main>
  <section>
    <div class="grid" id="cabec"></div>
    <div class="grid" id="grade"></div>
  </section>
  <aside class="painel">
    <h2 id="tituloDia">Selecione um dia</h2>
    <div id="listaDia" class="vazio">Clique em um dia para ver os itens.</div>
  </aside>
</main>

<script>
(function () {
  'use strict';

  var CFG = window.PARTNER_CFG;
  if (!CFG) { document.body.innerHTML = '<p style="padding:40px;color:#e2e8f0;font-family:system-ui">Configuração ausente.</p>'; return; }

  if (typeof window.sbPartner === 'undefined') {
    window.sbPartner = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  var SB = window.sbPartner;

  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var DIAS = ['seg','ter','qua','qui','sex','sáb','dom'];
  var CACHE_KEY = '432up_agenda_filtros_v1';

  /* Tipos e toggles — padrão: todos ligados */
  var TIPOS = [
    { id: 'evento',      label: 'Eventos',            cls: 'e-evento',      cor: '#c084fc' },
    { id: 'hold',        label: 'Holding',            cls: 'e-hold',        cor: '#f97316' },
    { id: 'contrato',    label: 'Contratos',          cls: 'e-contrato',    cor: '#2563eb' },
    { id: 'aprovado',    label: 'Aprovados / depósito', cls: 'e-aprovado',  cor: '#22c55e' },
    { id: 'comissao',    label: 'Comissões a pagar',  cls: 'e-comissao',    cor: '#15803d' },
    { id: 'recebimento', label: 'Recebimentos',       cls: 'e-recebimento', cor: '#86efac' },
    { id: 'lead',        label: 'Leads (data)',        cls: 'e-lead',        cor: '#facc15' },
    { id: 'bloqueio',    label: 'Bloqueios / indispon.', cls: 'e-bloqueio', cor: '#64748b' }
  ];

  function carregarFiltros() {
    var padrao = {};
    TIPOS.forEach(function (t) { padrao[t.id] = true; });
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        var salvos = JSON.parse(raw);
        TIPOS.forEach(function (t) {
          if (typeof salvos[t.id] === 'boolean') padrao[t.id] = salvos[t.id];
        });
      }
    } catch (e) {}
    return padrao;
  }

  function salvarFiltros() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(FILTROS)); } catch (e) {}
  }

  var FILTROS = carregarFiltros();
  var ANO, MES, DIA_SEL = null;
  var ITENS = {};   // 'YYYY-MM-DD' -> [item]
  var CHECKLIST = {}; // proposta_id -> { total, pend, ok }

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  function chave(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function chaveData(s) { return s ? String(s).slice(0, 10) : null; }
  function tempo(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    } catch (e) { return ''; }
  }
  function add(k, item) {
    if (!k) return;
    (ITENS[k] = ITENS[k] || []).push(item);
  }
  function nomeParceiro(p) {
    if (!p) return '';
    return p.nome_artistico || p.nome_completo || '';
  }

  /* ---------- UI dos toggles ---------- */
  function montarFiltros() {
    var box = $('filtros');
    var html = '<span class="lbl">Mostrar:</span>';
    TIPOS.forEach(function (t) {
      var on = FILTROS[t.id] !== false;
      html += '<label class="tog' + (on ? '' : ' off') + '" data-id="' + t.id + '">' +
        '<input type="checkbox" ' + (on ? 'checked' : '') + '>' +
        '<i class="dot" style="background:' + t.cor + '"></i>' +
        E(t.label) +
        '</label>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.tog').forEach(function (lab) {
      var id = lab.getAttribute('data-id');
      var inp = lab.querySelector('input');
      inp.addEventListener('change', function () {
        FILTROS[id] = inp.checked;
        lab.classList.toggle('off', !inp.checked);
        salvarFiltros();
        desenhar();
        if (DIA_SEL) abrirDia(DIA_SEL, true);
      });
    });

    // Legenda compacta
    $('legenda').innerHTML = TIPOS.map(function (t) {
      return '<span><i style="background:' + t.cor + '"></i>' + E(t.label) + '</span>';
    }).join('');
  }

  function visivel(tipo) {
    return FILTROS[tipo] !== false;
  }

  /* ---------- Carga de dados ---------- */
  async function carregarMes() {
    ITENS = {};
    CHECKLIST = {};
    var primeiro = new Date(ANO, MES, 1);
    var ultimo = new Date(ANO, MES + 1, 0);
    var ini = chave(primeiro);
    var fim = chave(ultimo);

    // 1. Propostas (eventos, holds, contratos)
    var rProp = await SB.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, horario_inicio, status, hold_expira_em, assinado_em, cancelada_em, comissao_status, comissao_paga, comissao_valor, comissao_solicitada_valor, comissao_solicitada_data, pagamento_agenda, parceiro_id, parceiros:parceiros!parceiro_id(nome_completo, nome_artistico)')
      .or('data_evento.gte.' + ini + ',hold_expira_em.gte.' + ini + ',assinado_em.gte.' + ini + ',comissao_solicitada_data.gte.' + ini)
      .is('cancelada_em', null);

    var props = rProp.data || [];
    var idsProp = [];

    props.forEach(function (p) {
      idsProp.push(p.id);
      var vend = nomeParceiro(p.parceiros);

      // Evento principal
      var de = chaveData(p.data_evento);
      if (de && de >= ini && de <= fim) {
        add(de, {
          tipo: 'evento',
          id: p.id,
          titulo: p.cliente_nome || ('#' + p.numero),
          sub: (p.horario_inicio ? String(p.horario_inicio).slice(0,5) + ' · ' : '') + (p.tipo_evento || '') + (vend ? ' · ' + vend : ''),
          prop: p
        });
      }

      // Holding
      if (p.hold_expira_em && !p.assinado_em) {
        var dh = chaveData(p.hold_expira_em);
        if (dh && dh >= ini && dh <= fim) {
          add(dh, {
            tipo: 'hold',
            id: p.id,
            titulo: 'Hold · ' + (p.cliente_nome || ('#' + p.numero)),
            sub: 'Expira ' + tempo(p.hold_expira_em),
            prop: p
          });
        }
      }

      // Contrato assinado (no dia da assinatura)
      if (p.assinado_em) {
        var dc = chaveData(p.assinado_em);
        if (dc && dc >= ini && dc <= fim) {
          add(dc, {
            tipo: 'contrato',
            id: p.id,
            titulo: 'Contrato · ' + (p.cliente_nome || ('#' + p.numero)),
            sub: p.tipo_evento || '',
            prop: p
          });
        }
      }

      // Comissão solicitada (aguardando pagamento)
      if (p.comissao_solicitada_valor > 0 && p.comissao_solicitada_data) {
        var dcom = chaveData(p.comissao_solicitada_data);
        if (dcom && dcom >= ini && dcom <= fim && !p.comissao_paga) {
          add(dcom, {
            tipo: 'comissao',
            id: p.id,
            titulo: 'Comissão · ' + (vend || 'vendedor'),
            sub: 'R$ ' + Number(p.comissao_solicitada_valor).toFixed(2) + ' · #' + p.numero,
            prop: p
          });
        }
      }

      // Recebimentos do cliente (pagamento_agenda JSON)
      var pa = p.pagamento_agenda || {};
      [['entrada', pa.data_entrada, pa.status_entrada], ['saldo', pa.data_saldo, pa.status_saldo]].forEach(function (row) {
        var dia = chaveData(row[1]);
        if (!dia || dia < ini || dia > fim || row[2] === 'pago') return;
        add(dia, {
          tipo: 'recebimento',
          id: p.id,
          titulo: (p.cliente_nome || 'Cliente') + ' · ' + row[0],
          sub: '#' + p.numero + ' · pendente',
          prop: p
        });
      });
    });

    // 2. Comprovantes aprovados → marca “aprovado” no dia do evento (ou da aprovação)
    if (idsProp.length) {
      try {
        var { data: comps } = await SB.from('contrato_comprovantes')
          .select('proposta_id, status, aprovado_em')
          .in('proposta_id', idsProp)
          .eq('status', 'aprovado');
        (comps || []).forEach(function (c) {
          var p = props.find(function (x) { return x.id === c.proposta_id; });
          if (!p) return;
          var dia = chaveData(c.aprovado_em) || chaveData(p.data_evento);
          if (dia && dia >= ini && dia <= fim) {
            add(dia, {
              tipo: 'aprovado',
              id: p.id,
              titulo: 'Depósito ok · ' + (p.cliente_nome || ('#' + p.numero)),
              sub: p.tipo_evento || '',
              prop: p
            });
          }
        });
      } catch (e) {}
    }

    // 3. Bloqueios / indisponibilidades (agenda_reservas)
    try {
      var { data: res } = await SB.from('agenda_reservas')
        .select('id, tipo, proposta_id, data_inicio, data_fim, observacao, recurso:parceiros!recurso_id(nome_completo, nome_artistico)')
        .lte('data_inicio', fim).gte('data_fim', ini);
      (res || []).forEach(function (r) {
        if (r.tipo !== 'indisponibilidade' && r.tipo !== 'bloqueio') return;
        var a = new Date(r.data_inicio + 'T00:00:00');
        var b = new Date(r.data_fim + 'T00:00:00');
        for (var d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
          var k = chave(d);
          if (k < ini || k > fim) continue;
          add(k, {
            tipo: 'bloqueio',
            id: r.id,
            titulo: nomeParceiro(r.recurso) || 'Recurso',
            sub: r.observacao || 'Indisponível',
            reserva: r
          });
        }
      });
    } catch (e) {}

    // 4. Leads (se a tabela existir)
    try {
      var { data: leads } = await SB.from('co_leads')
        .select('id, nome, data_evento')
        .gte('data_evento', ini).lte('data_evento', fim);
      (leads || []).forEach(function (l) {
        add(chaveData(l.data_evento), {
          tipo: 'lead',
          id: l.id,
          titulo: l.nome || 'Lead',
          sub: 'Pediu esta data'
        });
      });
    } catch (e) {
      // tabela pode não existir ou ter outro nome — ignora
    }

    // 5. Checklist dos eventos do mês (uma query só)
    if (idsProp.length) {
      try {
        var { data: etapas } = await SB.from('evento_etapas')
          .select('proposta_id, situacao')
          .in('proposta_id', idsProp);
        (etapas || []).forEach(function (e) {
          if (!CHECKLIST[e.proposta_id]) CHECKLIST[e.proposta_id] = { total: 0, pend: 0, ok: 0 };
          CHECKLIST[e.proposta_id].total++;
          if (e.situacao === 'pendente') CHECKLIST[e.proposta_id].pend++;
          else CHECKLIST[e.proposta_id].ok++;
        });
      } catch (e) {}
    }

    desenhar();
  }

  /* ---------- Desenho ---------- */
  function desenhar() {
    $('tituloMes').textContent = MESES[MES] + ' ' + ANO;
    $('cabec').innerHTML = DIAS.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');

    var grade = $('grade');
    var primeiro = new Date(ANO, MES, 1);
    var offset = (primeiro.getDay() + 6) % 7; // segunda = 0
    var inicio = new Date(primeiro); inicio.setDate(1 - offset);
    var hoje = chave(new Date());
    var html = '';

    for (var i = 0; i < 42; i++) {
      var d = new Date(inicio); d.setDate(inicio.getDate() + i);
      var k = chave(d);
      var todos = ITENS[k] || [];
      var itens = todos.filter(function (it) { return visivel(it.tipo); });
      var cls = ['dia'];
      if (d.getMonth() !== MES) cls.push('outro');
      if (k === hoje) cls.push('hoje');
      if (k === DIA_SEL) cls.push('sel');

      var chips = itens.slice(0, 3).map(function (it) {
        var t = TIPOS.find(function (x) { return x.id === it.tipo; });
        var c = t ? t.cls : 'e-evento';
        return '<div class="ev ' + c + '">' + E(it.titulo) + '</div>';
      }).join('');
      var mais = itens.length > 3 ? '<div class="mais">+' + (itens.length - 3) + '</div>' : '';

      html += '<div class="' + cls.join(' ') + '" data-k="' + k + '">' +
        '<span class="num">' + d.getDate() + '</span>' + chips + mais + '</div>';
    }
    grade.innerHTML = html;
    grade.querySelectorAll('[data-k]').forEach(function (el) {
      el.addEventListener('click', function () { abrirDia(el.getAttribute('data-k')); });
    });
    if (DIA_SEL) abrirDia(DIA_SEL, true);
  }

  function abrirDia(k, silencioso) {
    DIA_SEL = k;
    var partes = k.split('-');
    $('tituloDia').textContent = partes[2] + '/' + partes[1] + '/' + partes[0];

    var todos = ITENS[k] || [];
    var itens = todos.filter(function (it) { return visivel(it.tipo); });

    if (!itens.length) {
      $('listaDia').className = 'vazio';
      $('listaDia').textContent = todos.length
        ? 'Nada neste dia com os filtros atuais.'
        : 'Nada neste dia.';
    } else {
      $('listaDia').className = '';
      $('listaDia').innerHTML = itens.map(function (it) {
        var t = TIPOS.find(function (x) { return x.id === it.tipo; });
        var cor = t ? t.cor : '#64748b';
        var p = it.prop;
        var tags = '';
        var acoes = '';

        if (p && it.tipo === 'evento') {
          var ck = CHECKLIST[p.id] || { total: 0, pend: 0, ok: 0 };
          if (ck.total === 0) {
            tags += '<span class="tag pend">Sem checklist</span>';
          } else if (ck.pend === 0) {
            tags += '<span class="tag ok">Checklist ✓</span>';
          } else {
            tags += '<span class="tag pend">' + ck.pend + ' etapa' + (ck.pend > 1 ? 's' : '') + ' pend.</span>';
          }
          if (p.comissao_paga) tags += '<span class="tag ok">Comissão paga</span>';
          else if (p.comissao_status) tags += '<span class="tag">' + E(p.comissao_status) + '</span>';
          if (p.status) tags += '<span class="tag">' + E(p.status) + '</span>';

          acoes =
            '<div class="acoes">' +
              '<a class="pri" href="projeto.html?id=' + encodeURIComponent(p.id) + '">Abrir ficha</a>' +
              '<a href="../checklist.html?proposta=' + encodeURIComponent(p.id) + '">Checklist</a>' +
              '<a href="espelho.html?id=' + encodeURIComponent(p.id) + '">Espelho do cliente</a>' +
            '</div>';
        } else if (p && (it.tipo === 'hold' || it.tipo === 'contrato' || it.tipo === 'comissao' || it.tipo === 'recebimento' || it.tipo === 'aprovado')) {
          acoes =
            '<div class="acoes">' +
              '<a class="pri" href="projeto.html?id=' + encodeURIComponent(p.id) + '">Abrir ficha</a>' +
            '</div>';
        }

        return '<div class="item" style="border-left-color:' + cor + '" data-tipo="' + E(it.tipo) + '" data-id="' + E(it.id) + '">' +
          '<strong>' + E(it.titulo) + '</strong>' +
          (it.sub ? '<small>' + E(it.sub) + '</small>' : '') +
          (tags ? '<div class="tags">' + tags + '</div>' : '') +
          acoes +
          '</div>';
      }).join('');
    }

    if (!silencioso) {
      document.querySelectorAll('#grade .dia').forEach(function (el) {
        el.classList.toggle('sel', el.getAttribute('data-k') === k);
      });
    }
  }

  /* ---------- Navegação ---------- */
  $('btnPrev').addEventListener('click', function () {
    MES--; if (MES < 0) { MES = 11; ANO--; }
    carregarMes();
  });
  $('btnNext').addEventListener('click', function () {
    MES++; if (MES > 11) { MES = 0; ANO++; }
    carregarMes();
  });
  $('btnHoje').addEventListener('click', function () {
    var h = new Date();
    ANO = h.getFullYear(); MES = h.getMonth();
    DIA_SEL = chave(h);
    carregarMes();
  });

  /* ---------- Init ---------- */
  (async function init() {
    var s = await SB.auth.getSession();
    if (!(s.data && s.data.session)) { location.href = '../login.html'; return; }
    var r = await SB.from('parceiros').select('role').eq('user_id', s.data.session.user.id).maybeSingle();
    if (!r.data || !/^(admin|master)$/i.test(String(r.data.role || '').trim())) {
      document.querySelector('main').innerHTML = '<div class="card"><div class="vazio">Acesso restrito ao administrador.</div></div>';
      return;
    }
    var hoje = new Date();
    ANO = hoje.getFullYear();
    MES = hoje.getMonth();
    DIA_SEL = chave(hoje);
    montarFiltros();
    await carregarMes();
    setInterval(function () { if (document.visibilityState === 'visible') desenhar(); }, 30000);
  })();
})();
</script>
