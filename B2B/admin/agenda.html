<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Agenda · 432UP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    :root {
      --bg: #08080A;
      --text: #FFFFFF;
      --body: #E7E7EC;
      --mut: #9A97B0;
      --action: #00FF66;
      --purple: #A855F7;
      --pink: #FF007F;
      --tech: #06B6D4;
      --gold: #D4AF37;
      --alert: #FF4D4D;
      --line: rgba(255, 255, 255, 0.1);
      --ciano: #06B6D4;
      --laranja: #f97316;
      --amb: #facc15;
      --azul: #3b82f6;
    }
    body { background: var(--bg) !important; color: var(--text) !important; font-family: 'Inter', system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    .area {
      width: 100%; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2;
      padding-top: calc(var(--hdr-h, 112px) + 24px);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }
    html, body { height: auto !important; min-height: 100%; }
    body { overflow-y: visible !important; }
    .eyebrow { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; opacity: .72; color: var(--gold); }
    .titulo { font-size: clamp(1.4rem, 3.5vw, 2rem); line-height: 1.15; letter-spacing: -.03em; margin: 6px 0 12px; font-weight: 800; text-transform: capitalize; }
    .mut { color: var(--mut); }
    .box-full {
      border-radius: 20px; padding: 16px; position: relative; overflow: visible; margin-bottom: 12px;
      background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .box-full h2 {
      font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 10px; font-weight: 800;
    }
    button, .btn-s {
      font: inherit; color: var(--text);
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
      padding: 8px 14px; border-radius: 12px; cursor: pointer;
    }
    button:hover, .btn-s:hover { border-color: rgba(0,255,102,.45); }
    a.tech { color: var(--tech); text-decoration: none; font-size: 13px; font-weight: 600; }
    a.tech:hover { text-decoration: underline; }

    .topo-agenda {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .nav-row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .nav-row button {
      min-width: 40px; padding: 8px 12px; font-weight: 700;
    }

    /* Cápsulas de filtro: uma linha, rolagem horizontal */
    .filtros {
      display: flex; flex-wrap: nowrap; gap: 8px; padding: 6px 0 14px;
      font-size: 12px; align-items: center;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; touch-action: pan-x;
      margin: 0 -4px; padding-left: 4px; padding-right: 4px;
    }
    .filtros::-webkit-scrollbar { display: none; }
    .filtros .lbl { display: none; } /* rótulo "Mostrar:" dispensável com cápsulas */
    .leg {
      flex: 0 0 auto; scroll-snap-align: start;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 700; color: var(--mut); white-space: nowrap;
      background: rgba(255, 255, 255, .03); border: 1px solid var(--line);
      transition: background .2s, border-color .2s, color .2s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .leg .sw { width: 9px; height: 9px; border-radius: 999px; background: var(--c); flex: none; }
    .leg.on { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
    .leg:not(.on) { opacity: .5; }
    .leg:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

    .legenda { display: none !important; }

    .agenda-grid {
      display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px;
    }
    @media (max-width: 900px) { .agenda-grid { grid-template-columns: 1fr; } }

    .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .dow { font-size: 11px; text-transform: uppercase; color: var(--mut); text-align: center; padding: 4px 0; font-weight: 700; }
    .dia {
      background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px;
      aspect-ratio: 1; min-height: 0; padding: 6px; cursor: pointer;
      display: flex; flex-direction: column; gap: 2px; overflow: hidden;
      transition: border-color .15s, background .15s;
    }
    @media (min-width: 901px) {
      .dia { aspect-ratio: auto; min-height: 90px; }
    }
    .dia:hover { border-color: rgba(212, 175, 55, .45); }
    .dia.outro { opacity: .4; }
    .dia.hoje { outline: 2px solid var(--gold); outline-offset: -2px; }
    .dia.hoje .num { color: var(--gold); font-weight: 800; }
    /* Seleção no mesmo dourado do "hoje" — intuitivo */
    .dia.sel {
      border-color: rgba(212, 175, 55, .65);
      background: rgba(212, 175, 55, .12);
      outline: 2px solid var(--gold);
      outline-offset: -2px;
    }
    .dia.sel .num { color: var(--gold); font-weight: 800; }
    #calSwipe {
      touch-action: pan-y;
      user-select: none;
    }
    .num { font-size: 12px; font-weight: 700; color: var(--mut); }
    .ev {
      font-size: 11px; line-height: 1.25; padding: 2px 5px; border-radius: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600;
    }
    .mais { font-size: 10px; color: var(--mut); padding-left: 2px; }
    .marks { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; min-height: 6px; }
    .marks i {
      display: block; width: 7px; height: 7px; border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    }

    .e-evento { background: rgba(192, 132, 252, .18); color: #e9d5ff; }
    .e-hold { background: rgba(249, 115, 22, .2); color: var(--laranja); }
    .e-contrato { background: rgba(59, 130, 246, .22); color: #93c5fd; }
    .e-aprovado { background: rgba(245, 208, 97, .16); color: #F5D061; }
    .e-comissao { background: rgba(21, 128, 61, .25); color: #86efac; }
    .e-recebimento { background: rgba(212, 175, 55, .16); color: #E8C96A; }
    .e-lead { background: rgba(250, 204, 21, .16); color: var(--amb); }
    .e-bloqueio { background: rgba(100, 116, 139, .22); color: #94a3b8; }

    /* Mobile: marcadores sólidos bem visíveis (bolinhas), sem texto minúsculo */
    @media (max-width: 900px) {
      .dia { padding: 5px 4px; }
      .num { font-size: 13px; color: #d4d4d8; }
      .dia.outro .num { color: #71717a; }
      .ev { display: none; } /* texto some no mobile; usa bolinhas */
      .mais { display: none; }
      .marks i { width: 8px; height: 8px; }
      .m-evento { background: #22d3ee; }
      .m-hold { background: #fb923c; }
      .m-contrato { background: #60a5fa; }
      .m-aprovado { background: #4ade80; }
      .m-comissao { background: #86efac; }
      .m-recebimento { background: #bbf7d0; }
      .m-lead { background: #facc15; }
      .m-bloqueio { background: #94a3b8; }
    }
    @media (min-width: 901px) {
      .marks { display: none; } /* desktop usa chips de texto */
    }

    /* Navegação do mês estilo iPhone: ‹ Outubro 2026 › */
    .mes-nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
    }
    /* Desktop: Agenda + mês + Hoje na mesma linha */
    @media (min-width: 901px) {
      .topo-agenda { display: none; } /* título sobe para a linha do mês */
      .mes-nav {
        flex-wrap: nowrap;
        margin-top: 4px;
      }
      .mes-nav .agenda-tit {
        display: block;
        font-size: clamp(1.4rem, 3.5vw, 2rem);
        font-weight: 800;
        letter-spacing: -.03em;
        margin: 0;
        line-height: 1.15;
      }
      .mes-nav .mes-ctrl { margin-left: 12px; }
      .mes-nav .btn-hoje { margin-left: auto; }
    }
    @media (max-width: 900px) {
      .mes-nav .agenda-tit { display: none; }
    }
    .mes-nav .mes-ctrl {
      display: inline-flex; align-items: center; gap: 2px;
      background: rgba(255,255,255,.05); border: 1px solid var(--line);
      border-radius: 14px; padding: 2px;
    }
    .mes-nav .mes-ctrl button {
      border: 0; background: transparent; padding: 8px 12px;
      font-weight: 700; min-width: 36px;
    }
    .mes-nav .mes-ctrl button:hover { background: rgba(255,255,255,.08); border-radius: 12px; }
    .mes-nav #tituloMes {
      border: 0; background: transparent; padding: 8px 10px;
      font-size: 15px; font-weight: 800; color: var(--text);
      text-transform: capitalize; cursor: pointer; letter-spacing: -.02em;
      white-space: nowrap;
    }
    .mes-nav #tituloMes:hover { color: var(--gold); }
    .mes-nav .btn-hoje {
      flex-shrink: 0; padding: 8px 14px; font-weight: 700;
      border-radius: 12px; border: 1px solid rgba(212,175,55,.4);
      background: rgba(212,175,55,.12); color: var(--gold);
    }

    /* Faixa horizontal: próximos eventos */
    .prox-wrap { margin: 0 0 12px; }
    .prox-label {
      font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
      font-weight: 700; color: var(--gold); opacity: .8; margin: 0 0 8px; padding-left: 2px;
    }
    .prox-scroll {
      display: flex; flex-wrap: nowrap; gap: 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; touch-action: pan-x;
      padding: 2px 2px 6px; margin: 0 -2px;
    }
    .prox-scroll::-webkit-scrollbar { display: none; }
    .prox-chip {
      flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px;
      min-width: 160px; max-width: 220px;
      padding: 10px 12px; border-radius: 14px;
      border: 1px solid var(--line); background: rgba(255,255,255,.04);
      cursor: pointer; text-align: left; color: var(--text); font: inherit;
      transition: border-color .15s, background .15s;
    }
    .prox-chip:hover, .prox-chip:active {
      border-color: rgba(0,255,102,.4); background: rgba(0,255,102,.06);
    }
    .prox-chip .px-data {
      font-size: 11px; font-weight: 800; color: var(--tech);
      letter-spacing: .02em;
    }
    .prox-chip .px-tit {
      font-size: 13px; font-weight: 700; line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .prox-chip .px-sub {
      font-size: 11px; color: var(--mut);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .prox-vazio { font-size: 12px; color: var(--mut); padding: 6px 2px; }

    .item {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
      font-size: 13px; cursor: pointer; border-left: 4px solid var(--line);
      transition: border-color .15s, background .15s; background: rgba(255,255,255,.02);
    }
    .item:hover { background: rgba(255,255,255,.04); }
    .item strong { display: block; margin-bottom: 2px; }
    .item small { color: var(--mut); display: block; margin-top: 2px; font-size: 12px; }
    .item .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .item .tag {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      background: rgba(255,255,255,.06); color: var(--mut);
    }
    .item .tag.ok { background: rgba(0, 255, 102, .14); color: var(--action); }
    .item .tag.pend { background: rgba(212, 175, 55, .14); color: var(--gold); }
    .item .acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .item .acoes a, .item .acoes button {
      font-size: 12px; padding: 5px 10px; border-radius: 8px; text-decoration: none;
      border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer;
    }
    .item .acoes a.pri { background: var(--action); color: #04120a; border-color: var(--action); font-weight: 700; }
    .vazio { color: var(--mut); font-size: 13px; padding: 6px 0; }
  </style>
</head>
<body class="h-full antialiased overflow-x-hidden">

  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <header id="calc-header"></header>
  <div id="mobile-menu"></div>

  <div class="flex flex-col min-h-screen relative z-10">
    <main class="area">
      <div class="topo-agenda">
        <div>
          <span class="eyebrow">Admin</span>
          <h1 class="titulo" style="margin-bottom:0">Agenda</h1>
        </div>
      </div>

      <h1 class="agenda-tit" style="display:block">Agenda</h1>

      <div class="prox-wrap" id="proxWrap" style="display:none">
        <div class="prox-label">Próximos eventos</div>
        <div class="prox-scroll" id="proxScroll"><div class="prox-vazio">Carregando…</div></div>
      </div>

      <div class="agenda-grid">
        <section class="box-full" style="padding:14px" id="calSwipe">
          <div class="filtros" id="filtros" aria-label="Filtros da agenda"></div>
          <div class="cal-nav">
            <button type="button" class="btn-s" id="btnPrev" aria-label="Mês anterior" style="margin-top:0">‹</button>
            <strong id="tituloMes" title="Ir para o mês de hoje" style="font-size:15px;cursor:pointer">Outubro 2026</strong>
            <button type="button" class="btn-s" id="btnNext" aria-label="Próximo mês" style="margin-top:0">›</button>
          </div>
          <div style="text-align:right;margin:-4px 0 8px"><button type="button" class="btn-hoje" id="btnHoje">Hoje</button></div>
          <div class="grid" id="cabec"></div>
          <div class="grid" id="grade" style="margin-top:6px"></div>
        </section>
        <aside class="box-full" id="painelDia">
          <h2 id="tituloDia">Selecione um dia</h2>
          <div id="listaDia" class="vazio">Clique em um dia para ver os itens.</div>
        </aside>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../partner-config.js"></script>
  <script src="../../script/script.js" defer></script>
  <script src="../partner-header.js"></script>
  <script>
(function () {
  'use strict';

  var CFG = window.PARTNER_CFG;
  if (!CFG) { document.body.innerHTML = '<p style="padding:40px;color:#e2e8f0">Configuração ausente.</p>'; return; }

  if (typeof window.sbPartner === 'undefined') {
    window.sbPartner = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  var SB = window.sbPartner;

  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var DIAS = ['seg','ter','qua','qui','sex','sáb','dom'];
  var CACHE_KEY = '432up_agenda_filtros_v1';

  /* Tipos e toggles — padrão: todos ligados */
  var TIPOS = [
    { id: 'evento',      label: 'Eventos',            cls: 'e-evento',      cor: '#c084fc' },
    { id: 'hold',        label: 'Holding',            cls: 'e-hold',        cor: '#f97316' },
    { id: 'contrato',    label: 'Contratos',          cls: 'e-contrato',    cor: '#3b82f6' },
    { id: 'aprovado',    label: 'Aprovados / depósito', cls: 'e-aprovado',  cor: '#F5D061' },
    { id: 'comissao',    label: 'Comissão / liberação', cls: 'e-comissao',  cor: '#15803d' },
    { id: 'recebimento', label: 'Recebimentos',       cls: 'e-recebimento', cor: '#D4AF37' },
    { id: 'lead',        label: 'Leads (data)',        cls: 'e-lead',        cor: '#facc15' },
    { id: 'bloqueio',    label: 'Bloqueios / indispon.', cls: 'e-bloqueio', cor: '#64748b' }
  ];

  function carregarFiltros() {
    var padrao = {};
    TIPOS.forEach(function (t) { padrao[t.id] = true; });
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        var salvos = JSON.parse(raw);
        TIPOS.forEach(function (t) {
          if (typeof salvos[t.id] === 'boolean') padrao[t.id] = salvos[t.id];
        });
      }
    } catch (e) {}
    return padrao;
  }

  function salvarFiltros() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(FILTROS)); } catch (e) {}
  }

  var FILTROS = carregarFiltros();
  var ANO, MES, DIA_SEL = null;
  var ITENS = {};   // 'YYYY-MM-DD' -> [item]
  var CHECKLIST = {}; // proposta_id -> { total, pend, ok }
  var ME = null;           // registro parceiros do usuário logado
  var IS_ADMIN = false;    // admin | master
  var ME_PROP_IDS = null;  // Set de proposta_id visíveis (null = todas, admin)

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  function chave(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function chaveData(s) { return s ? String(s).slice(0, 10) : null; }
  /* 3 dias úteis após a data (sábado/domingo não contam) */
  function maisTresUteis(iso) {
    var base = chaveData(iso);
    if (!base) return null;
    var d = new Date(base + 'T12:00:00');
    var n = 0;
    while (n < 3) {
      d.setDate(d.getDate() + 1);
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6) n++;
    }
    return chave(d);
  }
  function ehVendedorProp(p) {
    return !!(ME && p && String(p.parceiro_id) === String(ME.id));
  }
  function comissaoLiberada(p) {
    var st = String(p.comissao_status || '').toLowerCase().trim();
    return st === 'liberado' || st === 'liberada' || st === 'liberado_parcial';
  }
  function tempo(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    } catch (e) { return ''; }
  }
  function add(k, item) {
    if (!k) return;
    (ITENS[k] = ITENS[k] || []).push(item);
  }
  function nomeParceiro(p) {
    if (!p) return '';
    return p.nome_artistico || p.nome_completo || '';
  }

  /* ---------- UI dos toggles ---------- */
  function montarFiltros() {
    var box = $('filtros');
    box.innerHTML = TIPOS.map(function (t) {
      var on = FILTROS[t.id] !== false;
      return '<button type="button" class="leg' + (on ? ' on' : '') + '" data-filtro="' + t.id + '" aria-pressed="' + (on ? 'true' : 'false') + '" style="--c:' + t.cor + '"><i class="sw"></i>' + E(t.label) + '</button>';
    }).join('');
    box.querySelectorAll('button[data-filtro]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-filtro');
        FILTROS[id] = FILTROS[id] === false;
        var on = FILTROS[id] !== false;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        salvarFiltros();
        desenhar();
        renderProximos();
        if (DIA_SEL) abrirDia(DIA_SEL, true);
      });
    });
  }

  function visivel(tipo) {
    return FILTROS[tipo] !== false;
  }

  /* ---------- Carga de dados ---------- */
  async function carregarMes() {
    ITENS = {};
    CHECKLIST = {};
    PROXIMOS = [];
    var primeiro = new Date(ANO, MES, 1);
    var ultimo = new Date(ANO, MES + 1, 0);
    var ini = chave(primeiro);
    var fim = chave(ultimo);

    // 1. Propostas (eventos, holds, contratos)
    var rProp = await SB.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, horario_inicio, status, hold_expira_em, assinado_em, cancelada_em, comissao_status, comissao_paga, comissao_valor, comissao_solicitada_valor, comissao_solicitada_data, pagamento_agenda, parceiro_id, parceiros:parceiros!parceiro_id(nome_completo, nome_artistico)')
      .or('data_evento.gte.' + ini + ',hold_expira_em.gte.' + ini + ',assinado_em.gte.' + ini + ',comissao_solicitada_data.gte.' + ini)
      .is('cancelada_em', null);

    var props = rProp.data || [];

    /* Parceiro: só propostas em que participa (vendedor ou colaborador) */
    if (ME_PROP_IDS) {
      props = props.filter(function (p) { return ME_PROP_IDS.has(p.id); });
    }

    var idsProp = [];

    props.forEach(function (p) {
      idsProp.push(p.id);
      var vend = nomeParceiro(p.parceiros);

      // Evento principal
      var de = chaveData(p.data_evento);
      if (de) {
        var evItem = {
          tipo: 'evento',
          id: p.id,
          titulo: p.cliente_nome || ('#' + p.numero),
          sub: (p.horario_inicio ? String(p.horario_inicio).slice(0,5) + ' · ' : '') + (p.tipo_evento || '') + (vend ? ' · ' + vend : ''),
          prop: p,
          data: de
        };
        if (de >= ini && de <= fim) add(de, evItem);
        /* faixa de próximos: qualquer data >= hoje */
        var hojeK = chave(new Date());
        if (de >= hojeK) PROXIMOS.push(evItem);
      }

      // Holding
      if (p.hold_expira_em && !p.assinado_em) {
        var dh = chaveData(p.hold_expira_em);
        if (dh && dh >= ini && dh <= fim) {
          add(dh, {
            tipo: 'hold',
            id: p.id,
            titulo: 'Hold · ' + (p.cliente_nome || ('#' + p.numero)),
            sub: 'Expira ' + tempo(p.hold_expira_em),
            prop: p
          });
        }
      }

      // Contrato assinado (no dia da assinatura)
      if (p.assinado_em) {
        var dc = chaveData(p.assinado_em);
        if (dc && dc >= ini && dc <= fim) {
          add(dc, {
            tipo: 'contrato',
            id: p.id,
            titulo: 'Contrato · ' + (p.cliente_nome || ('#' + p.numero)),
            sub: p.tipo_evento || '',
            prop: p
          });
        }
      }

      // Comissão solicitada — só admin ou vendedor do projeto (não colaborador puro)
      if ((IS_ADMIN || ehVendedorProp(p)) && p.comissao_solicitada_valor > 0 && p.comissao_solicitada_data) {
        var dcom = chaveData(p.comissao_solicitada_data);
        if (dcom && dcom >= ini && dcom <= fim && !p.comissao_paga) {
          add(dcom, {
            tipo: 'comissao',
            id: p.id,
            titulo: 'Comissão · ' + (vend || 'vendedor'),
            sub: 'R$ ' + Number(p.comissao_solicitada_valor).toFixed(2) + ' · #' + p.numero,
            prop: p
          });
        }
      }

      // Recebimentos do contrato (pagamento_agenda) — SÓ admin e vendedor do projeto
      var pa = p.pagamento_agenda || {};
      if (IS_ADMIN || ehVendedorProp(p)) {
        [['entrada', pa.data_entrada, pa.status_entrada], ['saldo', pa.data_saldo, pa.status_saldo]].forEach(function (row) {
          var dia = chaveData(row[1]);
          if (!dia || dia < ini || dia > fim || row[2] === 'pago') return;
          add(dia, {
            tipo: 'recebimento',
            id: p.id,
            titulo: (p.cliente_nome || 'Cliente') + ' · ' + row[0],
            sub: '#' + p.numero + ' · pendente',
            prop: p
          });
        });
      }

      /* Previsão de liberação da comissão (3 dias úteis após cada parcela paga)
         Visível para vendedor e colaborador do projeto quando status da comissão = liberado */
      if (comissaoLiberada(p) && !p.comissao_paga) {
        var parcelas = [
          ['entrada', pa.data_entrada, pa.status_entrada],
          ['saldo', pa.data_saldo, pa.status_saldo]
        ];
        /* também aceita array genérico se existir */
        if (Array.isArray(pa.parcelas)) {
          pa.parcelas.forEach(function (par, i) {
            parcelas.push(['parcela ' + (i + 1), par.data || par.data_pagamento, par.status]);
          });
        }
        parcelas.forEach(function (row) {
          var st = String(row[2] || '').toLowerCase();
          if (st !== 'pago' && st !== 'pago' && st !== 'liquidado' && st !== 'recebido') return;
          var prev = maisTresUteis(row[1]);
          if (!prev || prev < ini || prev > fim) return;
          add(prev, {
            tipo: 'comissao',
            id: p.id,
            titulo: 'Liberação comissão · #' + p.numero,
            sub: 'Previsão · 3 dias úteis após ' + row[0] + (row[1] ? ' (' + chaveData(row[1]) + ')' : ''),
            prop: p
          });
        });
      }
    });

    // 2. Comprovantes aprovados → marca “aprovado” no dia do evento (ou da aprovação)
    if (idsProp.length) {
      try {
        var { data: comps } = await SB.from('contrato_comprovantes')
          .select('proposta_id, status, aprovado_em, data_pagamento')
          .in('proposta_id', idsProp)
          .eq('status', 'aprovado');
        (comps || []).forEach(function (c) {
          var p = props.find(function (x) { return x.id === c.proposta_id; });
          if (!p) return;
          var dia = chaveData(c.data_pagamento);
          if (dia && dia >= ini && dia <= fim) {
            add(dia, {
              tipo: 'aprovado',
              id: p.id,
              titulo: 'Depósito ok · ' + (p.cliente_nome || ('#' + p.numero)),
              sub: p.tipo_evento || '',
              prop: p
            });
          }
        });
      } catch (e) {}
    }

    // 3. Bloqueios / indisponibilidades (agenda_reservas)
    try {
      var { data: res } = await SB.from('agenda_reservas')
        .select('id, tipo, proposta_id, data_inicio, data_fim, observacao, recurso:parceiros!recurso_id(nome_completo, nome_artistico)')
        .lte('data_inicio', fim).gte('data_fim', ini);
      (res || []).forEach(function (r) {
        if (r.tipo !== 'indisponibilidade' && r.tipo !== 'bloqueio') return;
        var a = new Date(r.data_inicio + 'T00:00:00');
        var b = new Date(r.data_fim + 'T00:00:00');
        for (var d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
          var k = chave(d);
          if (k < ini || k > fim) continue;
          add(k, {
            tipo: 'bloqueio',
            id: r.id,
            titulo: nomeParceiro(r.recurso) || 'Recurso',
            sub: r.observacao || 'Indisponível',
            reserva: r
          });
        }
      });
    } catch (e) {}

    // 4. Leads (se a tabela existir)
    try {
      var { data: leads } = await SB.from('co_leads')
        .select('id, nome, data_evento')
        .gte('data_evento', ini).lte('data_evento', fim);
      (leads || []).forEach(function (l) {
        add(chaveData(l.data_evento), {
          tipo: 'lead',
          id: l.id,
          titulo: l.nome || 'Lead',
          sub: 'Pediu esta data'
        });
      });
    } catch (e) {
      // tabela pode não existir ou ter outro nome — ignora
    }

    // 5. Checklist dos eventos do mês (uma query só)
    if (idsProp.length) {
      try {
        var { data: etapas } = await SB.from('evento_etapas')
          .select('proposta_id, situacao')
          .in('proposta_id', idsProp);
        (etapas || []).forEach(function (e) {
          if (!CHECKLIST[e.proposta_id]) CHECKLIST[e.proposta_id] = { total: 0, pend: 0, ok: 0 };
          CHECKLIST[e.proposta_id].total++;
          if (e.situacao === 'pendente') CHECKLIST[e.proposta_id].pend++;
          else CHECKLIST[e.proposta_id].ok++;
        });
      } catch (e) {}
    }

    desenhar();
    renderProximos();
  }

  /* ---------- Desenho ---------- */
  var PROXIMOS = []; /* lista global de próximos eventos (tipo evento) */

  function renderProximos() {
    var box = $('proxScroll');
    if (!box) return;
    var hoje = chave(new Date());
    var lista = (PROXIMOS || []).filter(function (it) {
      return it.data >= hoje && visivel(it.tipo);
    }).sort(function (a, b) {
      return String(a.data).localeCompare(String(b.data));
    });

    var wrapP = document.getElementById('proxWrap');
    if (wrapP) wrapP.style.display = lista.length ? '' : 'none';
    if (!lista.length) {
      box.innerHTML = '';
      return;
    }

    box.innerHTML = lista.map(function (it, idx) {
      var partes = it.data.split('-');
      var rotulo = partes[2] + '/' + partes[1] + (idx === 0 ? ' · próximo' : '');
      return '<button type="button" class="prox-chip" data-k="' + E(it.data) + '">' +
        '<span class="px-data">' + E(rotulo) + '</span>' +
        '<span class="px-tit">' + E(it.titulo) + '</span>' +
        (it.sub ? '<span class="px-sub">' + E(it.sub) + '</span>' : '') +
        '</button>';
    }).join('');

    box.querySelectorAll('[data-k]').forEach(function (el) {
      el.addEventListener('click', function () {
        irParaData(el.getAttribute('data-k'));
      });
    });
  }

  async function irParaData(k) {
    if (!k) return;
    var partes = k.split('-');
    var y = Number(partes[0]), m = Number(partes[1]) - 1;
    DIA_SEL = k;
    if (y !== ANO || m !== MES) {
      ANO = y; MES = m;
      await carregarMes();
    } else {
      desenhar();
      abrirDia(k, false);
    }
  }

  function desenhar() {
    $('tituloMes').textContent = MESES[MES] + ' ' + ANO;
    atualizarBtnDia();

    $('cabec').innerHTML = DIAS.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');

    var grade = $('grade');
    var primeiro = new Date(ANO, MES, 1);
    var offset = (primeiro.getDay() + 6) % 7; // segunda = 0
    var inicio = new Date(primeiro); inicio.setDate(1 - offset);
    var hoje = chave(new Date());
    var html = '';

    for (var i = 0; i < 42; i++) {
      var d = new Date(inicio); d.setDate(inicio.getDate() + i);
      var k = chave(d);
      var todos = ITENS[k] || [];
      var itens = todos.filter(function (it) { return visivel(it.tipo); });
      var cls = ['dia'];
      if (d.getMonth() !== MES) cls.push('outro');
      if (k === hoje) cls.push('hoje');
      if (k === DIA_SEL) cls.push('sel');

      var chips = itens.slice(0, 3).map(function (it) {
        var t = TIPOS.find(function (x) { return x.id === it.tipo; });
        var c = t ? t.cls : 'e-evento';
        return '<div class="ev ' + c + '">' + E(it.titulo) + '</div>';
      }).join('');
      var mais = itens.length > 3 ? '<div class="mais">+' + (itens.length - 3) + '</div>' : '';
      /* Bolinhas de cor (mobile); tipos únicos até 4 */
      var tiposVistos = [];
      itens.forEach(function (it) {
        if (tiposVistos.indexOf(it.tipo) < 0) tiposVistos.push(it.tipo);
      });
      var marks = tiposVistos.slice(0, 4).map(function (tp) {
        return '<i class="m-' + tp + '"></i>';
      }).join('');

      html += '<div class="' + cls.join(' ') + '" data-k="' + k + '">' +
        '<span class="num">' + d.getDate() + '</span>' + chips + mais +
        (marks ? '<div class="marks">' + marks + '</div>' : '') + '</div>';
    }
    grade.innerHTML = html;
    grade.querySelectorAll('[data-k]').forEach(function (el) {
      el.addEventListener('click', function () { abrirDia(el.getAttribute('data-k')); });
    });
    if (DIA_SEL) abrirDia(DIA_SEL, true);
  }

  var MESES_ABREV = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

  function rotuloDiaBtn(k) {
    var hoje = chave(new Date());
    var p = String(k || hoje).split('-');
    if (p.length < 3) return 'Hoje';
    var y = Number(p[0]), m = Number(p[1]) - 1, d = Number(p[2]);
    var abrev = MESES_ABREV[m] || '';
    if (!k || k === hoje) return 'Hoje/' + abrev;
    if (y !== new Date().getFullYear()) return d + '/' + abrev + '/' + y;
    return d + '/' + abrev;
  }

  function atualizarBtnDia() {
    var btn = $('btnHoje');
    if (!btn) return;
    btn.textContent = rotuloDiaBtn(DIA_SEL);
    btn.title = (DIA_SEL && DIA_SEL !== chave(new Date()))
      ? 'Voltar para hoje'
      : 'Ir para hoje';
  }

  function abrirDia(k, silencioso) {
    DIA_SEL = k;
    var partes = k.split('-');
    $('tituloDia').textContent = partes[2] + '/' + partes[1] + '/' + partes[0];
    atualizarBtnDia();

    /* Destaca o dia selecionado na grade */
    document.querySelectorAll('#grade .dia').forEach(function (el) {
      if (el.getAttribute('data-k') === k) el.classList.add('sel');
      else el.classList.remove('sel');
    });

    /* No clique do usuário, rola suavemente até o painel do dia */
    if (!silencioso) {
      var painel = document.getElementById('painelDia');
      if (painel) {
        try {
          painel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) {
          painel.scrollIntoView(true);
        }
      }
    }

    var todos = ITENS[k] || [];
    var itens = todos.filter(function (it) { return visivel(it.tipo); });

    if (!itens.length) {
      $('listaDia').className = 'vazio';
      $('listaDia').textContent = todos.length
        ? 'Nada neste dia com os filtros atuais.'
        : 'Nada neste dia.';
    } else {
      $('listaDia').className = '';
      $('listaDia').innerHTML = itens.map(function (it) {
        var t = TIPOS.find(function (x) { return x.id === it.tipo; });
        var cor = t ? t.cor : '#64748b';
        var p = it.prop;
        var tags = '';
        var acoes = '';

        if (p && it.tipo === 'evento') {
          var ck = CHECKLIST[p.id] || { total: 0, pend: 0, ok: 0 };
          if (ck.total === 0) {
            tags += '<span class="tag pend">Sem checklist</span>';
          } else if (ck.pend === 0) {
            tags += '<span class="tag ok">Checklist ✓</span>';
          } else {
            tags += '<span class="tag pend">' + ck.pend + ' etapa' + (ck.pend > 1 ? 's' : '') + ' pend.</span>';
          }
          if (p.comissao_paga) tags += '<span class="tag ok">Comissão paga</span>';
          else if (p.comissao_status) tags += '<span class="tag">' + E(p.comissao_status) + '</span>';
          if (p.status) tags += '<span class="tag">' + E(p.status) + '</span>';

          if (IS_ADMIN) {
            acoes =
              '<div class="acoes">' +
                '<a class="pri" href="projeto.html?id=' + encodeURIComponent(p.id) + '">Abrir ficha</a>' +
                '<a href="../checklist.html?proposta=' + encodeURIComponent(p.id) + '">Checklist</a>' +
              '</div>';
          } else {
            /* Parceiro: checklist + dados operacionais do evento (sem valores sensíveis) */
            acoes =
              '<div class="acoes">' +
                '<a class="pri" href="projeto.html?id=' + encodeURIComponent(p.id) + '">Dados do evento</a>' +
                '<a href="../checklist.html?proposta=' + encodeURIComponent(p.id) + '">Checklist</a>' +
              '</div>';
          }
        } else if (p && (it.tipo === 'hold' || it.tipo === 'contrato' || it.tipo === 'comissao' || it.tipo === 'recebimento' || it.tipo === 'aprovado')) {
          if (IS_ADMIN) {
            acoes =
              '<div class="acoes">' +
                '<a class="pri" href="projeto.html?id=' + encodeURIComponent(p.id) + '">Abrir ficha</a>' +
              '</div>';
          } else {
            acoes =
              '<div class="acoes">' +
                '<a class="pri" href="projeto.html?id=' + encodeURIComponent(p.id) + '">Dados do evento</a>' +
              '</div>';
          }
        }

        return '<div class="item" style="border-left-color:' + cor + '" data-tipo="' + E(it.tipo) + '" data-id="' + E(it.id) + '">' +
          '<strong>' + E(it.titulo) + '</strong>' +
          (it.sub ? '<small>' + E(it.sub) + '</small>' : '') +
          (tags ? '<div class="tags">' + tags + '</div>' : '') +
          acoes +
          '</div>';
      }).join('');
    }

    if (!silencioso) {
      document.querySelectorAll('#grade .dia').forEach(function (el) {
        el.classList.toggle('sel', el.getAttribute('data-k') === k);
      });
    }
  }

  /* ---------- Navegação ---------- */
  function mesAnterior() {
    MES--; if (MES < 0) { MES = 11; ANO--; }
    carregarMes();
  }
  function mesProximo() {
    MES++; if (MES > 11) { MES = 0; ANO++; }
    carregarMes();
  }
  $('btnPrev').addEventListener('click', mesAnterior);
  $('btnNext').addEventListener('click', mesProximo);

  /* Rolagem/swipe lateral no calendário → troca o mês */
  (function bindSwipeCal() {
    var el = document.getElementById('calSwipe');
    if (!el) return;
    var x0 = 0, y0 = 0, tracking = false, axis = null;
    el.addEventListener('touchstart', function (ev) {
      if (!ev.touches || !ev.touches[0]) return;
      x0 = ev.touches[0].clientX;
      y0 = ev.touches[0].clientY;
      tracking = true;
      axis = null;
    }, { passive: true });
    el.addEventListener('touchmove', function (ev) {
      if (!tracking || !ev.touches || !ev.touches[0]) return;
      var dx = ev.touches[0].clientX - x0;
      var dy = ev.touches[0].clientY - y0;
      if (axis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
    }, { passive: true });
    el.addEventListener('touchend', function (ev) {
      if (!tracking) return;
      tracking = false;
      if (axis !== 'x') return;
      var t = (ev.changedTouches && ev.changedTouches[0]) || null;
      if (!t) return;
      var dx = t.clientX - x0;
      if (Math.abs(dx) < 50) return;
      if (dx < 0) mesProximo();
      else mesAnterior();
    }, { passive: true });
  })();
  function irParaHoje() {
    var h = new Date();
    ANO = h.getFullYear(); MES = h.getMonth();
    DIA_SEL = chave(h);
    carregarMes();
  }
  $('btnHoje').addEventListener('click', irParaHoje);
  /* Toque no nome do mês → volta para o mês/dia de hoje (padrão iPhone) */
  $('tituloMes').addEventListener('click', irParaHoje);

  /* ---------- Init ---------- */
  async function carregarEscopoParceiro() {
    ME_PROP_IDS = null;
    if (IS_ADMIN) return;
    if (!ME || !ME.id) { ME_PROP_IDS = new Set(); return; }

    var ids = new Set();
    var cols = await SB.from('projeto_colaboradores').select('proposta_id').eq('parceiro_id', ME.id);
    (cols.data || []).forEach(function (c) { if (c.proposta_id) ids.add(c.proposta_id); });

    var minhas = await SB.from('propostas').select('id').eq('parceiro_id', ME.id).is('cancelada_em', null);
    (minhas.data || []).forEach(function (p) { if (p.id) ids.add(p.id); });

    ME_PROP_IDS = ids;
  }

  (async function init() {
    var s = await SB.auth.getSession();
    if (!(s.data && s.data.session)) { location.href = '../login.html'; return; }

    var r = await SB.from('parceiros')
      .select('id, nome_completo, nome_artistico, role, nivel, status')
      .eq('user_id', s.data.session.user.id)
      .maybeSingle();

    if (!r.data) {
      document.querySelector('main').innerHTML = '<div class="box-full"><div class="vazio">Parceiro não encontrado. Faça login no painel B2B.</div></div>';
      return;
    }

    ME = r.data;
    var papel = String(ME.role || ME.nivel || '').toLowerCase().trim();
    IS_ADMIN = /^(admin|master)$/i.test(papel);

    /* Atualiza eyebrow: Admin ou Parceiro */
    var eye = document.querySelector('.eyebrow');
    if (eye) eye.textContent = IS_ADMIN ? 'Admin' : 'Parceiro';

    await carregarEscopoParceiro();

    var hoje = new Date();
    ANO = hoje.getFullYear();
    MES = hoje.getMonth();
    DIA_SEL = chave(hoje);
    montarFiltros();
    await carregarMes();
    setInterval(function () { if (document.visibilityState === 'visible') desenhar(); }, 30000);
  })();
})();
