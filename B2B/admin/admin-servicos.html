<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>432UP Partner | Serviços</title>

  <link class="js-site-favicon" rel="icon" type="image/png" href="https://www.432up.com/imagens/favicon.png">

  
  <link rel="stylesheet" href="https://www.432up.com/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<body class="h-full text-slate-200 font-sans antialiased bg-[#06080c] overflow-x-hidden">

  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <!-- HOOKS ONDE O JS INJETA O HEADER -->
  <header id="calc-header"></header>
  <div id="mobile-menu"></div>

  <!-- CONTEÚDO DA PÁGINA -->
  <div class="flex flex-col min-h-screen relative z-10 pb-16">
    <main class="flex-1 p-4 lg:p-8 space-y-6 pt-20 lg:pt-24 w-full max-w-7xl mx-auto">

      <span class="admin-busy-spin" id="admin-busy" hidden></span>
      <span id="db-dot" hidden></span>
      <span id="db-status-text" hidden></span>
      <span id="last-save-text" hidden></span>
    <div class="module-page active" id="module-calc1-servicos">
      <div class="admin-content-area">
        <div class="mod-header">
          <div>
            <h2>Serviços</h2>
            <p>Cada serviço aparece na home (visual) e na calculadora (preços e regras).</p>
          </div>
          <div class="mod-actions">
            <div class="drag-toggle-wrap">
              <span>Modo Drag</span>
              <label class="switch">
                <input type="checkbox" id="srv-drag-toggle" onchange="toggleSrvDnd(this.checked)" autocomplete="off">
                <span class="slider"></span>
              </label>
            </div>
            <span id="srv-sync-text" style="font-size:0.78rem;color:var(--text-muted);">Arrastar bloqueado</span>
            <button class="btn btn-primary" onclick="openServicoModal()">+ Novo Serviço</button>
            <button class="btn" onclick="loadCalc1Data()">🔄 Recarregar</button>
          </div>
        </div>
        <div class="cards-grid" id="servicos-grid"></div>
      </div>
    </div>


    </main>
  </div>

  <!-- MODAL SERVIÇO -->
  <div class="modal-overlay" id="modal-servico">
    <div class="modal-box wide">
      <div class="modal-header">
        <h3 id="modal-servico-title">Novo Serviço</h3>
        <button class="modal-close" onclick="closeServicoModal()">&times;</button>
      </div>
      <div class="srv-modal-body">
      <input type="hidden" id="srv-edit-id">
      <input type="hidden" id="srv-servico-id">
      <input type="hidden" id="srv-nome-interno">
      <input type="hidden" id="srv-unidade-metragem" value="m">

      <div class="form-section-title" style="border:0;margin-top:0">Identidade</div>
      <div class="form-row srv-row-id">
        <div class="form-group">
          <label>Ícone</label>
          <input id="srv-icone" placeholder="🎵">
        </div>
        <div class="form-group">
          <label>Nome de exibição</label>
          <input id="srv-nome-exibicao" placeholder="Nome visível na proposta">
        </div>
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <textarea id="srv-descricao" rows="3" placeholder="O que o cliente vê no card"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:0 0 120px;">
          <label>Ordem</label>
          <input type="number" id="srv-ordem" value="0">
        </div>
        <div class="form-toggles" style="padding-top:22px">
          <div class="toggle-line">
            <label class="switch"><input type="checkbox" id="srv-ativo" checked><span class="slider"></span></label>
            <span>Ativo</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Como cobra</div>
        <div class="form-row srv-row-3">
          <div class="form-group">
            <label>Preço fechado (R$)</label>
            <input type="number" step="0.01" id="srv-valor-base" value="0">
          </div>
          <div class="form-group">
            <label>Valor hora (R$)</label>
            <input type="number" step="0.01" id="srv-valor-hora" value="0">
          </div>
          <div class="form-group">
            <label>Por pessoa (R$)</label>
            <input type="number" step="0.01" id="srv-valor-pessoa" value="0">
          </div>
        </div>
        <div class="form-toggles" style="padding-top:0;flex-direction:row;flex-wrap:wrap;gap:16px">
          <div class="toggle-line">
            <label class="switch"><input type="checkbox" id="srv-calc-hora"><span class="slider"></span></label>
            <span>Por hora (cálculo do evento)</span>
          </div>
          <div class="toggle-line">
            <label class="switch"><input type="checkbox" id="srv-calc-pessoa"><span class="slider"></span></label>
            <span>Por pessoa</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Metro (seletor − / + da proposta)</div>
        <label class="form-group" style="margin-bottom:8px">Unidade</label>
        <div class="unit-metro-picks" id="srv-unidade-metragem-wrap">
          <button type="button" class="unit-metro-btn active" data-unid-metro="m">m</button>
          <button type="button" class="unit-metro-btn" data-unid-metro="m2">m²</button>
          <button type="button" class="unit-metro-btn" data-unid-metro="m3">m³</button>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Mínimo</label><input type="number" step="0.1" id="srv-metragem-min" placeholder="vazio = sem metro"></div>
          <div class="form-group"><label>Máximo</label><input type="number" step="0.1" id="srv-metragem-max"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Valor por unidade (R$)</label><input type="number" step="0.01" id="srv-valor-metro" value="0"></div>
          <div class="form-group"><label>De quanto em quanto sobe</label><input type="number" step="0.1" id="srv-passo-metro" value="1"></div>
        </div>
        <div class="form-section-title" style="margin-top:8px">Faixas por metro</div>
        <div id="srv-faixas-metro"></div>
        <button type="button" class="btn btn-sm" style="margin-top:8px" onclick="addFaixaUI('metro')">+ Faixa</button>
      </div>

      <div class="form-section">
        <div class="form-section-title">Hora do card (− / + na proposta)</div>
        <div class="form-row srv-row-3">
          <div class="form-group"><label>Mín. (h)</label><input type="number" step="0.1" id="srv-horas-min" placeholder="vazio = sem seletor"></div>
          <div class="form-group"><label>Máx. (h)</label><input type="number" step="0.1" id="srv-horas-max"></div>
          <div class="form-group"><label>Passo (h)</label><input type="number" step="0.1" id="srv-passo-hora" value="1"></div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Faixas por pessoa</div>
        <div id="srv-faixas-pessoa"></div>
        <button type="button" class="btn btn-sm" style="margin-top:8px" onclick="addFaixaUI('pessoa')">+ Faixa</button>
      </div>
      </div>
      <div class="srv-modal-foot">
        <button class="btn" onclick="closeServicoModal()">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-servico" onclick="saveServico()">Salvar</button>
      </div>
    </div>
  </div>

  <div id="toastBox"></div>
  <div class="confirm-overlay" id="confirmDlg">
    <div class="confirm-box">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="btn btn-danger" onclick="confirmClose(true)">Sim, excluir</button>
        <button class="btn" onclick="confirmClose(false)">Cancelar</button>
      </div>
    </div>
  </div>

  <script>

  const SUPABASE_URL_ADM = 'https://paetkspbfejtjjkngqej.supabase.co';
  const SUPABASE_KEY_ADM = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXRrc3BiZmVqdGpqa25ncWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MDU2OTgsImV4cCI6MjA4NjQ4MTY5OH0.IiYweZ2g3bP7b0o7VvBW5LLb6d1oHtSNFUZlVkIsdsA';
  const _supabaseAdmin = supabase.createClient(SUPABASE_URL_ADM, SUPABASE_KEY_ADM);
  const _supabase = _supabaseAdmin;
  window._supabase = _supabaseAdmin;
  const SB = SUPABASE_URL_ADM;
  const SK = SUPABASE_KEY_ADM;

  var DATA = { servicos: [], pacotes: [], leads: [], configTransporte: null };
  var selectedLeads = {};
  var _confirmCb = null;
  function qs(s) { return document.querySelector(s); }
  function qsa(s) { return document.querySelectorAll(s); }
  function $(s) { return document.querySelector(s); }
  function $$(s) { return document.querySelectorAll(s); }
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function el(id) { return document.getElementById(id); }

  function clearToasts() {
    var c = document.getElementById('toastBox');
    if (c) c.innerHTML = '';
  }
  function toast(msg, type) {
    var c = document.getElementById('toastBox');
    if (!c) return;
    clearToasts();
    var t = document.createElement('div');
    t.className = 'toast ' + (type === 'err' || type === 'error' ? 'err' : 'ok');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 3800);
  }
  window.showToast = toast;
  function setAdminBusy(on) {
    var sp = document.getElementById('admin-busy');
    if (sp) {
      if (on) sp.removeAttribute('hidden');
      else sp.setAttribute('hidden', '');
    }
  }

  function markSaved() {
    var el = $('#last-save-text');
    if (el) el.textContent = 'Salvo ' + new Date().toLocaleTimeString('pt-BR');
  }
  function setDbStatus(ok) {
    var dot = $('#db-dot');
    var txt = $('#db-status-text');
    if (dot) dot.classList.toggle('err', !ok);
    if (txt) if (txt) txt.textContent = '';
  }
  function confirmShow(msg, cb) {
    $('#confirmMsg').textContent = msg;
    _confirmCb = cb;
    $('#confirmDlg').classList.add('open');
  }
  function confirmClose(yes) {
    $('#confirmDlg').classList.remove('open');
    if (_confirmCb) _confirmCb(yes);
    _confirmCb = null;
  }

  function sbH(m) {
    var h = { 'apikey': SK, 'Authorization': 'Bearer ' + SK, 'Content-Type': 'application/json' };
    if (m === 'PATCH' || m === 'POST') h['Prefer'] = 'return=representation';
    return h;
  }
  async function sbGet(table, qs) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?' + qs, { headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
      if (!r.ok) throw r;
      return await r.json();
    } catch (e) { console.error('sbGet', table, e); return null; }
  }
  async function sbPatch(table, id, body) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?id=eq.' + id, { method: 'PATCH', headers: sbH('PATCH'), body: JSON.stringify(body) });
      if (!r.ok) { console.error('sbPatch', await r.text()); return false; }
      return true;
    } catch (e) { return false; }
  }
  async function sbPost(table, body) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table, { method: 'POST', headers: sbH('POST'), body: JSON.stringify(body) });
      if (!r.ok) { console.error('sbPost', await r.text()); return null; }
      return await r.json();
    } catch (e) { return null; }
  }
  async function sbDel(table, id) {
    try {
      var r = await fetch(SB + '/rest/v1/' + table + '?id=eq.' + id, { method: 'DELETE', headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
      return r.ok;
    } catch (e) { return false; }
  }

  // ============================================================
  // CALC1 DATA  (Serviços / Pacotes / Leads / Transporte — mantidos)
  // ============================================================

  // SERVIÇOS
  function renderServicosCards() {
    var grid = $('#servicos-grid');
    if (!grid) return;
    if (!DATA.servicos.length) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">🛠</div>Nenhum serviço.<br><button class="btn btn-primary" style="margin-top:12px" onclick="openServicoModal()">+ Criar</button></div>';
      return;
    }
    var h = '';
    DATA.servicos.forEach(function (s) {
      var inactive = s.ativo === false;
      h += '<div class="item-card' + (inactive ? ' inactive' : '') + '" data-srv-id="' + s.id + '"><div class="item-card-header"><div><div class="item-card-title"><span>' + esc(s.icone || '🎵') + '</span> ' + esc(s.nome_exibicao || s.nome || '—') + '</div><div class="item-card-meta">' + (s.calc_por_hora ? 'Por hora · ' : '') + (s.calc_por_pessoa ? 'Por pessoa · ' : '') + 'Ordem ' + (s.ordem || 0) + '</div></div><div class="item-card-actions"><button class="btn btn-sm" onclick="openServicoModal(' + s.id + ')">Editar</button><button class="btn btn-sm btn-danger" onclick="removeServico(' + s.id + ')">Excluir</button></div></div><div class="item-card-body">' + esc((s.descricao || '').substring(0, 120)) + '</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px;"><span class="price-tag">R$ ' + Number(s.valor_base || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) + '</span><span class="badge ' + (inactive ? '' : 'badge-on') + '">' + (inactive ? 'Inativo' : 'Ativo') + '</span></div></div>';
    });
    grid.innerHTML = h;
    bindServicosSortable();
  }

  var SRV_DND_ENABLED = false;
  var SRV_SORTABLE = null;
  function toggleSrvDnd(on) {
    SRV_DND_ENABLED = !!on;
    var txt = document.getElementById('srv-sync-text');
    if (txt) txt.textContent = SRV_DND_ENABLED ? 'Arrastar liberado' : 'Arrastar bloqueado';
    bindServicosSortable();
  }
  function bindServicosSortable() {
    var grid = document.getElementById('servicos-grid');
    if (SRV_SORTABLE) {
      try { SRV_SORTABLE.destroy(); } catch (e) {}
      SRV_SORTABLE = null;
    }
    if (!grid || !SRV_DND_ENABLED || !window.Sortable) return;
    SRV_SORTABLE = Sortable.create(grid, {
      animation: 180,
      draggable: '.item-card',
      ghostClass: 'sortable-ghost',
      onEnd: async function () {
        var cards = Array.from(grid.querySelectorAll('.item-card[data-srv-id]'));
        setAdminBusy(true);
        var ok = true;
        for (var i = 0; i < cards.length; i++) {
          var patched = await sbPatch('co_calculadora_valores', cards[i].getAttribute('data-srv-id'), { ordem: i + 1 });
          if (!patched) ok = false;
        }
        setAdminBusy(false);
        if (ok) {
          clearToasts();
          toast('Ordem salva', 'ok');
          markSaved();
          await loadCalc1Data();
        } else {
          toast('Não foi possível conectar. Tente mais tarde.', 'err');
          await loadCalc1Data();
        }
      }
    });
  }

  function openServicoModal(id) {
    try {
      var s = id ? DATA.servicos.find(function (x) { return String(x.id) === String(id); }) : null;
      el('modal-servico-title').textContent = s ? 'Editar Serviço' : 'Novo Serviço';
      el('srv-edit-id').value = s ? s.id : '';
      el('srv-icone').value = s ? (s.icone || '') : '🎵';
      el('srv-nome-exibicao').value = s ? (s.nome_exibicao || '') : '';
      el('srv-descricao').value = s ? (s.descricao || '') : '';
      el('srv-valor-base').value = s ? (s.valor_base || 0) : 0;
      el('srv-valor-hora').value = s ? (s.valor_por_hora || 0) : 0;
      el('srv-valor-pessoa').value = s ? (s.valor_por_pessoa || 0) : 0;
      el('srv-ordem').value = s ? (s.ordem || 0) : (DATA.servicos.length + 1);
      el('srv-ativo').checked = s ? (s.ativo !== false) : true;
      el('srv-calc-hora').checked = s ? !!s.calc_por_hora : false;
      el('srv-calc-pessoa').checked = s ? !!s.calc_por_pessoa : false;
      el('srv-metragem-min').value = s && s.metragem_minima != null ? s.metragem_minima : '';
      el('srv-metragem-max').value = s && s.metragem_maxima != null ? s.metragem_maxima : '';
      el('srv-valor-metro').value = s ? (s.valor_por_metro || 0) : 0;
      el('srv-passo-metro').value = s ? (s.passo_metro || 1) : 1;
      el('srv-horas-min').value = s && s.horas_minimas != null ? s.horas_minimas : '';
      el('srv-horas-max').value = s && s.horas_maximas != null ? s.horas_maximas : '';
      el('srv-passo-hora').value = s ? (s.passo_hora || 1) : 1;
      el('srv-servico-id').value = s ? (s.servico_id || '') : '';
      el('srv-nome-interno').value = s ? (s.nome || '') : '';
      setUnidadeMetragemUI(s && (s.unidade_metragem || s.unidade_metro || s.unidade));
      var faixas = [], faixasM = [];
      if (s && s.faixas) { try { faixas = typeof s.faixas === 'string' ? JSON.parse(s.faixas) : s.faixas; } catch (e) {} }
      if (s && s.faixas_metro) { try { faixasM = typeof s.faixas_metro === 'string' ? JSON.parse(s.faixas_metro) : s.faixas_metro; } catch (e) {} }
      renderFaixasUI('pessoa', faixas || []);
      renderFaixasUI('metro', faixasM || []);
      var adv = el('srv-adv'); if (adv) adv.classList.remove('open');
      var modal = el('modal-servico');
      if (modal) {
        modal.classList.add('open');
        modal.style.display = 'flex';
      } else {
        console.error('modal-servico não encontrado no DOM');
        toast('Erro: modal de serviço não encontrado', 'err');
      }
    } catch (err) {
      console.error('openServicoModal', err);
      toast('Erro ao abrir editor: ' + err.message, 'err');
    }
  }
  function closeServicoModal() {
    var modal = el('modal-servico');
    if (modal) { modal.classList.remove('open'); modal.style.display = 'none'; }
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
  }
  function renderFaixasUI(tipo, arr) {
    var box = el('srv-faixas-' + tipo);
    if (!box) return;
    var h = '';
    (arr || []).forEach(function (fx) {
      var min = fx.min != null ? fx.min : (fx.ate || 0);
      var max = fx.max != null ? fx.max : '';
      var valor = fx.valor_metro != null ? fx.valor_metro : (fx.adicional != null ? fx.adicional : (fx.valor || 0));
      h += '<div class="faixa-row"><label>De</label><input type="number" class="f-min" value="' + min + '"><label>até</label><input type="number" class="f-max" value="' + max + '" placeholder="∞"><label>R$</label><input type="number" step="0.01" class="f-val" value="' + valor + '"><button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button></div>';
    });
    box.innerHTML = h;
  }
  function addFaixaUI(tipo) {
    var box = el('srv-faixas-' + tipo);
    if (!box) return;
    var div = document.createElement('div');
    div.className = 'faixa-row';
    div.innerHTML = '<label>De</label><input type="number" class="f-min" value="0"><label>até</label><input type="number" class="f-max" value="" placeholder="∞"><label>R$</label><input type="number" step="0.01" class="f-val" value="0"><button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>';
    box.appendChild(div);
  }
  function collectFaixas(tipo) {
    var box = el('srv-faixas-' + tipo);
    var arr = [];
    if (!box) return arr;
    box.querySelectorAll('.faixa-row').forEach(function (row) {
      var min = parseFloat(row.querySelector('.f-min').value) || 0;
      var maxRaw = row.querySelector('.f-max').value;
      var max = maxRaw.trim() === '' ? null : parseFloat(maxRaw);
      var valor = parseFloat(row.querySelector('.f-val').value) || 0;
      if (tipo === 'pessoa') arr.push({ min: min, max: max, adicional: valor });
      else arr.push({ min: min, max: max, valor_metro: valor });
    });
    return arr;
  }
  function toggleAdvanced(id) { document.getElementById(id).classList.toggle('open'); }

  function normalizarUnidadeMetragemAdmin(raw) {
    var u = String(raw || '').toLowerCase().trim();
    if (u === 'm3' || u === 'm³' || u.indexOf('cubic') >= 0 || u.indexOf('cub') >= 0) return 'm3';
    if (u === 'm2' || u === 'm²' || u.indexOf('quad') >= 0) return 'm2';
    return 'm';
  }
  function setUnidadeMetragemUI(raw) {
    var u = normalizarUnidadeMetragemAdmin(raw);
    var hid = el('srv-unidade-metragem');
    if (hid) hid.value = u;
    document.querySelectorAll('#srv-unidade-metragem-wrap [data-unid-metro]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-unid-metro') === u);
    });
  }
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-unid-metro]') : null;
    if (!btn) return;
    setUnidadeMetragemUI(btn.getAttribute('data-unid-metro'));
  });

  async function saveServico() {
    try {
      var id = el('srv-edit-id').value;
      var isNew = !id;
      var nomeEx = (el('srv-nome-exibicao').value || '').trim();
      if (!nomeEx) { toast('Informe o nome de exibição', 'err'); return; }
      var hMinRaw = el('srv-horas-min').value.trim();
      var hMaxRaw = el('srv-horas-max').value.trim();
      var hMinVal = hMinRaw === '' ? null : parseFloat(hMinRaw);
      var hMaxVal = hMaxRaw === '' ? null : parseFloat(hMaxRaw);
      if (hMinVal != null && hMaxVal != null && hMaxVal < hMinVal) {
        toast('Horas máx. não pode ser menor que horas mín.', 'err');
        return;
      }
      var body = {
        icone: el('srv-icone').value || '🎵',
        nome_exibicao: nomeEx,
        descricao: el('srv-descricao').value || '',
        valor_base: parseFloat(el('srv-valor-base').value) || 0,
        valor_por_hora: parseFloat(el('srv-valor-hora').value) || 0,
        valor_por_pessoa: parseFloat(el('srv-valor-pessoa').value) || 0,
        ordem: parseInt(el('srv-ordem').value) || 0,
        ativo: el('srv-ativo').checked,
        calc_por_hora: el('srv-calc-hora').checked,
        calc_por_pessoa: el('srv-calc-pessoa').checked,
        metragem_minima: el('srv-metragem-min').value.trim() === '' ? null : parseFloat(el('srv-metragem-min').value),
        metragem_maxima: el('srv-metragem-max').value.trim() === '' ? null : parseFloat(el('srv-metragem-max').value),
        valor_por_metro: parseFloat(el('srv-valor-metro').value) || 0,
        passo_metro: parseFloat(el('srv-passo-metro').value) || 1,
        horas_minimas: hMinVal,
        horas_maximas: hMaxVal,
        passo_hora: parseFloat(el('srv-passo-hora').value) || 1,
        unidade_metragem: (el('srv-unidade-metragem') && el('srv-unidade-metragem').value) || 'm',
        faixas: JSON.stringify(collectFaixas('pessoa')),
        faixas_metro: JSON.stringify(collectFaixas('metro')),
        servico_id: (el('srv-servico-id').value || '').trim() || ('srv_' + Date.now()),
        nome: (el('srv-nome-interno').value || '').trim() || nomeEx || 'servico'
      };
      var btn = el('btn-save-servico');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
      setAdminBusy(true);
      var ok = false;
      if (isNew) {
        var res = await sbPost('co_calculadora_valores', body);
        ok = !!(res && (res[0] || res.id || Array.isArray(res)));
      } else {
        ok = await sbPatch('co_calculadora_valores', id, body);
      }
      if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
      setAdminBusy(false);
      if (ok) {
        clearToasts();
        toast('Serviço salvo', 'ok');
        markSaved();
        closeServicoModal();
        await loadCalc1Data();
      } else {
        toast('Não foi possível conectar. Tente mais tarde.', 'err');
      }
    } catch (err) {
      console.error('saveServico', err);
      setAdminBusy(false);
      toast('Não foi possível conectar. Tente mais tarde.', 'err');
      var b = el('btn-save-servico'); if (b) { b.disabled = false; b.textContent = 'Salvar'; }
    }
  }
  function removeServico(id) {
    confirmShow('Excluir este serviço?', async function (yes) {
      if (!yes) return;
      if (await sbDel('co_calculadora_valores', id)) { toast('Excluído', 'ok'); await loadCalc1Data(); }
      else toast('Erro', 'err');
    });
  }

  // PACOTES

  async function loadPageData() {
    var data = await sbGet('co_calculadora_valores', 'select=*&order=ordem');
    var ok = data !== null;
    setDbStatus(ok);
    DATA.servicos = data || [];
    renderServicosCards();
    if (ok) toast('Serviços carregados', 'ok');
    else toast('Erro ao carregar', 'err');
  }
  window.__adminPageInit = function () { loadPageData(); };
  window.toggleSrvDnd = toggleSrvDnd;
  window.openServicoModal = openServicoModal;
  window.closeServicoModal = closeServicoModal;
  window.saveServico = saveServico;
  window.removeServico = removeServico;
  window.addFaixaUI = addFaixaUI;
  window.toggleAdvanced = toggleAdvanced;
  window.loadCalc1Data = loadPageData;
  window.confirmClose = confirmClose;


    partnerRequireAuth().then(function (parceiro) {
      partnerFillSidebar(parceiro);
      
      // Atualiza a flag de admin e valida o cache sem piscar o menu
      var roleNorm = String(parceiro.role || parceiro.nivel || '').toLowerCase().trim();
      var isAdmin = roleNorm === 'admin' || roleNorm === 'master';
      window.updateAdminState(isAdmin);

      if (typeof window.__adminPageInit === 'function') {
        window.__adminPageInit(parceiro, isAdmin);
      }
    }).catch(function (err) {
      console.error('Erro na autenticação:', err);
    });
  </script>
</body>
</html>
