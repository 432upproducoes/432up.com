<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist · 432UP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="partner-config.js"></script>
<script src="js/checklist-evento.js"></script>
<style>
  :root { --bg:#0b1020; --card:#131a2e; --line:rgba(255,255,255,.08); --txt:#e2e8f0; --mut:#94a3b8; --acc:#a3e635; --ouro:#c5a059; --ciano:#00f0ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; }
  h2 { font-size:12px; margin:0 0 10px; color:var(--ouro); text-transform:uppercase; letter-spacing:.06em; }
  main { max-width:760px; margin:0 auto; padding:16px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .proj { padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .proj.on { border-color:var(--acc); }
  .item { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .feita .nome { color:#94a3b8; text-decoration:line-through; }
  .mut { color:var(--mut); font-size:12px; }
  button { font:inherit; color:#0b1020; background:var(--acc); border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .vazio { color:var(--mut); font-size:13px; }
  .aviso { font-size:12px; color:var(--mut); margin-top:8px; }
</style>
</head>
<body>
<header><h1>Checklist dos projetos</h1></header>
<main>
  <div class="card">
    <h2>Meus projetos</h2>
    <div id="projs"><div class="vazio">Carregando…</div></div>
  </div>
  <div class="card" id="cardEtapas" style="display:none">
    <h2 id="tituloEtapas">Checklist</h2>
    <div id="checklistMount"></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var CFG = window.PARTNER_CFG;
  var SB = window.sbPartner || window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  window.sbPartner = SB;

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var ME = null, ATUAL = null, PROJS = [];

  async function init() {
    var s = await SB.auth.getSession();
    if (!(s.data && s.data.session)) { location.href = 'login.html'; return; }
    var r = await SB.from('parceiros').select('id, nome_completo, role').eq('user_id', s.data.session.user.id).maybeSingle();
    ME = r.data;
    if (!ME) { $('projs').innerHTML = '<div class="vazio">Seu cadastro de parceiro não foi encontrado.</div>'; return; }
    // Lista somente os projetos em que o parceiro é colaborador (ou todos, se admin). A função já aplica a regra.
    var p = await SB.rpc('agenda_do_parceiro');
    PROJS = p.data || [];
    if (!PROJS.length) { $('projs').innerHTML = '<div class="vazio">Você não tem projetos com checklist.</div>'; return; }
    $('projs').innerHTML = PROJS.map(function (x) {
      return '<div class="proj" data-id="' + E(x.id) + '"><strong>#' + E(x.numero) + '</strong> · ' + E(x.tipo_evento || '') +
        '<br><span class="mut">' + E(x.data_evento || 'sem data') + '</span></div>';
    }).join('');
    document.querySelectorAll('#projs [data-id]').forEach(function (el) {
      el.addEventListener('click', function () { abrir(el.getAttribute('data-id')); });
    });
  }

  async function abrir(id) {
    ATUAL = PROJS.find(function (x) { return x.id === id; });
    document.querySelectorAll('#projs .proj').forEach(function (el) {
      el.classList.toggle('on', el.getAttribute('data-id') === id);
    });
    $('cardEtapas').style.display = 'block';
    $('tituloEtapas').textContent = 'Checklist · #' + ATUAL.numero;
    window.ChecklistEvento.montar($('checklistMount'), {
      propostaId: id, sb: SB, modo: ehAdmin() ? 'admin' : 'colaborador', nomeUsuario: ME.nome_completo
    });
  }

  function ehAdmin() { return /^(admin|master)$/i.test(String(ME.role || '').trim()); }

  init();
})();
</script>
</body>
</html>
