<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>432UP Partner | Redefinir Senha</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-b2b-box {
      background: linear-gradient(135deg, rgba(10, 18, 28, 0.88) 0%, rgba(14, 22, 35, 0.7) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.22);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 240, 255, 0.12);
    }
    #formAlert { display: none; }
    #formAlert.show { display: block; }
    .btn-loading { opacity: .6; pointer-events: none; }
  </style>
</head>
<body class="h-full text-slate-200 font-sans antialiased bg-[#06080c] flex items-center justify-center p-4">

  <!-- Fundo Espacial Integrado ao CSS do Projeto -->
  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <div class="w-full max-w-md glass-b2b-box p-8 rounded-3xl relative z-10">
    <div class="text-center mb-8">
      <img src="../imagens/logo.png" alt="432UP! Produções" class="h-10 w-auto mx-auto mb-3 object-contain">
      <span class="text-xs font-bold px-2.5 py-1 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 uppercase tracking-widest">Nova Senha</span>
    </div>

    <div id="formAlert" class="mb-4 p-3 rounded-xl text-xs font-semibold"></div>

    <div id="loadingState" class="text-center text-sm text-slate-400 py-6">Verificando link...</div>

    <form id="resetForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Nova senha</label>
        <input type="password" id="fSenha1" required minlength="8" placeholder="Mínimo 8 caracteres" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none transition">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Confirme a nova senha</label>
        <input type="password" id="fSenha2" required minlength="8" placeholder="Repita a senha" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none transition">
      </div>
      <button type="submit" id="btnSalvar" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition shadow-[0_0_20px_rgba(245,158,11,0.3)] mt-2">
        Salvar Nova Senha
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="partner-config.js"></script>
  <script src="../script/script.js" defer></script>
  <script>
    (function () {
      'use strict';

      function showAlert(msg, type) {
        var el = document.getElementById('formAlert');
        el.textContent = msg;
        el.className = 'mb-4 p-3 rounded-xl text-xs font-semibold show ' +
          (type === 'success'
            ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'
            : 'bg-red-500/15 text-red-300 border border-red-500/30');
      }

      /* O Supabase, ao seguir o link do e-mail, já cria uma sessão
         temporária de recuperação automaticamente (via hash da URL).
         Só precisamos confirmar que existe sessão antes de liberar o form. */
      sbPartner.auth.getSession().then(function (res) {
        document.getElementById('loadingState').classList.add('hidden');
        if (res.data && res.data.session) {
          document.getElementById('resetForm').classList.remove('hidden');
        } else {
          showAlert('Link inválido ou expirado. Solicite um novo link de recuperação na tela de login.', 'error');
        }
      });

      document.getElementById('resetForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var s1 = document.getElementById('fSenha1').value;
        var s2 = document.getElementById('fSenha2').value;

        if (s1 !== s2) {
          showAlert('As senhas não coincidem.', 'error');
          return;
        }
        if (s1.length < 8) {
          showAlert('A senha precisa ter no mínimo 8 caracteres.', 'error');
          return;
        }

        var btn = document.getElementById('btnSalvar');
        btn.classList.add('btn-loading');
        btn.textContent = 'Salvando...';

        sbPartner.auth.updateUser({ password: s1 }).then(function (res) {
          if (res.error) {
            showAlert('Erro ao salvar: ' + res.error.message, 'error');
            btn.classList.remove('btn-loading');
            btn.textContent = 'Salvar Nova Senha';
            return;
          }
          window.location.href = 'login.html?confirmado=1';
        });
      });
    })();
  </script>
</body>
</html>
