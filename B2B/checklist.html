<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Checklist · 432UP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="partner-config.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131a2e;
      --line: rgba(255,255,255,.10);
      --txt: #e2e8f0;
      --mut: #94a3b8;
      --acc: #a3e635;
      --cyan: #00f0ff;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--txt);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100%; -webkit-tap-highlight-color: transparent; }
    body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

    header {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
      background: linear-gradient(180deg, rgba(11,16,32,.97), rgba(11,16,32,.88));
      border-bottom: 1px solid var(--line); backdrop-filter: blur(16px);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .03em; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: transparent; color: var(--txt); font: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; min-height: 44px;
    }
    .btn-back:active { border-color: var(--acc); }

    .wrap { padding: 16px; max-width: 560px; margin: 0 auto; }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--acc); }
    .muted { color: var(--mut); font-size: 13px; line-height: 1.45; }

    .lista-eventos { display: flex; flex-direction: column; gap: 10px; }
    .evt {
      display: block; width: 100%; text-align: left;
      padding: 16px; border-radius: 14px; border: 1px solid var(--line);
      background: rgba(255,255,255,.03); color: var(--txt);
      font: inherit; cursor: pointer; min-height: 64px;
      transition: border-color .2s, background .2s;
    }
    .evt:active, .evt.on { border-color: var(--acc); background: rgba(163,230,53,.08); }
    .evt .tit { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .evt .meta { font-size: 12px; color: var(--mut); }
    .evt .badge {
      display: inline-block; margin-top: 8px; padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; background: rgba(163,230,53,.15); color: var(--acc);
    }
    .evt .badge.pend { background: rgba(250,204,21,.12); color: #facc15; }

    #painelChecklist { display: none; }
    #painelChecklist.visivel { display: block; }

    .topo-evt {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      margin-bottom: 14px;
    }
    .topo-evt .info { flex: 1; min-width: 0; }
    .topo-evt .info strong { display: block; font-size: 16px; margin-bottom: 2px; }
    .btn-trocar {
      flex-shrink: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: transparent; color: var(--mut); font-size: 13px; font-weight: 600;
      cursor: pointer; min-height: 44px;
    }

    .status-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px;
    }
    .status-bar span {
      padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.05); color: var(--mut);
    }
    .status-bar .ok { background: rgba(163,230,53,.15); color: var(--acc); }

    #ce-host { min-height: 120px; }

    .msg {
      text-align: center; padding: 28px 16px; color: var(--mut); font-size: 14px; line-height: 1.5;
    }
    .msg.err { color: #fca5a5; }

    /* Botões grandes do checklist (override do componente para mobile) */
    #ce-host .ce-btn {
      min-height: 44px !important; padding: 10px 16px !important; font-size: 14px !important;
      border-radius: 12px !important;
    }
    #ce-host .ce-slider { height: 64px !important; border-radius: 999px !important; }
    #ce-host .ce-knob { width: 56px !important; height: 56px !important; font-size: 26px !important; }
    #ce-host .ce-in { min-height: 44px !important; font-size: 15px !important; }
    #ce-host .ce-row { padding: 12px 0 !important; gap: 10px !important; }
  </style>
</head>
<body>
  <header>
    <button type="button" class="btn-back" id="btnVoltar" aria-label="Voltar">← Voltar</button>
    <h1>Checklist</h1>
    <div style="width:72px"></div>
  </header>

  <div class="wrap">
    <!-- Lista de eventos do parceiro -->
    <div id="painelLista">
      <div class="card">
        <h2>Seus eventos</h2>
        <p class="muted" style="margin:0 0 12px">Toque no evento para abrir o checklist operacional.</p>
        <div id="listaEventos" class="lista-eventos">
          <div class="msg">Carregando…</div>
        </div>
      </div>
    </div>

    <!-- Checklist do evento selecionado -->
    <div id="painelChecklist">
      <div class="card">
        <div class="topo-evt">
          <div class="info">
            <strong id="evtTitulo">—</strong>
            <div class="muted" id="evtMeta">—</div>
          </div>
          <button type="button" class="btn-trocar" id="btnTrocar">Trocar</button>
        </div>
        <div class="status-bar" id="statusBar"></div>
        <div id="ce-host"></div>
      </div>
    </div>
  </div>

  <script src="js/checklist-evento.js"></script>
  <script>
(function () {
  'use strict';

  var CFG = window.PARTNER_CFG;
  if (!CFG || !CFG.SB_URL) {
    document.getElementById('listaEventos').innerHTML = '<div class="msg err">Configuração ausente.</div>';
    return;
  }

  var sb = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  var E = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  var DATA = function (d) {
    if (!d) return '—';
    try { return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }); }
    catch (e) { return '—'; }
  };

  var parceiro = null;
  var eventos = [];
  var ceInstancia = null;
  var propostaAtual = null;

  document.getElementById('btnVoltar').addEventListener('click', function () {
    if (propostaAtual) {
      mostrarLista();
      return;
    }
    if (window.history.length > 1) window.history.back();
    else window.location.href = 'index.html';
  });

  document.getElementById('btnTrocar').addEventListener('click', mostrarLista);

  function mostrarLista() {
    propostaAtual = null;
    if (ceInstancia) { ceInstancia = null; }
    document.getElementById('ce-host').innerHTML = '';
    document.getElementById('painelChecklist').classList.remove('visivel');
    document.getElementById('painelLista').style.display = '';
  }

  function mostrarChecklist(p) {
    propostaAtual = p;
    document.getElementById('painelLista').style.display = 'none';
    document.getElementById('painelChecklist').classList.add('visivel');
    document.getElementById('evtTitulo').textContent = p.cliente_nome || ('Proposta #' + p.numero);
    document.getElementById('evtMeta').textContent =
      DATA(p.data_evento) + (p.horario_inicio ? ' · ' + String(p.horario_inicio).slice(0, 5) : '') +
      (p.tipo_evento ? ' · ' + p.tipo_evento : '');

    // Status rápido
    var bar = document.getElementById('statusBar');
    bar.innerHTML = '';
    if (p.status) {
      var sp = document.createElement('span');
      sp.textContent = 'Status: ' + p.status;
      bar.appendChild(sp);
    }

    // Montar checklist no modo colaborador
    var host = document.getElementById('ce-host');
    host.innerHTML = '';
    if (window.ChecklistEvento) {
      ceInstancia = window.ChecklistEvento.montar(host, {
        propostaId: p.id,
        sb: sb,
        modo: 'colaborador',
        nomeUsuario: (parceiro && (parceiro.nome_artistico || parceiro.nome_completo)) || 'colaborador'
      });
    } else {
      host.innerHTML = '<div class="msg err">Componente de checklist não carregou.</div>';
    }
  }

  async function carregarEventos() {
    var el = document.getElementById('listaEventos');

    // Sessão
    var sess = await sb.auth.getSession();
    if (!sess.data || !sess.data.session) {
      el.innerHTML = '<div class="msg err">Faça login no painel B2B para acessar o checklist.</div>';
      return;
    }
    var uid = sess.data.session.user.id;

    // Parceiro logado
    var pr = await sb.from('parceiros').select('id, nome_completo, nome_artistico, role, status')
      .eq('user_id', uid).maybeSingle();
    if (pr.error || !pr.data) {
      el.innerHTML = '<div class="msg err">Parceiro não encontrado ou não aprovado.</div>';
      return;
    }
    parceiro = pr.data;

    // Eventos em que o parceiro participa:
    // 1) propostas onde ele é o vendedor (parceiro_id)
    // 2) comissões vinculadas a ele
    // 3) agenda_reservas onde ele é o recurso
    var ids = new Set();

    var { data: minhas } = await sb.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, horario_inicio, status')
      .eq('parceiro_id', parceiro.id)
      .is('cancelada_em', null)
      .order('data_evento', { ascending: true });

    (minhas || []).forEach(function (p) { ids.add(p.id); });

    var { data: coms } = await sb.from('comissoes')
      .select('proposta_id')
      .eq('parceiro_id', parceiro.id);
    (coms || []).forEach(function (c) { if (c.proposta_id) ids.add(c.proposta_id); });

    var { data: reservas } = await sb.from('agenda_reservas')
      .select('proposta_id')
      .eq('recurso_id', parceiro.id)
      .not('proposta_id', 'is', null);
    (reservas || []).forEach(function (r) { if (r.proposta_id) ids.add(r.proposta_id); });

    var idList = Array.from(ids);
    if (!idList.length) {
      el.innerHTML = '<div class="msg">Nenhum evento atribuído a você no momento.</div>';
      return;
    }

    var { data: props, error } = await sb.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, horario_inicio, status')
      .in('id', idList)
      .is('cancelada_em', null)
      .order('data_evento', { ascending: true });

    if (error) {
      el.innerHTML = '<div class="msg err">Erro ao carregar eventos: ' + E(error.message) + '</div>';
      return;
    }

    eventos = props || [];
    if (!eventos.length) {
      el.innerHTML = '<div class="msg">Nenhum evento ativo encontrado.</div>';
      return;
    }

    // Contagem de etapas pendentes por proposta (para badge)
    var pendMap = {};
    try {
      var { data: etapas } = await sb.from('evento_etapas')
        .select('proposta_id, situacao')
        .in('proposta_id', idList);
      (etapas || []).forEach(function (e) {
        if (!pendMap[e.proposta_id]) pendMap[e.proposta_id] = { total: 0, pend: 0 };
        pendMap[e.proposta_id].total++;
        if (e.situacao === 'pendente') pendMap[e.proposta_id].pend++;
      });
    } catch (e) {}

    el.innerHTML = eventos.map(function (p) {
      var st = pendMap[p.id] || { total: 0, pend: 0 };
      var badge = st.total === 0
        ? '<span class="badge pend">Sem checklist</span>'
        : (st.pend === 0
          ? '<span class="badge">✓ Completo</span>'
          : '<span class="badge pend">' + st.pend + ' pendente' + (st.pend > 1 ? 's' : '') + '</span>');
      return '<button type="button" class="evt" data-id="' + E(p.id) + '">' +
        '<div class="tit">' + E(p.cliente_nome || ('#' + p.numero)) + '</div>' +
        '<div class="meta">' + E(DATA(p.data_evento)) +
          (p.horario_inicio ? ' · ' + E(String(p.horario_inicio).slice(0, 5)) : '') +
          (p.tipo_evento ? ' · ' + E(p.tipo_evento) : '') +
          (p.status ? ' · ' + E(p.status) : '') + '</div>' +
        badge +
        '</button>';
    }).join('');

    el.querySelectorAll('.evt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var p = eventos.find(function (x) { return x.id === id; });
        if (p) mostrarChecklist(p);
      });
    });
  }

  // Deep-link: ?proposta=uuid
  var params = new URLSearchParams(window.location.search);
  var propParam = params.get('proposta');

  carregarEventos().then(function () {
    if (propParam && eventos.length) {
      var p = eventos.find(function (x) { return x.id === propParam; });
      if (p) mostrarChecklist(p);
    }
  });
})();
  </script>
</body>
</html>
