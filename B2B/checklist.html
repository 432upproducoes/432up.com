<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Checklist · 432UP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    :root {
      --bg: #08080A; --text: #FFFFFF; --body: #E7E7EC; --mut: #9A97B0;
      --action: #00FF66; --purple: #A855F7; --pink: #FF007F; --tech: #06B6D4;
      --gold: #D4AF37; --alert: #FF4D4D; --line: rgba(255,255,255,.1);
    }
    body { background: var(--bg) !important; color: var(--text) !important; font-family: 'Inter', system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    .area {
      width: 100%; max-width: 560px; margin: 0 auto; position: relative; z-index: 2;
      padding-top: calc(var(--hdr-h, 112px) + 16px);
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }
    @media (max-width: 480px) {
      .area {
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
        max-width: 100%;
      }
      .box-full { border-radius: 18px; padding: 14px; }
      .titulo { margin: 4px 0 10px; }
    }
    html, body { height: auto !important; min-height: 100%; }
    body { overflow-y: visible !important; }
    .eyebrow { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; opacity: .72; color: var(--gold); }
    .titulo { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.1; letter-spacing: -.03em; margin: 8px 0 14px; font-weight: 800; }
    .mut { color: var(--mut); }
    .box-full {
      border-radius: 24px; padding: 20px; margin-bottom: 14px;
      background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .box-full h2 {
      font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 12px; font-weight: 800;
    }
    a.tech { color: var(--tech); text-decoration: none; font-size: 13px; font-weight: 600; }
    a.tech:hover { text-decoration: underline; }
    .lista-eventos { display: flex; flex-direction: column; gap: 10px; }
    .evt {
      display: block; width: 100%; text-align: left; padding: 16px; border-radius: 18px;
      border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
      font: inherit; cursor: pointer; transition: border-color .2s, background .2s;
    }
    .evt:active, .evt:hover { border-color: rgba(0,255,102,.4); background: rgba(0,255,102,.06); }
    .evt .tit { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .evt .meta { font-size: 12px; color: var(--mut); }
    #painel { display: none; }
    #painel.visivel { display: block; }
    .topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .topo strong { display: block; font-size: 17px; font-weight: 800; }
    .btn-voltar {
      flex-shrink: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); color: var(--mut); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-voltar:hover { border-color: rgba(255,255,255,.25); color: var(--text); }
    .status-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; }
    .status-bar span {
      padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.05); color: var(--mut); font-weight: 600;
    }
    .status-bar .ok { background: rgba(0,255,102,.14); color: var(--action); }

    .linha-tempo { position: relative; padding-left: 18px; }
    .linha-tempo::before {
      content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 2px;
      background: linear-gradient(var(--gold), rgba(212,175,55,.12));
    }
    .etapa {
      position: relative; padding: 14px; margin-bottom: 12px;
      border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    }
    .etapa::before {
      content: ""; position: absolute; left: -16px; top: 22px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--bg); border: 2px solid var(--purple);
    }
    .etapa.feita { opacity: .8; border-color: rgba(0,255,102,.28); background: rgba(0,255,102,.05); }
    .etapa.feita::before { background: var(--action); border-color: var(--action); }
    .etapa.feita .nome {
      color: var(--mut); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3);
    }
    .etapa .nome { font-size: 15px; font-weight: 700; }
    .etapa .hora { font-size: 12px; color: var(--mut); margin-top: 3px; }
    .tag-ok {
      display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 800;
      color: var(--action); background: rgba(0,255,102,.12); padding: 3px 9px; border-radius: 999px;
    }
    .slider {
      position: relative; height: 56px; border-radius: 999px; margin: 14px auto 0;
      width: 100%; max-width: 100%; overflow: hidden;
      background: rgba(0,255,102,.08); border: 1px solid rgba(0,255,102,.35);
      user-select: none; touch-action: none;
    }
    .slider-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(0,255,102,.22); }
    .slider-knob {
      position: absolute; left: 4px; top: 4px; width: 48px; height: 48px; border-radius: 50%;
      background: var(--action); color: #04120a; font-weight: 900; font-size: 22px;
      display: flex; align-items: center; justify-content: center; cursor: grab;
      box-shadow: 0 4px 16px rgba(0,255,102,.35); transform: translateX(0);
    }
    .slider-txt {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--mut); padding: 0 16px 0 52px;
      pointer-events: none; text-align: center; letter-spacing: .01em;
    }
    .slider.done { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.03); }
    .slider.done .slider-knob { background: #3f3f46; color: var(--mut); cursor: default; box-shadow: none; }

    .obs { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .obs:last-child { border-bottom: 0; }
    .msg { text-align: center; padding: 24px 12px; color: var(--mut); font-size: 14px; line-height: 1.5; }
    .msg.err { color: #fca5a5; }

    .modal-bg {
      position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.7);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.on { display: flex; }
    .modal-box {
      width: 100%; max-width: 380px; background: #0c0c12; border: 1px solid rgba(168,85,247,.28);
      border-radius: 22px; padding: 22px;
    }
    .modal-box h2 { margin: 0 0 8px; font-size: 16px; font-weight: 800; color: var(--text); }
    .modal-box p { margin: 0 0 16px; font-size: 14px; color: var(--mut); line-height: 1.45; }
    .modal-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-acoes button {
      flex: 1; min-width: 120px; font: inherit; padding: 13px 14px; border-radius: 14px;
      border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
      cursor: pointer; font-weight: 700;
    }
    .modal-acoes button.sim {
      background: var(--action); color: #04120a; border-color: var(--action); font-weight: 800;
    }
  </style>
</head>
<body class="h-full antialiased overflow-x-hidden">

  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <header id="calc-header"></header>
  <div id="mobile-menu"></div>

  <div class="flex flex-col min-h-screen relative z-10">
    <main class="area">
      <div style="margin-bottom:6px">
        <span class="eyebrow">Parceiro</span>
        <h1 class="titulo">Checklist</h1>
      </div>

      <section id="listaWrap">
        <p class="msg" id="msgLista" style="padding:8px 0 16px;text-align:left">Carregando seus eventos…</p>
        <div class="lista-eventos" id="listaEventos"></div>
      </section>

      <section id="painel">
        <div class="topo">
          <div>
            <strong id="tituloEvt">Evento</strong>
            <span id="metaEvt" class="mut" style="font-size:13px"></span>
          </div>
          <button type="button" class="btn-voltar" id="btnVoltar">← Agenda</button>
        </div>
        <div class="status-bar" id="statusBar"></div>
        <div class="box-full" style="padding:18px">
          <h2>Linha do tempo</h2>
          <div class="linha-tempo" id="linhaTempo"></div>
        </div>
        <div class="box-full">
          <h2>Observações</h2>
          <div id="listaObs" class="msg" style="padding:8px 0;text-align:left">—</div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-bg" id="modalConfirma" role="dialog" aria-modal="true" aria-label="Confirmar etapa">
    <div class="modal-box">
      <h2>Concluir etapa?</h2>
      <p id="txtConfirma">Essa ação não pode ser desfeita. Deseja marcar esta etapa como concluída?</p>
      <div class="modal-acoes">
        <button type="button" id="btnConfNao">Não</button>
        <button type="button" class="sim" id="btnConfSim">Sim, concluir</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="partner-config.js"></script>
  <script src="../script/script.js" defer></script>
  <script src="partner-header.js"></script>
  <script>
(function () {
  'use strict';
  var CFG = window.PARTNER_CFG;
  if (!CFG) {
    document.body.innerHTML = '<p style="padding:40px;color:#e2e8f0">Configuração ausente.</p>';
    return;
  }
  if (typeof window.sbPartner === 'undefined') {
    window.sbPartner = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  var SB = window.sbPartner;
  var ME = null;
  var EVENTOS = [];
  var ATUAL = null;

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  function DATA(d) {
    if (!d) return '—';
    try { return new Date(d + (String(d).length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pt-BR'); }
    catch (e) { return String(d).slice(0, 10); }
  }

  async function carregarLista() {
    var el = $('listaEventos');
    var msg = $('msgLista');
    msg.style.display = 'block';
    msg.className = 'msg';

    var sess = await SB.auth.getSession();
    if (!(sess.data && sess.data.session)) {
      msg.className = 'msg err';
      msg.textContent = 'Faça login no painel B2B.';
      return;
    }

    var pr = await SB.from('parceiros')
      .select('id, nome_completo, nome_artistico, role, status')
      .eq('user_id', sess.data.session.user.id)
      .maybeSingle();
    if (pr.error || !pr.data) {
      msg.className = 'msg err';
      msg.textContent = 'Parceiro não encontrado.';
      return;
    }
    ME = pr.data;

    var ids = new Set();
    var { data: cols } = await SB.from('projeto_colaboradores').select('proposta_id').eq('parceiro_id', ME.id);
    (cols || []).forEach(function (c) { if (c.proposta_id) ids.add(c.proposta_id); });
    var { data: minhas } = await SB.from('propostas').select('id').eq('parceiro_id', ME.id).is('cancelada_em', null);
    (minhas || []).forEach(function (p) { ids.add(p.id); });

    var idList = Array.from(ids);
    if (!idList.length) {
      msg.innerHTML = 'Nenhum evento atribuído a você.<br><br><span style="font-size:12px;opacity:.85">Admin → Projetos → Colaboradores do projeto.</span>';
      el.innerHTML = '';
      return;
    }

    var { data: props, error } = await SB.from('propostas')
      .select('id, numero, cliente_nome, tipo_evento, data_evento, horario_inicio, status')
      .in('id', idList)
      .is('cancelada_em', null)
      .order('data_evento', { ascending: true });

    if (error) {
      msg.className = 'msg err';
      msg.textContent = 'Erro ao listar: ' + error.message;
      return;
    }

    EVENTOS = props || [];
    if (!EVENTOS.length) {
      msg.textContent = 'Nenhum evento ativo.';
      el.innerHTML = '';
      return;
    }

    msg.style.display = 'none';
    el.innerHTML = EVENTOS.map(function (p) {
      return '<button type="button" class="evt" data-id="' + E(p.id) + '">' +
        '<div class="tit">#' + E(p.numero) + ' · ' + E(p.cliente_nome || 'Cliente') + '</div>' +
        '<div class="meta">' + E(p.tipo_evento || '') + ' · ' + DATA(p.data_evento) +
        (p.horario_inicio ? ' · ' + E(String(p.horario_inicio).slice(0, 5)) : '') + '</div>' +
        '</button>';
    }).join('');

    el.querySelectorAll('.evt').forEach(function (b) {
      b.addEventListener('click', function () { abrirEvento(b.getAttribute('data-id')); });
    });

    var q = new URLSearchParams(location.search).get('proposta');
    if (q) abrirEvento(q);
  }

  async function abrirEvento(id) {
    ATUAL = EVENTOS.find(function (p) { return p.id === id; }) || { id: id };
    $('listaWrap').style.display = 'none';
    $('painel').classList.add('visivel');
    $('tituloEvt').textContent = ATUAL.numero
      ? ('#' + ATUAL.numero + ' · ' + (ATUAL.cliente_nome || ''))
      : 'Evento';
    $('metaEvt').textContent = (ATUAL.tipo_evento || '') + (ATUAL.data_evento ? ' · ' + DATA(ATUAL.data_evento) : '');
    await renderChecklist();
  }

  $('btnVoltar').addEventListener('click', function () {
    /* Volta para o calendário (origem natural) — página agenda-parceiro não existe mais */
    location.href = 'admin/agenda.html';
  });

  async function renderChecklist() {
    var lt = $('linhaTempo');
    var sb = $('statusBar');
    lt.innerHTML = '<div class="msg">Carregando etapas…</div>';

    var { data: etapas, error } = await SB.from('evento_etapas')
      .select('id, nome, hora, situacao, ordem, concluida_por, concluida_em')
      .eq('proposta_id', ATUAL.id)
      .order('ordem');

    if (error) {
      lt.innerHTML = '<div class="msg err">Erro: ' + E(error.message) + '</div>';
      sb.innerHTML = '';
      return;
    }

    var lista = etapas || [];
    var pend = lista.filter(function (e) { return e.situacao === 'pendente'; }).length;
    var ok = lista.length - pend;
    sb.innerHTML = '<span>' + lista.length + ' etapas</span>' +
      (lista.length ? '<span class="ok">' + ok + ' feitas</span><span>' + pend + ' pendentes</span>' : '');

    if (!lista.length) {
      lt.innerHTML =
        '<div class="msg">Nenhuma etapa visível para o seu usuário.<br><br>' +
        '<span style="font-size:12px;opacity:.9">Se o admin vê etapas neste projeto, rode o SQL de correção da policy ' +
        '(arquivo <strong>SQL-fix-etapas-colab.sql</strong> no pacote) e recarregue.</span></div>';
    } else {
      lt.innerHTML = lista.map(function (e) {
        var feita = e.situacao === 'concluida';
        return '<div class="etapa ' + (feita ? 'feita' : '') + '">' +
          '<div class="nome">' + E(e.nome) + '</div>' +
          '<div class="hora">' + (e.hora ? E(e.hora) : 'Horário a confirmar') +
          (feita && e.concluida_por ? ' · ' + E(e.concluida_por) : '') + '</div>' +
          (feita
            ? '<span class="tag-ok">✓ Confirmada</span>'
            : '<div class="slider" data-etapa="' + E(e.id) + '"><div class="slider-fill"></div>' +
              '<div class="slider-knob" role="slider" aria-label="Deslize para confirmar">›</div>' +
              '<span class="slider-txt">Deslize para confirmar →</span></div>') +
          '</div>';
      }).join('');
      initSliders(lt);
    }

    var { data: obs } = await SB.from('evento_observacoes')
      .select('id, texto, criado_por')
      .eq('proposta_id', ATUAL.id)
      .is('removido_em', null)
      .order('criado_em');
    var lo = $('listaObs');
    if (!(obs && obs.length)) lo.innerHTML = '<div class="msg" style="padding:8px 0;text-align:left">Nenhuma observação ainda.</div>';
    else lo.innerHTML = obs.map(function (o) {
      return '<div class="obs">' + E(o.texto) +
        (o.criado_por ? ' <em style="color:var(--action);font-size:11px">(' + E(o.criado_por) + ')</em>' : '') +
        '</div>';
    }).join('');
  }

  function initSliders(root) {
    root.querySelectorAll('.slider').forEach(function (s) {
      var knob = s.querySelector('.slider-knob');
      var fill = s.querySelector('.slider-fill');
      var max = 0, startX = 0, cur = 0, dragging = false;

      function measure() { max = Math.max(0, s.clientWidth - knob.offsetWidth - 6); }
      function apply(x) {
        cur = Math.max(0, Math.min(max, x));
        knob.style.transform = 'translateX(' + cur + 'px)';
        fill.style.width = (cur + knob.offsetWidth / 2) + 'px';
      }
      function onStart(clientX) {
        if (s.classList.contains('done')) return;
        measure(); dragging = true; startX = clientX - cur; knob.style.cursor = 'grabbing';
      }
      function onMove(clientX) { if (dragging) apply(clientX - startX); }
      async function onEnd() {
        if (!dragging) return;
        dragging = false; knob.style.cursor = 'grab';
        if (max > 0 && cur / max >= 0.9) {
          apply(0);
          pedirConfirmacao(s.getAttribute('data-etapa'), s);
        } else apply(0);
      }

      knob.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        knob.setPointerCapture(ev.pointerId);
        onStart(ev.clientX);
      });
      knob.addEventListener('pointermove', function (ev) { onMove(ev.clientX); });
      knob.addEventListener('pointerup', onEnd);
      knob.addEventListener('pointercancel', function () { dragging = false; apply(0); });
    });
  }

  var _pendenteEtapaId = null;
  var _pendenteSlider = null;

  function pedirConfirmacao(etapaId, sliderEl) {
    _pendenteEtapaId = etapaId;
    _pendenteSlider = sliderEl;
    var nomeEtapa = '';
    try {
      var card = sliderEl && sliderEl.closest('.etapa');
      if (card) {
        var n = card.querySelector('.nome');
        if (n) nomeEtapa = n.textContent || '';
      }
    } catch (e) {}
    var txt = $('txtConfirma');
    if (txt) {
      txt.textContent = nomeEtapa
        ? ('Confirmar “' + nomeEtapa + '”? Essa ação não pode ser desfeita.')
        : 'Essa ação não pode ser desfeita. Deseja marcar esta etapa como concluída?';
    }
    $('modalConfirma').classList.add('on');
  }

  function fecharConfirmacao() {
    _pendenteEtapaId = null;
    _pendenteSlider = null;
    $('modalConfirma').classList.remove('on');
  }

  $('btnConfNao').addEventListener('click', function () {
    if (_pendenteSlider) {
      try {
        var kn = _pendenteSlider.querySelector('.slider-knob');
        var fl = _pendenteSlider.querySelector('.slider-fill');
        if (kn) kn.style.transform = 'translateX(0)';
        if (fl) fl.style.width = '0';
      } catch (e) {}
    }
    fecharConfirmacao();
  });

  $('btnConfSim').addEventListener('click', async function () {
    var id = _pendenteEtapaId;
    if (!id) { fecharConfirmacao(); return; }
    $('btnConfSim').disabled = true;
    await concluir(id);
    $('btnConfSim').disabled = false;
    fecharConfirmacao();
  });

  $('modalConfirma').addEventListener('click', function (e) {
    if (e.target === $('modalConfirma')) $('btnConfNao').click();
  });

  async function concluir(etapaId) {
    var nome = (ME && (ME.nome_artistico || ME.nome_completo)) || 'parceiro';
    var { error } = await SB.from('evento_etapas')
      .update({
        situacao: 'concluida',
        concluida_por: nome,
        concluida_em: new Date().toISOString()
      })
      .eq('id', etapaId)
      .eq('situacao', 'pendente');

    if (error) {
      alert('Não foi possível confirmar: ' + error.message);
      await renderChecklist();
      return;
    }
    await renderChecklist();
  }

  carregarLista();
})();
  </script>
</body>
</html>
