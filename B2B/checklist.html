<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklist · 432UP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="partner-config.js"></script>
<style>
  :root {
    --bg: #0b1020; --card: #131a2e; --line: rgba(255,255,255,.08);
    --txt: #e2e8f0; --mut: #94a3b8; --acc: #a3e635; --ouro: #c5a059;
    --ciano: #00f0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--txt); min-height: 100dvh;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; }
  a.link { color: var(--ciano); text-decoration: none; font-size: 13px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }

  .lista-eventos { display: flex; flex-direction: column; gap: 10px; }
  .evt {
    display: block; width: 100%; text-align: left; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--txt);
    font: inherit; cursor: pointer;
  }
  .evt:active, .evt.on { border-color: var(--acc); background: rgba(163,230,53,.08); }
  .evt .tit { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .evt .meta { font-size: 12px; color: var(--mut); }
  .evt .badge {
    display: inline-block; margin-top: 8px; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; background: rgba(163,230,53,.15); color: var(--acc);
  }
  .evt .badge.pend { background: rgba(250,204,21,.12); color: #facc15; }

  #painel { display: none; }
  #painel.visivel { display: block; }
  .topo {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px;
  }
  .topo strong { display: block; font-size: 16px; }
  .btn-voltar {
    flex-shrink: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; color: var(--mut); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .linha-tempo { position: relative; padding-left: 22px; }
  .linha-tempo::before {
    content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(var(--ouro), rgba(197, 160, 89, 0.1));
  }
  .etapa {
    position: relative; padding: 14px 14px 14px 16px; margin-bottom: 10px;
    border-radius: 14px; border: 1px solid var(--line); background: rgba(14, 18, 28, 0.55);
  }
  .etapa::before {
    content: ""; position: absolute; left: -17px; top: 22px; width: 12px; height: 12px;
    border-radius: 50%; background: #0b1020; border: 2px solid rgba(0, 240, 255, 0.5);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.28);
  }
  .etapa.feita {
    opacity: 0.75; border-color: rgba(163, 230, 53, 0.22); background: rgba(163, 230, 53, 0.05);
  }
  .etapa.feita::before { background: #a3e635; border-color: #a3e635; box-shadow: none; }
  .etapa.feita .nome {
    color: #94a3b8; text-decoration: line-through; text-decoration-color: rgba(148,163,184,.45);
  }
  .etapa .nome { font-size: 15px; font-weight: 700; color: #e2e8f0; }
  .etapa .hora { font-size: 12px; color: var(--mut); margin-top: 3px; }
  .tag-ok {
    display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 800;
    color: #a3e635; background: rgba(163,230,53,.12); padding: 3px 8px; border-radius: 999px;
  }
  .slider {
    position: relative; height: 52px; border-radius: 999px; margin-top: 10px; overflow: hidden;
    background: rgba(0, 240, 255, 0.06); border: 1px solid rgba(0, 240, 255, 0.35);
    user-select: none; touch-action: none;
  }
  .slider-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(0, 240, 255, 0.2); }
  .slider-knob {
    position: absolute; left: 3px; top: 3px; width: 46px; height: 46px; border-radius: 50%;
    background: #00f0ff; color: #0b1020; font-weight: 900; font-size: 22px;
    display: flex; align-items: center; justify-content: center; cursor: grab;
    box-shadow: 0 4px 14px rgba(0, 240, 255, 0.35); transform: translateX(0);
  }
  .slider-txt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--mut); padding-left: 48px; pointer-events: none;
  }
  .slider.done { border-color: rgba(163, 230, 53, 0.45); background: rgba(163, 230, 53, 0.06); }
  .slider.done .slider-knob { background: #64748b; cursor: default; box-shadow: none; }

  .obs-box { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .obs-box h2 { font-size: 12px; color: var(--ouro); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  .obs {
    display: flex; justify-content: space-between; gap: 8px; padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px;
  }
  .msg { text-align: center; padding: 28px 16px; color: var(--mut); font-size: 14px; line-height: 1.5; }
  .msg.err { color: #fca5a5; }
  .status-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; }
  .status-bar span { padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.05); color: var(--mut); }
  .status-bar .ok { background: rgba(163,230,53,.15); color: var(--acc); }
</style>
</head>
<body>
<header>
  <h1>Checklist</h1>
  <a class="link" href="agenda-parceiro.html">Minha agenda →</a>
</header>
<main>
  <section id="listaWrap">
    <p class="msg" id="msgLista" style="padding:8px 0 16px">Carregando seus eventos…</p>
    <div class="lista-eventos" id="listaEventos"></div>
  </section>

  <section id="painel">
    <div class="topo">
      <div>
        <strong id="tituloEvt">Evento</strong>
        <span id="metaEvt" style="font-size:12px;color:var(--mut)"></span>
      </div>
      <button type="button" class="btn-voltar" id="btnVoltar">← Eventos</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
    <div class="linha-tempo" id="linhaTempo"></div>
    <div class="obs-box">
      <h2>Observações</h2>
      <div id="listaObs" class="msg" style="padding:8px 0">—</div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var CFG = window.PARTNER_CFG;
  if (!CFG) {
    document.body.innerHTML = '<p style="padding:40px;color:#e2e8f0">Configuração ausente.</p>';
    return;
  }
  if (typeof window.sbPartner === 'undefined') {
    window.sbPartner = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  }
  var SB = window.sbPartner;
  var ME = null;
  var EVENTOS = [];
  var ATUAL = null;

  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  function DATA(d) {
    if (!d) return '—';
    try { return new Date(d + (String(d).length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pt-BR'); }
    catch (e) { return String(d).slice(0, 10); }
  }

  async function chamar(acao, extra) {
    var body = Object.assign({ acao: acao }, extra || {});
    var r = await SB.functions.invoke('parceiro-checklist', { body: body });
    if (r.error) {
      var det = r.error.message || 'Falha na function';
      try {
        if (r.error.context) {
          var j = await r.error.context.json();
          if (j && j.erro) det = j.erro;
        }
      } catch (e2) {}
      return { erro: det };
    }
    if (r.data && r.data.erro) return { erro: r.data.erro };
    return r.data || {};
  }

  async function carregarLista() {
    var el = $('listaEventos');
    var msg = $('msgLista');
    msg.style.display = 'block';
    var sess = await SB.auth.getSession();
    if (!(sess.data && sess.data.session)) {
      msg.className = 'msg err';
      msg.textContent = 'Faça login no painel B2B para acessar o checklist.';
      return;
    }

    var r = await chamar('eventos');
    if (r.erro) {
      msg.className = 'msg err';
      msg.textContent = r.erro;
      return;
    }
    ME = r.me || null;
    EVENTOS = r.eventos || [];
    var pendMap = r.pendMap || {};

    if (!EVENTOS.length) {
      msg.innerHTML = 'Nenhum evento atribuído a você.<br><br><span style="font-size:12px;opacity:.85">O admin precisa adicionar você em <strong>Projetos → Colaboradores do projeto</strong>.</span>';
      el.innerHTML = '';
      return;
    }

    msg.style.display = 'none';
    el.innerHTML = EVENTOS.map(function (p) {
      var st = pendMap[p.id] || { total: 0, pend: 0 };
      var badge = !st.total
        ? '<span class="badge pend">Sem etapas ainda</span>'
        : (st.pend === 0
          ? '<span class="badge">Checklist completo</span>'
          : '<span class="badge pend">' + st.pend + ' pendente' + (st.pend > 1 ? 's' : '') + '</span>');
      return '<button type="button" class="evt" data-id="' + E(p.id) + '">' +
        '<div class="tit">#' + E(p.numero) + ' · ' + E(p.cliente_nome || 'Cliente') + '</div>' +
        '<div class="meta">' + E(p.tipo_evento || '') + ' · ' + DATA(p.data_evento) +
        (p.horario_inicio ? ' · ' + E(String(p.horario_inicio).slice(0, 5)) : '') + '</div>' +
        badge + '</button>';
    }).join('');

    el.querySelectorAll('.evt').forEach(function (b) {
      b.addEventListener('click', function () { abrirEvento(b.getAttribute('data-id')); });
    });

    var q = new URLSearchParams(location.search).get('proposta');
    if (q) abrirEvento(q);
  }

  async function abrirEvento(id) {
    ATUAL = EVENTOS.find(function (p) { return p.id === id; }) || { id: id };
    $('listaWrap').style.display = 'none';
    $('painel').classList.add('visivel');
    $('tituloEvt').textContent = ATUAL.numero
      ? ('#' + ATUAL.numero + ' · ' + (ATUAL.cliente_nome || ''))
      : 'Evento';
    $('metaEvt').textContent = (ATUAL.tipo_evento || '') + (ATUAL.data_evento ? ' · ' + DATA(ATUAL.data_evento) : '');
    await renderChecklist();
  }

  function voltar() {
    ATUAL = null;
    $('painel').classList.remove('visivel');
    $('listaWrap').style.display = 'block';
    carregarLista();
  }
  $('btnVoltar').addEventListener('click', voltar);

  async function renderChecklist() {
    var lt = $('linhaTempo');
    var sb = $('statusBar');
    lt.innerHTML = '<div class="msg">Carregando etapas…</div>';

    var r = await chamar('etapas', { proposta_id: ATUAL.id });
    if (r.erro) {
      lt.innerHTML = '<div class="msg err">' + E(r.erro) + '</div>';
      sb.innerHTML = '';
      return;
    }

    var lista = r.etapas || [];
    var pend = lista.filter(function (e) { return e.situacao === 'pendente'; }).length;
    var ok = lista.length - pend;
    sb.innerHTML = '<span>' + lista.length + ' etapas</span>' +
      (lista.length ? '<span class="ok">' + ok + ' feitas</span><span>' + pend + ' pendentes</span>' : '');

    if (!lista.length) {
      lt.innerHTML = '<div class="msg">Ainda não há etapas neste evento.<br>O administrador monta o checklist no projeto.</div>';
    } else {
      lt.innerHTML = lista.map(function (e) {
        var feita = e.situacao === 'concluida';
        return '<div class="etapa ' + (feita ? 'feita' : '') + '">' +
          '<div class="nome">' + E(e.nome) + '</div>' +
          '<div class="hora">' + (e.hora ? E(e.hora) : 'Horário a confirmar') +
          (feita && e.concluida_por ? ' · ' + E(e.concluida_por) : '') + '</div>' +
          (feita
            ? '<span class="tag-ok">✓ Confirmada</span>'
            : '<div class="slider" data-etapa="' + E(e.id) + '"><div class="slider-fill"></div>' +
              '<div class="slider-knob" role="slider" aria-label="Deslize para confirmar">›</div>' +
              '<span class="slider-txt">Deslize para confirmar →</span></div>') +
          '</div>';
      }).join('');
      initSliders(lt);
    }

    var obs = r.observacoes || [];
    var lo = $('listaObs');
    if (!obs.length) lo.innerHTML = '<div class="msg" style="padding:8px 0">Nenhuma observação ainda.</div>';
    else lo.innerHTML = obs.map(function (o) {
      return '<div class="obs"><span>' + E(o.texto) +
        (o.criado_por ? ' <em style="color:#a3e635;font-size:11px">(' + E(o.criado_por) + ')</em>' : '') +
        '</span></div>';
    }).join('');
  }

  function initSliders(root) {
    root.querySelectorAll('.slider').forEach(function (s) {
      var knob = s.querySelector('.slider-knob');
      var fill = s.querySelector('.slider-fill');
      var max = 0, startX = 0, cur = 0, dragging = false;

      function measure() { max = Math.max(0, s.clientWidth - knob.offsetWidth - 6); }
      function apply(x) {
        cur = Math.max(0, Math.min(max, x));
        knob.style.transform = 'translateX(' + cur + 'px)';
        fill.style.width = (cur + knob.offsetWidth / 2) + 'px';
      }
      function onStart(clientX) {
        if (s.classList.contains('done')) return;
        measure(); dragging = true; startX = clientX - cur; knob.style.cursor = 'grabbing';
      }
      function onMove(clientX) { if (dragging) apply(clientX - startX); }
      async function onEnd() {
        if (!dragging) return;
        dragging = false; knob.style.cursor = 'grab';
        if (max > 0 && cur / max >= 0.9) {
          s.classList.add('done');
          await concluir(s.getAttribute('data-etapa'));
        } else apply(0);
      }

      knob.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        knob.setPointerCapture(ev.pointerId);
        onStart(ev.clientX);
      });
      knob.addEventListener('pointermove', function (ev) { onMove(ev.clientX); });
      knob.addEventListener('pointerup', onEnd);
      knob.addEventListener('pointercancel', function () { dragging = false; apply(0); });
    });
  }

  async function concluir(etapaId) {
    var r = await chamar('concluir', { proposta_id: ATUAL.id, etapa_id: etapaId });
    if (r.erro) {
      alert('Não foi possível confirmar: ' + r.erro);
      await renderChecklist();
      return;
    }
    await renderChecklist();
  }

  carregarLista();
})();
</script>
</body>
</html>
