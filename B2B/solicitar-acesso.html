<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>432UP Partner | Solicitar Credenciamento</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-b2b-box {
      background: linear-gradient(135deg, rgba(10, 18, 28, 0.88) 0%, rgba(14, 22, 35, 0.7) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.22);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 240, 255, 0.12);
    }
    .field-error { border-color: #EF4444 !important; }
    #formAlert { display: none; }
    #formAlert.show { display: block; }
    .btn-loading { opacity: .6; pointer-events: none; }
    #avatarPreview {
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="h-full text-slate-200 font-sans antialiased bg-[#06080c] flex items-center justify-center p-4 overflow-y-auto">

  <!-- Fundo Espacial Integrado ao CSS do Projeto -->
  <canvas id="orbit-canvas"></canvas>
  <div id="plasmaLayer" class="plasma-top-layer"></div>

  <div class="w-full max-w-lg glass-b2b-box p-8 rounded-3xl relative z-10 my-6">
    <div class="text-center mb-6">
      <img src="../imagens/logo.png" alt="432UP! Produções" class="h-10 w-auto mx-auto mb-3 object-contain">
      <span class="text-xs font-bold px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 uppercase tracking-widest">Credenciamento de Parceiros</span>
    </div>

    <div id="formAlert" class="mb-4 p-3 rounded-xl text-xs font-semibold"></div>

    <form id="cadastroForm" class="space-y-4">

      <!-- FOTO — OPCIONAL -->
      <div class="flex items-center gap-4">
        <div id="avatarPreview" class="w-16 h-16 rounded-full bg-white/5 border border-white/15 flex items-center justify-center text-2xl text-slate-500 shrink-0 overflow-hidden">
          <span id="avatarPlaceholder">📷</span>
        </div>
        <div class="flex-1">
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Foto de perfil <span class="text-slate-600 normal-case font-normal">(opcional — pode adicionar depois)</span></label>
          <input type="file" id="fAvatar" accept="image/png,image/jpeg,image/webp" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/30">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Nome Completo *</label>
          <input type="text" id="fNome" required placeholder="Seu nome" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Empresa / Agência *</label>
          <input type="text" id="fEmpresa" required placeholder="Nome da empresa" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">E-mail Corporativo *</label>
          <input type="email" id="fEmail" required placeholder="nome@empresa.com" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">WhatsApp de Contato *</label>
          <input type="tel" id="fWhatsapp" required placeholder="(11) 99999-9999" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Perfil de Atuação *</label>
        <select id="fPerfil" class="w-full bg-slate-900 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
          <option value="cerimonialista">Cerimonialista / Assessoria de Eventos</option>
          <option value="agencia_corporativa">Agência de Eventos Corporativos</option>
          <option value="produtor_independente">Produtor Independente / Arquiteto Cênico</option>
          <option value="hotelaria_espaco">Hotelaria de Luxo / Espaço de Eventos</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-white/10">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Crie uma senha *</label>
          <input type="password" id="fSenha1" required minlength="8" placeholder="Mínimo 8 caracteres" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Confirme a senha *</label>
          <input type="password" id="fSenha2" required minlength="8" placeholder="Repita a senha" class="w-full bg-white/5 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-400 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="btnEnviar" class="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition shadow-[0_0_20px_rgba(0,240,255,0.3)] mt-2">
        Enviar Solicitação B2B
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-white/10 text-center text-xs text-slate-400">
      Já possui conta aprovada?
      <a href="login.html" class="text-amber-400 font-semibold hover:underline">Voltar ao Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="partner-config.js"></script>
  <script src="../script/script.js" defer></script>
  <script>
    (function () {
      'use strict';

      var avatarFile = null;

      document.getElementById('fAvatar').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
          showAlert('A foto precisa ter no máximo 5MB.', 'error');
          e.target.value = '';
          return;
        }
        avatarFile = file;
        var reader = new FileReader();
        reader.onload = function (ev) {
          document.getElementById('avatarPlaceholder').style.display = 'none';
          document.getElementById('avatarPreview').style.backgroundImage = 'url(' + ev.target.result + ')';
        };
        reader.readAsDataURL(file);
      });

      function showAlert(msg, type) {
        var el = document.getElementById('formAlert');
        el.textContent = msg;
        el.className = 'mb-4 p-3 rounded-xl text-xs font-semibold show ' +
          (type === 'success'
            ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'
            : 'bg-red-500/15 text-red-300 border border-red-500/30');
      }

      function fieldErr(id, has) {
        document.getElementById(id).classList.toggle('field-error', !!has);
      }

      document.getElementById('cadastroForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var nome     = document.getElementById('fNome').value.trim();
        var empresa  = document.getElementById('fEmpresa').value.trim();
        var email    = document.getElementById('fEmail').value.trim();
        var whatsapp = document.getElementById('fWhatsapp').value.replace(/\D/g, '');
        var perfil   = document.getElementById('fPerfil').value;
        var senha1   = document.getElementById('fSenha1').value;
        var senha2   = document.getElementById('fSenha2').value;

        ['fNome','fEmpresa','fEmail','fWhatsapp','fSenha1','fSenha2'].forEach(function (id) { fieldErr(id, false); });

        var ok = true;
        if (!nome) { fieldErr('fNome', true); ok = false; }
        if (!empresa) { fieldErr('fEmpresa', true); ok = false; }
        if (!email || email.indexOf('@') < 1) { fieldErr('fEmail', true); ok = false; }
        if (whatsapp.length < 10) { fieldErr('fWhatsapp', true); ok = false; }
        if (senha1.length < 8) { fieldErr('fSenha1', true); ok = false; }
        if (senha1 !== senha2) { fieldErr('fSenha2', true); ok = false; }

        if (!ok) {
          showAlert('Verifique os campos destacados em vermelho.', 'error');
          return;
        }

        var btn = document.getElementById('btnEnviar');
        btn.classList.add('btn-loading');
        btn.textContent = 'Enviando...';

        /* 1) cria o usuário de autenticação */
        sbPartner.auth.signUp({
          email: email,
          password: senha1,
          options: {
            emailRedirectTo: window.location.origin + window.location.pathname.replace('solicitar-acesso.html', 'login.html?confirmado=1')
          }
        }).then(function (authRes) {
          if (authRes.error) {
            var msg = authRes.error.message.indexOf('already registered') >= 0
              ? 'Este e-mail já está cadastrado. Tente fazer login ou recuperar sua senha.'
              : 'Erro ao criar acesso: ' + authRes.error.message;
            showAlert(msg, 'error');
            btn.classList.remove('btn-loading');
            btn.textContent = 'Enviar Solicitação B2B';
            return Promise.reject('auth error');
          }

          var userId = authRes.data.user ? authRes.data.user.id : null;

          /* 2) cria o registro em parceiros, status pendente */
          return sbPartner.from('parceiros').insert({
            user_id: userId,
            nome_completo: nome,
            empresa: empresa,
            email: email,
            whatsapp: whatsapp,
            perfil: perfil,
            status: 'pendente'
          }).then(function (insRes) {
            if (insRes.error) {
              showAlert('Conta criada, mas houve um erro ao salvar seu cadastro: ' + insRes.error.message + '. Fale com o suporte.', 'error');
              btn.classList.remove('btn-loading');
              btn.textContent = 'Enviar Solicitação B2B';
              return Promise.reject('insert error');
            }

            /* 3) se tem foto, sobe pro storage (não bloqueia o fluxo se falhar) */
            if (avatarFile && userId) {
              return sbPartner.storage
                .from(PARTNER_CFG.AVATAR_BUCKET)
                .upload(userId + '/avatar.jpg', avatarFile, { upsert: true, contentType: avatarFile.type })
                .then(function () {
                  return sbPartner.from('parceiros')
                    .update({ avatar_url: partnerAvatarUrl(userId) })
                    .eq('user_id', userId);
                })
                .catch(function (err) {
                  console.warn('[432UP Partner] Upload de avatar falhou, seguindo sem foto:', err);
                });
            }
          });
        }).then(function () {
          window.location.href = 'pendente.html';
        }).catch(function (err) {
          if (err !== 'auth error' && err !== 'insert error') {
            console.error('[432UP Partner] Erro inesperado no cadastro:', err);
          }
        });
      });
    })();
  </script>

</script>




</body>
</html>
