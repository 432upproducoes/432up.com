<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeitos de Plasma Corrigidos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #d4d4d8;
        }

        /* Chave seletora (Tabs) */
        .selector-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            z-index: 10;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #a1a1aa;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        /* Container do Universo / Teste */
        .universe-stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 400px;
            background: #09090b;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            touch-action: none; /* Melhora toque em celulares */
        }

        /* Caixa simulando a Calculadora */
        .calculator-mock {
            position: relative;
            z-index: 5;
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px;
            border-radius: 16px;
            width: 80%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .calculator-mock p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 20px;
        }

        .test-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .test-btn:active {
            transform: scale(0.96);
            background: #7c3aed;
        }

        /* --- EFEITO 1: Glow Fluido Aprimorado --- */
        .effect-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, rgba(99, 102, 241, 0.15) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(25px);
            z-index: 1;
            transition: opacity 0.3s;
        }

        /* --- EFEITO 2: Onda de Clique (Ripple corrigido) --- */
        .ripple {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.8) 0%, rgba(124, 58, 237, 0.4) 50%, transparent 100%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: ripple-anim 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
            z-index: 6; /* Acima da calculadora para ver bem o toque */
        }

        @keyframes ripple-anim {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(25);
                opacity: 0;
            }
        }

        /* --- EFEITO 3: Plasma Multicor Interativo ao Toque --- */
        .plasma-touch {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(59, 130, 246, 0.2) 50%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(35px);
            z-index: 1;
            mix-blend-mode: screen;
            transition: background 0.5s;
        }
    </style>
</head>
<body>

    <h2>Seletor de Efeitos de Plasma</h2>

    <!-- Chave Seletora -->
    <div class="selector-bar">
        <button class="tab-btn active" onclick="switchEffect('glow', event)">1. Glow Aprimorado</button>
        <button class="tab-btn" onclick="switchEffect('ripple', event)">2. Onda de Toque</button>
        <button class="tab-btn" onclick="switchEffect('plasma', event)">3. Plasma Interativo</button>
    </div>

    <!-- Área Interativa -->
    <div class="universe-stage" id="stage">
        <!-- Elemento dinâmico para os efeitos -->
        <div class="effect-glow" id="dynamicEffect" style="display: block;"></div>

        <!-- Simulador da Calculadora -->
        <div class="calculator-mock">
            <p id="instructionText">Arraste ou clique para testar o Glow Aprimorado.</p>
            <button class="test-btn">Calcular Preço</button>
        </div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const dynamicEffect = document.getElementById('dynamicEffect');
        const instructionText = document.getElementById('instructionText');
        let currentEffect = 'glow';

        function switchEffect(effectName, eventObj) {
            currentEffect = effectName;
            
            // Atualiza botões
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            eventObj.target.classList.add('active');

            // Configurações específicas por aba
            if (effectName === 'glow') {
                dynamicEffect.className = 'effect-glow';
                dynamicEffect.style.display = 'block';
                instructionText.textContent = "Arraste ou clique para testar o Glow Aprimorado.";
            } else if (effectName === 'ripple') {
                dynamicEffect.style.display = 'none'; // No ripple usamos elementos criados dinamicamente no clique
                instructionText.textContent = "Clique em qualquer ponto para ver a Onda de Toque.";
            } else if (effectName === 'plasma') {
                dynamicEffect.className = 'plasma-touch';
                dynamicEffect.style.display = 'block';
                instructionText.textContent = "Toque e arraste para mover o Plasma pelo universo.";
            }
        }

        // Movimento do cursor/toque para o Glow e o Plasma
        stage.addEventListener('pointermove', (e) => {
            if (currentEffect === 'glow' || currentEffect === 'plasma') {
                const rect = stage.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                dynamicEffect.style.left = `${x}px`;
                dynamicEffect.style.top = `${y}px`;
            }
        });

        // Clique / Toque para disparar a onda (Ripple) ou interagir
        stage.addEventListener('pointerdown', (e) => {
            const rect = stage.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentEffect === 'ripple') {
                const ripple = document.createElement('div');
                ripple.classList.add('ripple');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                
                stage.appendChild(ripple);

                // Remove o elemento após a animação acabar para limpar a memória
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }
        });
    </script>
</body>
</html>
