<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Efeitos de Plasma / Universo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #d4d4d8;
        }

        /* Chave seletora (Tabs) */
        .selector-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            z-index: 10;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #a1a1aa;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        /* Container do Universo / Teste */
        .universe-stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 400px;
            background: #09090b;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Caixa simulando a Calculadora */
        .calculator-mock {
            position: relative;
            z-index: 5;
            background: rgba(18, 18, 24, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 80%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .calculator-mock p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 20px;
        }

        .test-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .test-btn:active {
            transform: scale(0.96);
            background: #7c3aed;
        }

        /* --- EFEITO 1: Glow Fluido (Segue o Toque) --- */
        .effect-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(30px);
            z-index: 1;
            transition: opacity 0.3s;
        }

        /* --- EFEITO 2: Pulso de Onda ao Clicar/Tocar --- */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, rgba(124, 58, 237, 0.1) 60%, transparent 100%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: ripple-anim 0.8s cubic-bezier(0, 0.2, 0.8, 1) forwards;
            z-index: 2;
        }

        @keyframes ripple-anim {
            to {
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }

        /* --- EFEITO 3: Nebulosa/Plasma Estático Dinâmico --- */
        .plasma-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
            z-index: 1;
            opacity: 0.8;
            animation: plasma-shift 8s ease infinite alternate;
            pointer-events: none;
        }

        @keyframes plasma-shift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(5deg); }
        }
    </style>
</head>
<body>

    <h2>Seletor de Efeitos de Toque</h2>

    <!-- Chave Seletora -->
    <div class="selector-bar">
        <button class="tab-btn active" onclick="switchEffect('glow')">1. Glow Magnético</button>
        <button class="tab-btn" onclick="switchEffect('ripple')">2. Onda ao Tocar</button>
        <button class="tab-btn" onclick="switchEffect('nebula')">3. Nebulosa Viva</button>
    </div>

    <!-- Área Interativa -->
    <div class="universe-stage" id="stage">
        <!-- Elemento dinâmico para o efeito 1 -->
        <div class="effect-glow" id="glowCursor" style="display: none;"></div>
        
        <!-- Elemento dinâmico para o efeito 3 -->
        <div class="plasma-bg" id="plasmaBg" style="display: none;"></div>

        <!-- Simulador da Calculadora -->
        <div class="calculator-mock">
            <p>Toque ou clique em qualquer lugar para testar o efeito escolhido.</p>
            <button class="test-btn">Simular Orçamento</button>
        </div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const glowCursor = document.getElementById('glowCursor');
        const plasmaBg = document.getElementById('plasmaBg');
        let currentEffect = 'glow';

        function switchEffect(effectName) {
            currentEffect = effectName;
            
            // Atualiza botões da chave seletora
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Reseta estados visuais
            glowCursor.style.display = 'none';
            plasmaBg.style.display = 'none';

            if (effectName === 'glow') {
                glowCursor.style.display = 'block';
            } else if (effectName === 'nebula') {
                plasmaBg.style.display = 'block';
            }
        }

        // Inicializa com o primeiro efeito ativo
        glowCursor.style.display = 'block';

        // Evento unificado de toque/mouse
        stage.addEventListener('pointermove', (e) => {
            if (currentEffect === 'glow') {
                const rect = stage.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                glowCursor.style.left = `${x}px`;
                glowCursor.style.top = `${y}px`;
            }
        });

        // Efeito de clique / toque direto criando a onda (Ripple)
        stage.addEventListener('pointerdown', (e) => {
            if (currentEffect === 'ripple') {
                const rect = stage.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const ripple = document.createElement('div');
                ripple.classList.add('ripple');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                
                stage.appendChild(ripple);

                // Remove o elemento após a animação acabar para não acumular lixo no DOM
                setTimeout(() => {
                    ripple.remove();
                }, 800);
            }
        });
    </script>
</body>
</html>
