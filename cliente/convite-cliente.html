<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <title>Meus convites · 432UP!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#08080A;--txt:#fff;--body:#E7E7EC;--mut:#9A97B0;--gold:#D4AF37;--purple:#A855F7;--action:#00FF66;--alert:#FF4D4D;--line:rgba(255,255,255,.1)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
    h1,h2{font-family:'Cormorant Garamond',serif;font-weight:400;margin:0}
    .wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:24px;max-width:1280px;margin:0 auto}
    @media(max-width:860px){.wrap{grid-template-columns:1fr;padding:16px}}
    .panel{background:rgba(255,255,255,.045);border:1px solid rgba(212,175,55,.3);border-radius:20px;padding:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:999px;border:1px solid rgba(212,175,55,.6);background:transparent;color:var(--gold);font:inherit;font-size:.85rem;cursor:pointer}
    .btn:hover{background:rgba(212,175,55,.1)}
    .btn.primary{background:linear-gradient(135deg,#F5D76E,#B8860B);color:#08080A;border:0;font-weight:700}
    .btn.ok{border-color:rgba(0,255,102,.6);color:var(--action)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.sm{padding:7px 12px;font-size:.78rem}
    .x{width:26px;height:26px;border-radius:999px;border:1px solid rgba(255,77,77,.4);background:rgba(255,77,77,.14);color:var(--alert);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
    .item{display:block;width:100%;text-align:left;background:rgba(8,8,10,.6);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;color:#fff;cursor:pointer;font:inherit}
    .item.on{border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.25)}
    .item small{display:block;color:var(--mut);margin-top:4px;font-size:.75rem}
    .tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;background:rgba(168,85,247,.18);color:#e9d5ff}
    .tag.pub{background:rgba(0,255,102,.14);color:var(--action)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
    .full{grid-column:1/-1}
    label{display:block;font-size:.75rem;color:var(--gold);margin-bottom:6px;letter-spacing:.04em}
    input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(212,175,55,.3);background:rgba(8,8,10,.7);color:#fff;font:inherit;font-size:.92rem}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
    textarea{min-height:90px;resize:vertical}
    .check{display:flex;align-items:center;gap:10px;color:var(--body);font-size:.9rem;margin:6px 0 0}
    .check input{width:auto}
    .cover{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(212,175,55,.3);margin-bottom:10px}
    .cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0}
    .acts{display:flex;gap:8px;flex-wrap:wrap}
    .muted{color:var(--mut);font-size:.82rem;line-height:1.5}
    .sec{margin-top:22px;padding-top:16px;border-top:1px solid rgba(212,175,55,.2)}
    .sec h2{font-size:1.4rem;margin-bottom:12px}
    .sug{margin-top:6px;font-size:.78rem;color:var(--mut)}
    .lista-linha{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .lista-linha input{flex:1}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0d0b16;border:1px solid rgba(168,85,247,.5);padding:12px 20px;border-radius:999px;font-size:.85rem;display:none;z-index:9;max-width:calc(100% - 32px);text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="panel">
      <span class="eyebrow">Área do cliente</span>
      <h2 style="font-size:1.9rem;margin:6px 0 14px">Meus convites</h2>
      <label for="novoTipo">Tipo do convite</label>
      <select id="novoTipo" style="margin-bottom:10px"></select>
      <button class="btn primary" id="btnNovo" style="width:100%;margin-bottom:14px">+ Novo convite</button>
      <div id="lista"><p class="muted">Carregando…</p></div>
    </aside>
    <main class="panel" id="editor"><p class="muted">Selecione um convite ou crie um novo.</p></main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* Chave pública (anon): pode ficar no HTML. Nunca colocar a chave de serviço aqui. */
    const CFG = {
      url: 'https://paetkspbfejtjjkngqej.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXRrc3BiZmVqdGpqa25ncWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MDU2OTgsImV4cCI6MjA4NjQ4MTY5OH0.IiYweZ2g3bP7b0o7VvBW5LLb6d1oHtSNFUZlVkIsdsA',
      worker: 'https://432up-r2-upload.432up-producoes.workers.dev/',
      capaPadrao: 'https://media.432up.com/midias/1790651227224_9ba618d5-6f86-4040-8910-5d978339a716.jpeg',
      linkConvite: 'https://www.432up.com/convite/?t='
    };
    const sb = supabase.createClient(CFG.url, CFG.anonKey);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const MAX_IMG = 10 * 1024 * 1024, MAX_VID = 20 * 1024 * 1024, MAX_SEG = 15;

    let uid = null, tipos = [], convites = [], pedidos = [], cadastro = {}, atual = null;

    const CAMPOS = [
      ['empresa','Empresa / nome fantasia'],
      ['tipo_evento','Tipo de evento'], ['data','Data'], ['hora','Início'], ['hora_fim','Término'],
      ['local','Local'], ['endereco','Endereço'], ['convidados','Nº de convidados'],
      ['frase_abertura','Frase de abertura'], ['intro','Texto de apresentação'],
      ['titulo_historia','Título da história'], ['citacao','Citação'], ['fechamento','Frase final'],
      ['traje','Traje'], ['traje_texto','Texto do traje'], ['observacao','Observação aos convidados']
    ];
    const LONGOS = ['intro','citacao','observacao','endereco'];

    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.style.display = 'block';
      clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3000);
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        $('editor').innerHTML = '<p class="muted">Faça login na área do cliente para ver seus convites.</p>';
        $('lista').innerHTML = ''; return;
      }
      uid = session.user.id;

      const t = await sb.from('convite_tipos').select('*').eq('ativo', true).order('ordem');
      tipos = t.data || [];
      $('novoTipo').innerHTML = tipos.map(x => `<option value="${esc(x.codigo)}">${esc(x.rotulo)}</option>`).join('');

      const c = await sb.rpc('convite_cadastro_do_usuario');
      cadastro = c.data || {};

      const p = await sb.from('portal_clientes').select('proposta_id, propostas(numero, cliente_nome)').eq('user_id', uid);
      pedidos = (p.data || []).filter(x => x.propostas).map(x => ({
        id: x.proposta_id, label: `Pedido #${x.propostas.numero} · ${x.propostas.cliente_nome || ''}`
      }));
      await carregar();
    }

    async function carregar(selecionarId) {
      const { data, error } = await sb.from('convites').select('*').order('atualizado_em', { ascending: false });
      if (error) { toast('Erro ao carregar: ' + error.message); return; }
      convites = data || [];
      if (convites.length) {
        const ids = convites.map(c => c.id);
        const [an, pa] = await Promise.all([
          sb.from('convite_anfitrioes').select('*').in('convite_id', ids).order('ordem'),
          sb.from('convite_padrinhos').select('*').in('convite_id', ids).order('ordem')
        ]);
        convites.forEach(c => {
          c.anf = {};
          (an.data || []).filter(a => a.convite_id === c.id).forEach(a => c.anf[a.papel] = a.nome);
          c.pad = (pa.data || []).filter(p => p.convite_id === c.id).map(p => p.nome);
        });
      }
      renderLista();
      const id = selecionarId || (atual && atual.id);
      if (id && convites.find(c => c.id === id)) abrir(id);
      else if (!atual) $('editor').innerHTML = '<p class="muted">Selecione um convite ou crie um novo.</p>';
    }

    function tipoDe(c) {
      return tipos.find(t => t.codigo === c.tipo_codigo) || { codigo: c.tipo_codigo, rotulo: c.tipo_codigo, anfitrioes: [], permite_padrinhos: false };
    }

    function titulo(c) {
      const t = tipoDe(c);
      const nomes = (t.anfitrioes || []).map(a => c.anf && c.anf[a.papel]).filter(Boolean);
      return nomes.length ? nomes.join(' & ') : ((c.dados && c.dados.empresa) || t.rotulo + ' sem nome');
    }

    function renderLista() {
      if (!convites.length) {
        $('lista').innerHTML = '<p class="muted">Nenhum convite ainda. Escolha o tipo e crie o primeiro.</p>';
        return;
      }
      $('lista').innerHTML = convites.map(c => `
        <button class="item ${atual && atual.id === c.id ? 'on' : ''}" onclick="abrir('${c.id}')">
          <span class="tag ${c.status === 'publicado' ? 'pub' : ''}">${esc(tipoDe(c).rotulo)} · ${c.status === 'publicado' ? 'Publicado' : 'Rascunho'}</span>
          <div style="margin-top:6px">${esc(titulo(c))}</div>
          <small>${c.proposta_id ? 'Vinculado a pedido' : 'Avulso'}${c.dados && c.dados.data ? ' · ' + esc(c.dados.data) : ''}</small>
        </button>`).join('');
    }

    function abrir(id) {
      atual = convites.find(c => c.id === id);
      if (!atual) return;
      renderLista();
      renderEditor();
    }

    function renderEditor() {
      const c = atual, d = c.dados || {}, r = d.rsvp || {}, t = tipoDe(c);
      const capa = d.capa_url || CFG.capaPadrao;
      const ehVideo = /\.(mp4|webm|mov)(\?|$)/i.test(capa);

      const anf = (t.anfitrioes || []).map(a => `
        <div class="full">
          <label for="anf_${esc(a.papel)}">${esc(a.rotulo)}${a.obrigatorio ? ' *' : ''}</label>
          <input id="anf_${esc(a.papel)}" data-anf="${esc(a.papel)}" value="${esc((c.anf || {})[a.papel] || '')}">
        </div>`).join('');

      const pad = t.permite_padrinhos ? `
        <div class="sec"><h2>Padrinhos</h2>
          <div id="listaPad">${(c.pad || []).map((n, i) => linhaPad(n, i)).join('')}</div>
          <button class="btn sm" onclick="addPad()">+ Adicionar padrinho</button>
        </div>` : '';

      const sugestao = cadastro.empresa || cadastro.nome_razao || '';
      const campos = CAMPOS.map(([k, rotulo]) => {
        const val = d[k] ?? '';
        const full = LONGOS.includes(k) || k === 'frase_abertura' || k === 'empresa';
        const input = LONGOS.includes(k)
          ? `<textarea id="f_${k}" data-k="${k}">${esc(val)}</textarea>`
          : `<input id="f_${k}" data-k="${k}" value="${esc(val)}" ${k === 'data' ? 'type="date"' : ''} ${k === 'hora' || k === 'hora_fim' ? 'type="time"' : ''}>`;
        const extra = k === 'empresa' && sugestao
          ? `<div class="sug">Sugestão do cadastro: <button class="btn sm" type="button" onclick="usarSugestao()">${esc(sugestao)}</button></div>` : '';
        return `<div class="${full ? 'full' : ''}"><label for="f_${k}">${rotulo}</label>${input}${extra}</div>`;
      }).join('');

      const prog = (d.programacao || []).map(p => `${p.hora || ''} | ${p.titulo || ''} | ${p.desc || ''}`).join('\n');

      const vinculo = c.proposta_id
        ? `<p class="muted">Vinculado a um pedido. Os dados importados não mudam; o que você edita aqui vale só para o convite.</p>`
        : `<div class="grid"><div class="full"><label for="selPedido">Vincular a um pedido</label>
             <select id="selPedido"><option value="">Ainda não contratei (manter avulso)</option>
             ${pedidos.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join('')}</select></div>
           <div class="full"><button class="btn" onclick="vincular()" ${pedidos.length ? '' : 'disabled'}>Vincular pedido</button></div></div>`;

      $('editor').innerHTML = `
        <div class="row">
          <div><span class="eyebrow">${esc(t.rotulo)} · ${c.proposta_id ? 'Pedido vinculado' : 'Convite avulso'}</span>
            <h2 style="font-size:2rem;margin-top:4px">${esc(titulo(c))}</h2></div>
          <div class="acts">
            <button class="btn" onclick="excluirRascunho()" ${c.status === 'publicado' ? 'disabled' : ''}>Excluir</button>
            <button class="btn ${c.status === 'publicado' ? 'ok' : ''}" onclick="publicar(${c.status !== 'publicado'})">${c.status === 'publicado' ? 'Despublicar' : 'Publicar'}</button>
            ${c.status === 'publicado' ? `<button class="btn" onclick="copiarLink()">Copiar link</button>` : ''}
            <button class="btn primary" onclick="salvar()">Salvar</button>
          </div>
        </div>

        <div class="cover">${ehVideo ? `<video src="${esc(capa)}" autoplay muted loop playsinline></video>` : `<img src="${esc(capa)}" alt="">`}</div>
        <div class="row">
          <span class="muted">Imagem até 10 MB, ou vídeo curto mudo de até ${MAX_SEG} s e 20 MB.</span>
          <div class="acts">
            <label class="btn sm" style="margin:0;cursor:pointer">Enviar capa
              <input type="file" accept="image/*,video/*" style="display:none" onchange="enviarCapa(this)"></label>
            ${d.capa_url ? `<button class="btn sm" onclick="removerCapa()">Usar capa padrão</button>` : ''}
          </div>
        </div>

        <div class="sec"><h2>Pedido</h2>${vinculo}</div>

        <div class="sec"><h2>Anfitriões</h2><div class="grid">${anf}</div></div>
        ${pad}

        <div class="sec"><h2>Dados do convite</h2><div class="grid">${campos}</div></div>

        <div class="sec"><h2>Programação</h2>
          <label for="prog">Uma linha por momento: horário | título | descrição</label>
          <textarea id="prog" rows="5">${esc(prog)}</textarea></div>

        <div class="sec"><h2>Confirmação de presença</h2>
          <div class="grid">
            <div><label for="r_limite">Limite de acompanhantes</label>
              <select id="r_limite">${[0,1,2,3,4,5].map(n => `<option value="${n}" ${Number(r.limite ?? 3) === n ? 'selected' : ''}>${n === 0 ? 'Nenhum' : 'Até ' + n}</option>`).join('')}</select></div>
            <div><label for="r_prazo">Prazo para confirmar</label><input id="r_prazo" type="date" value="${esc(r.prazo || '')}"></div>
            <label class="check"><input type="checkbox" id="r_restricao" ${r.restricao ? 'checked' : ''}> Pedir restrição alimentar ou acessibilidade</label>
            <label class="check"><input type="checkbox" id="r_mensagem" ${r.mensagem ? 'checked' : ''}> Receber mensagem para o casal</label>
          </div>
        </div>`;
    }

    function linhaPad(nome, i) {
      return `<div class="lista-linha" data-pad="${i}"><input value="${esc(nome)}" placeholder="Nome do padrinho / madrinha"><button class="x" type="button" onclick="removerPad(${i})" aria-label="Remover">✕</button></div>`;
    }
    function addPad() {
      const box = $('listaPad');
      const i = Date.now();
      box.insertAdjacentHTML('beforeend', linhaPad('', i));
    }
    function removerPad(i) {
      const el = document.querySelector(`[data-pad="${i}"]`);
      if (el) el.remove();
    }
    function usarSugestao() {
      const f = $('f_empresa');
      if (f) f.value = cadastro.empresa || cadastro.nome_razao || '';
    }

    async function salvar() {
      const dados = { ...(atual.dados || {}) };
      document.querySelectorAll('[data-k]').forEach(el => dados[el.dataset.k] = el.value.trim());
      dados.programacao = $('prog').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
        const [hora = '', titulo = '', desc = ''] = l.split('|').map(s => s.trim());
        return { hora, titulo, desc };
      });
      dados.rsvp = {
        limite: Number($('r_limite').value), prazo: $('r_prazo').value || null,
        restricao: $('r_restricao').checked, mensagem: $('r_mensagem').checked
      };
      const { error: e1 } = await sb.from('convites').update({ dados }).eq('id', atual.id);
      if (e1) return toast('Erro ao salvar: ' + e1.message);

      const anfs = [...document.querySelectorAll('[data-anf]')].map((el, i) => ({
        convite_id: atual.id, papel: el.dataset.anf, nome: el.value.trim(), ordem: i
      })).filter(a => a.nome);
      await sb.from('convite_anfitrioes').delete().eq('convite_id', atual.id);
      if (anfs.length) {
        const { error: e2 } = await sb.from('convite_anfitrioes').insert(anfs);
        if (e2) return toast('Erro nos anfitriões: ' + e2.message);
      }

      const pads = [...document.querySelectorAll('[data-pad] input')].map((el, i) => ({
        convite_id: atual.id, nome: el.value.trim(), ordem: i
      })).filter(p => p.nome);
      await sb.from('convite_padrinhos').delete().eq('convite_id', atual.id);
      if (pads.length) {
        const { error: e3 } = await sb.from('convite_padrinhos').insert(pads);
        if (e3) return toast('Erro nos padrinhos: ' + e3.message);
      }

      toast('Convite salvo');
      await carregar(atual.id);
    }

    async function criarNovo() {
      const { data, error } = await sb.rpc('convite_criar_avulso', { p_tipo: $('novoTipo').value });
      if (error) return toast('Erro ao criar: ' + error.message);
      await carregar(data);
    }

    async function vincular() {
      const p = $('selPedido').value;
      if (!p) return toast('Escolha um pedido');
      const { error } = await sb.rpc('convite_vincular', { p_convite: atual.id, p_proposta: p });
      if (error) return toast('Erro: ' + error.message);
      toast('Pedido vinculado. Campos vazios receberam os dados do pedido.');
      await carregar(atual.id);
    }

    async function publicar(on) {
      if (on) {
        const anf = atual.anf || {};
        const falta = (tipoDe(atual).anfitrioes || []).filter(a => a.obrigatorio && !(anf[a.papel] || '').trim());
        if (falta.length) return toast('Preencha: ' + falta.map(a => a.rotulo).join(', '));
      }
      const patch = on ? { status: 'publicado', publicado_em: new Date().toISOString() } : { status: 'rascunho' };
      const { error } = await sb.from('convites').update(patch).eq('id', atual.id);
      if (error) return toast('Erro: ' + error.message);
      toast(on ? 'Convite publicado' : 'Convite voltou a rascunho');
      await carregar(atual.id);
    }

    async function excluirRascunho() {
      if (!confirm('Excluir este convite? Esta ação não pode ser desfeita.')) return;
      const { error } = await sb.from('convites').delete().eq('id', atual.id);
      if (error) return toast('Erro: ' + error.message);
      atual = null;
      await carregar();
    }

    function copiarLink() {
      navigator.clipboard?.writeText(CFG.linkConvite + atual.token_publico).then(() => toast('Link copiado'));
    }

    function duracaoVideo(file) {
      return new Promise(resolve => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); resolve(v.duration); };
        v.onerror = () => resolve(Infinity);
        v.src = URL.createObjectURL(file);
      });
    }

    async function enviarCapa(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      const ehVideo = file.type.startsWith('video/');
      if (!ehVideo && !file.type.startsWith('image/')) return toast('Envie uma imagem ou um vídeo');
      if (ehVideo) {
        if (file.size > MAX_VID) return toast('Vídeo com no máximo 20 MB');
        if ((await duracaoVideo(file)) > MAX_SEG) return toast(`Vídeo com no máximo ${MAX_SEG} segundos`);
      } else if (file.size > MAX_IMG) return toast('Imagem com no máximo 10 MB');

      const { data: { session } } = await sb.auth.getSession();
      if (!session) return toast('Sessão expirada. Faça login de novo.');
      const nome = file.name.replace(/[^\w.-]/g, '_');
      const path = `convites/${uid}/${atual.id}/${Date.now()}_${nome}`;
      toast('Enviando capa…');
      try {
        const resp = await fetch(CFG.worker + '?path=' + encodeURIComponent(path), {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': file.type },
          body: file
        });
        const j = await resp.json().catch(() => null);
        if (!resp.ok || !j || !j.ok) throw new Error((j && j.error) || ('status ' + resp.status));
        const dados = { ...(atual.dados || {}), capa_url: j.url };
        const { error } = await sb.from('convites').update({ dados }).eq('id', atual.id);
        if (error) throw error;
        toast('Capa atualizada');
        await carregar(atual.id);
      } catch (err) {
        toast('Falha no envio: ' + (err.message || err));
      }
    }

    async function removerCapa() {
      const dados = { ...(atual.dados || {}) };
      delete dados.capa_url;
      const { error } = await sb.from('convites').update({ dados }).eq('id', atual.id);
      if (error) return toast('Erro: ' + error.message);
      toast('Capa padrão restaurada');
      await carregar(atual.id);
    }

    $('btnNovo').addEventListener('click', criarNovo);
    init();
  </script>
</body>
</html>
