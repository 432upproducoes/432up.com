<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua área · 432UP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../B2B/partner-config.js"></script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#070b1a; color:#e2e8f0; padding:20px; text-align:center; }
  .box { max-width:420px; } h1 { font-size:20px; } p { color:#94a3b8; font-size:14px; line-height:1.6; }
  button { margin-top:14px; padding:10px 16px; border:1px solid rgba(255,255,255,.2); background:transparent; color:#e2e8f0; border-radius:10px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>Sua área está sendo preparada</h1>
  <p>Em breve você verá aqui seu cadastro, os contratos, os comprovantes e o acompanhamento do seu evento.</p>
  <button id="sair" type="button">Sair</button>
</div>
<script>
(function () {
  var CFG = window.PARTNER_CFG;
  var SB = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, { auth: { storageKey: 'cliente-432up', persistSession: true, autoRefreshToken: true } });
  SB.auth.getSession().then(function (r) { if (!r.data || !r.data.session) location.href = 'index.html'; });
  document.getElementById('sair').addEventListener('click', async function () {
    await SB.auth.signOut(); location.href = 'index.html';
  });
})();
</script>
</body>
</html>
