<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar meu acesso · 432UP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../B2B/partner-config.js"></script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:radial-gradient(circle at 20% 10%,#2a1640,#070b1a 60%); color:#e2e8f0; padding:20px; }
  .card { width:100%; max-width:420px; background:#111a31; border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:26px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  h1 { font-size:20px; margin:0 0 4px; } .sub { font-size:13px; color:#94a3b8; margin-bottom:14px; line-height:1.5; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; margin:12px 0 5px; }
  input { width:100%; box-sizing:border-box; background:#020617; color:#e2e8f0; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:11px; font:inherit; }
  .aceite { display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:12px; color:#cbd5e1; line-height:1.5; }
  .aceite input { width:auto; margin-top:3px; }
  .aceite a { color:#22d3ee; }
  button { width:100%; margin-top:16px; padding:12px; border:none; border-radius:10px; background:#a3e635; color:#0b1020; font-weight:700; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .msg { font-size:13px; min-height:18px; margin-top:12px; color:#fca5a5; }
  .ok { color:#a3e635; }
</style>
</head>
<body>
<div class="card">
  <h1>Criar meu acesso</h1>
  <div class="sub">Use o CPF ou CNPJ e o e-mail do seu contrato. Assim confirmamos que é você. Depois, você entra com o CPF e a senha que escolher.</div>
  <form id="form">
    <label for="cpf">CPF ou CNPJ</label>
    <input id="cpf" inputmode="numeric" placeholder="CPF ou CNPJ" required>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="senha">Crie uma senha (mínimo 8 caracteres)</label>
    <input id="senha" type="password" autocomplete="new-password" minlength="8" required>
    <label for="senha2">Repita a senha</label>
    <input id="senha2" type="password" autocomplete="new-password" minlength="8" required>
    <label class="aceite"><input id="aceite" type="checkbox" required>
      <span>Li e aceito os <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="termos.html#privacidade" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label>
    <button id="btn" type="submit">Criar meu acesso</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  var CFG = window.PARTNER_CFG;
  var SB = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, { auth: { persistSession: false } });
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('t');
  if (!token) { $('msg').textContent = 'Link incompleto. Peça um novo convite à 432UP.'; $('form').style.display = 'none'; return; }

  $('cpf').addEventListener('input', function (e) {
    var d = String(e.target.value || '').replace(/\D/g, '').slice(0, 14);
    if (d.length <= 11) {
      e.target.value = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1-$2');
    } else {
      e.target.value = d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
    }
  });

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('msg').className = 'msg'; $('msg').textContent = '';
    if ($('senha').value !== $('senha2').value) { $('msg').textContent = 'As senhas não conferem.'; return; }
    $('btn').disabled = true;
    var r = await SB.functions.invoke('cliente-aceitar-convite', {
      body: {
        token: token, cpf: $('cpf').value, email: $('email').value, senha: $('senha').value,
        termos_versao: 'rascunho-1', politica_versao: 'rascunho-1'
      }
    });
    $('btn').disabled = false;
    if (r.error || (r.data && r.data.erro)) {
      $('msg').textContent = (r.data && r.data.erro) || 'Não foi possível criar o acesso. Tente novamente.'; return;
    }
    $('msg').className = 'msg ok';
    $('msg').textContent = 'Acesso criado. Agora é só entrar com o CPF e a senha.';
    setTimeout(function () { location.href = 'index.html'; }, 1800);
  });
})();
</script>
</body>
</html>
