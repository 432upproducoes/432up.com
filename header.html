<!-- HEADER INSTITUCIONAL UNIFICADO 432UP! -->
<header id="calc-header">
  <div class="logo-container">
    <a href="/" class="logo-link" aria-label="Página Inicial 432UP">
      <img src="https://www.432up.com/imagens/logo.png" alt="432UP! Produções — produção e soluções para eventos em São Paulo" class="logo-img">
    </a>
  </div>

  <!-- MENU DESKTOP EDITORIAL FECHADO -->
  <nav class="desktop-nav" aria-label="Navegação Principal">
    <a href="https://www.432up.com/aessencia.html" id="nav-essencia">A Essência</a>
    <a href="https://www.432up.com/amaestria.html" id="nav-maestria">A Maestria</a>
    <a href="https://www.432up.com/galeria.html" id="nav-galeria">Galeria</a>
    <a href="https://www.432up.com/vitrine.html" id="nav-vitrine">
      Vitrine <span id="lp-context-tag" class="lp-tag" style="display: none;"></span>
    </a>
    <a href="https://www.432up.com/calculadora" id="nav-simulador">Simulador</a>
    <a href="https://www.432up.com/mesa-de-producao" id="nav-parceiros">Parceiros</a>
    <button
      type="button"
      onclick="openLeadModal()"
      class="btn-header-cta"
      aria-label="Iniciar projeto audiovisual"
    >
      INICIAR PROJETO →
    </button>
  </nav>

  <!-- BOTÃO HAMBÚRGUER MOBILE -->
  <button
    type="button"
    class="mobile-hamburger"
    onclick="toggleMobileMenu()"
    aria-label="Abrir menu principal"
  >
    ☰
  </button>
</header>

<!-- OVERLAY MENU MOBILE EDITORIAL -->
<div
  class="mobile-menu-overlay"
  id="mobile-menu"
  aria-hidden="true"
>
  <button
    type="button"
    onclick="toggleMobileMenu()"
    style="
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    "
    aria-label="Fechar menu"
  >
    ✕
  </button>
  <a href="https://www.432up.com/aessencia.html" onclick="toggleMobileMenu()">A Essência</a>
  <a href="https://www.432up.com/amaestria.html" onclick="toggleMobileMenu()">A Maestria</a>
  <a href="https://www.432up.com/galeria" onclick="toggleMobileMenu()">Galeria</a>
  <a href="https://www.432up.com/vitrine.html" onclick="toggleMobileMenu()">Vitrine</a>
  <a href="https://www.432up.com/calculadora" onclick="toggleMobileMenu()">Simulador</a>
  <a href="https://www.432up.com/mesa-de-producao" onclick="toggleMobileMenu()">Parceiros</a>
  <button
    type="button"
    onclick="toggleMobileMenu(); openLeadModal();"
    class="btn-header-cta"
    style="
      margin-left: 0;
      padding: 12px 28px;
      width: 100%;
    "
  >
    INICIAR PROJETO →
  </button>
</div>

<!-- ESTILO COMPLEMENTAR PARA O CONTEXTO DA LP (Adicione ao seu CSS) -->
<style>
  .lp-tag {
    color: #c5a059; /* Tom dourado editorial */
    font-size: 0.75em;
    margin-left: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .desktop-nav a.active {
    color: #ffffff;
    font-weight: 600;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Mapeamento de LPs: [Nome do Arquivo HTML] : [Texto no Menu]
    const lpRoutes = {
      'casamentos.html': '/ CASAMENTOS',
      'corporativo.html': '/ CORPORATIVO',
      'formaturas.html': '/ FORMATURAS',
      'festas.html': '/ FESTAS',
      'musica-para-eventos.html': '/ MÚSICA',
      'producao-de-eventos.html': '/ PRODUÇÃO',
      'som-luz-estrutura.html': '/ SOM & LUZ',
      'seja-artista.html': '/ ARTISTAS',
      'seja-prestador.html': '/ PARCEIROS'
    };

    // 2. Identifica a página atual
    const currentPath = window.location.pathname.split('/').pop();

    // 3. Se for uma LP, acende a palavra 'Vitrine' e aplica o sufixo contextual
    if (lpRoutes[currentPath]) {
      const vitrineLink = document.getElementById('nav-vitrine');
      const tagSpan = document.getElementById('lp-context-tag');

      if (vitrineLink && tagSpan) {
        vitrineLink.classList.add('active');
        tagSpan.textContent = lpRoutes[currentPath];
        tagSpan.style.display = 'inline';
      }
    }
  });
</script>
